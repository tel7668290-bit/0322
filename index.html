<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保險證照題庫練習系統</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .screen {
            width: 100%;
            max-width: 750px;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .active-screen { display: flex; }

        h1 { font-size: 28px; color: #38bdf8; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #94a3b8; margin-bottom: 25px; font-size: 15px; }

        /* ---------------- 首頁按鈕分組與排版 ---------------- */
        .btn-group-title {
            width: 100%;
            color: #fbbf24;
            font-size: 14px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
        }

        .btn-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .main-btn {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
        }
        .start-btn { background: #38bdf8; color: #0f172a; }
        .start-btn:hover { background: #7dd3fc; transform: translateY(-2px); }
        
        .review-btn { background: #334155; color: #cbd5e1; border: 1px solid #475569; }
        .review-btn:hover { background: #475569; color: #fff; transform: translateY(-2px); }

        .subject-practice-btn { background: #6366f1; color: #ffffff; }
        .subject-practice-btn:hover { background: #818cf8; transform: translateY(-2px); }

        .subject-law-btn { background: #ec4899; color: #ffffff; } /* 桃紅色代表法規專區 */
        .subject-law-btn:hover { background: #f472b6; transform: translateY(-2px); }

        .nav-btn {
            background: #334155;
            color: #cbd5e1;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            align-self: flex-start;
            margin-bottom: 20px;
        }

        /* ---------------- 測驗畫面 ---------------- */
        .quiz-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .question-text { font-size: 19px; font-weight: bold; margin-bottom: 25px; width: 100%; line-height: 1.6; }
        
        .options-grid { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .opt-btn {
            padding: 14px;
            background: #0f172a;
            border: 2px solid #334155;
            color: #f8fafc;
            border-radius: 10px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1.4;
        }
        .opt-btn:hover:not(:disabled) { border-color: #38bdf8; }
        .correct { background: #22c55e !important; border-color: #22c55e !important; color: white !important; }
        .wrong { background: #ef4444 !important; border-color: #ef4444 !important; color: white !important; }

        .feedback-area { height: 60px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-top: 10px; text-align: center; }
        .next-btn { background: #fbbf24; color: #0f172a; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none; margin-top: 10px; }

        /* ---------------- 複習清單 ---------------- */
        .review-list { width: 100%; max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 5px; }
        .review-card { background: #0f172a; border-left: 4px solid #38bdf8; padding: 15px; border-radius: 8px; line-height: 1.5; }
        .review-card.law-card { border-left-color: #ec4899; }
        .review-card.practice-card { border-left-color: #6366f1; }
        .review-q { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #f8fafc; }
        .review-a { color: #4ade80; font-weight: bold; font-size: 15px; }

        @media(max-width: 600px) {
            .btn-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active-screen">
        <h1>📚 保險證照練習系統</h1>
        <div class="subtitle">選擇測驗科目開始練習</div>
        
        <div class="btn-group-title">綜合全科</div>
        <div class="btn-grid" style="grid-template-columns: 1fr;">
            <button class="main-btn start-btn" onclick="startTest('default')">🚀 隨機混合測試</button>
        </div>

        <div class="btn-group-title">📄 專業科目：保險實務</div>
        <div class="btn-grid">
            <button class="main-btn subject-practice-btn" onclick="startTest('practice')">✏️ 實務測驗開始</button>
            <button class="main-btn review-btn" onclick="showReview('practice')">📖 實務題庫複習</button>
        </div>

        <div class="btn-group-title">⚖️ 專業科目：保險法規</div>
        <div class="btn-grid">
            <button class="main-btn subject-law-btn" onclick="startTest('law')">⚖️ 法規測驗開始</button>
            <button class="main-btn review-btn" onclick="showReview('law')">📖 法規題庫複習</button>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <button class="nav-btn" onclick="goHome()">🏠 返回首頁</button>
        <div id="quiz-mode-title" style="font-weight: bold; margin-bottom: 10px; font-size: 18px;"></div>
        <div class="quiz-header">
            <div>進度：<span id="q-progress">0/0</span></div>
            <div>得分：<span id="q-score">0</span></div>
        </div>
        <div id="question" class="question-text">載入中...</div>
        <div id="options" class="options-grid"></div>
        <div id="feedback" class="feedback-area"></div>
        <button id="next-btn" class="next-btn" onclick="nextQuestion()">下一題 ➡️</button>
    </div>

    <div id="result-screen" class="screen">
        <h1>🎉 測驗結束</h1>
        <div id="final-score" style="font-size: 24px; color: #fbbf24; font-weight: bold; margin: 20px 0;"></div>
        <button class="main-btn start-btn" style="max-width: 300px;" onclick="goHome()">🏠 回到首頁</button>
    </div>

    <div id="review-screen" class="screen">
        <button class="nav-btn" onclick="goHome()">🏠 返回首頁</button>
        <h2 id="review-title" style="margin-top: 0; margin-bottom: 20px;">複習區</h2>
        <div id="review-container" class="review-list"></div>
    </div>

    <script>
        // ==========================================
        // 📌 題庫資料庫設定
        // ==========================================
        const defaultBank = [
            { question: "下列何者不是金融市場的主要功能？", options: ["提供金融工具交易的場所", "擔任資金需求者與供給者的橋樑", "提供交易者投機的場所", "促進投資活動的效率"], answer: "提供交易者投機的場所" }
        ];

        // 📁 專業科目：保險實務題庫
        const insurancePracticeBank = [
            { question: "行動裝置保險條款中明訂要保人/被保險人的資格。下列何者可以是行動裝置保險所規範的要保人/被保險人? 1.一般自然人; 2.一般法人; 3.未成年人; 受監護宣告成年人", options: ["1、2", "2、3", "1、3", "1、2、3"], answer: "1、2" },
            { question: "業務員在招攬行動裝置保險時需注意那些事項? 1.被保險人是否已經完全瞭解商品所承保的範圍; 2.保單條款相關的規定; 3.簽名是否為被保險人本人親簽", options: ["1、2", "1、3", "2、3", "1、2、3"], answer: "1、2、3" },
            { question: "要保人投保行動裝置保險契約時,應記載於要保書上之事項為何?", options: ["行動裝置商品名稱", "行動裝置空機建議售價", "要保人/被保險人資料", "以上皆是"], answer: "以上皆是" },
            { question: "下列何者可作為行動裝置保險之保險標的?", options: ["已購買三個月以上的行動裝置", "折價出清之福利品/良品", "全新行動裝置商品", "經原廠維修過後的行動裝置"], answer: "全新行動裝置商品" },
            { question: "行動裝置保險的保險標的為下列何者?", options: ["行動裝置本體", "另行購買之行動裝置配件", "行動裝置內所儲存之資料等", "行動裝置內所安裝之軟體"], answer: "行動裝置本體" }
        ];

        // 📁 專業科目：保險法規題庫 (從最新上傳的 PDF 完整解析匯入)
        const insuranceLawBank = [
            { question: "保險契約成立後,對於契約所約定因不可預料或不可抗力之承保危險事故所造成的損害應由下列何者負賠償責任？", options: ["被保險人", "保險人", "受益人", "要保人"], answer: "保險人" },
            { question: "我國保險法就保險分類為何？", options: ["財產保險與人身保險", "人壽保險與責任保險", "財產保險與責任保險", "以上皆非"], answer: "財產保險與人身保險" },
            { question: "下列何者屬財產保險？ ①火災保險 ②海上保險 ③責任保險 ④年金保險", options: ["①②④", "①③④", "①②③", "①②③④"], answer: "①②③" },
            { question: "依我國保險法之規定,下列何者對保險標的應具有保險利益？", options: ["要保人", "保險代理人", "業務員", "保險經紀人"], answer: "要保人" },
            { question: "被保險人係指於何時遭受損害,享有賠償請求權之人？", options: ["保險事故發生時", "保險契約成立時", "交付保險費時", "以上皆是"], answer: "保險事故發生時" },
            { question: "下列何者依法可以從事保險招攬？ ①保險業務員 ②保險代理人 ③保險經紀人 ④保險公證人", options: ["①③④", "①②④", "①②③", "①②③④"], answer: "①②③" },
            { question: "保險業務員於招攬保險時依法有何義務？ ①應出示登錄證 ②應告知授權範圍 ③提供名片", options: ["①③", "①②", "②③", "①②③"], answer: "①②" },
            { question: "下列何者不屬於業務員之保險招攬行為？", options: ["解釋保險商品內容及保單條款", "轉送要保文件及保險單", "代客戶填寫要保書", "說明填寫要保書注意事項"], answer: "代客戶填寫要保書" },
            { question: "業務員所屬公司對業務員的授權招攬行為如何行使？", options: ["應以書面為之,並載明於其登錄證上", "應以口頭為之", "書面口頭為之都可以", "應記載於人事管理規則"], answer: "應以書面為之,並載明於其登錄證上" },
            { question: "保險業務員於收取客戶保險費後挪用,可能構成下列何種罪嫌？", options: ["詐欺", "業務侵佔", "竊盜", "強盜"], answer: "業務侵佔" },
            { question: "依我國保險法之規定,保險代理人代理保險人經營業務的根據為何？", options: ["代理契約或授權書", "保險契約", "合作協定", "委任狀"], answer: "代理契約或授權書" },
            { question: "下列何者為保險經紀人依保險法規定收取之對價？", options: ["行政規費", "手續費", "佣金或報酬", "以上皆非"], answer: "佣金或報酬" }
        ];

        let currentActiveBank = []; 
        let currentModeName = "";
        let currentModeThemeColor = "";
        let currentIdx = 0;
        let score = 0;

        function goHome() { 
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.getElementById('home-screen').classList.add('active-screen');
        }

        function shuffle(array) { return [...array].sort(() => Math.random() - 0.5); }

        // ==========================================
        // 🚀 啟動測驗控制器
        // ==========================================
        function startTest(mode) {
            if (mode === 'practice') {
                currentActiveBank = shuffle(insurancePracticeBank);
                currentModeName = "📄 專業科目：保險實務";
                currentModeThemeColor = "#6366f1";
            } else if (mode === 'law') {
                currentActiveBank = shuffle(insuranceLawBank);
                currentModeName = "⚖️ 專業科目：保險法規";
                currentModeThemeColor = "#ec4899";
            } else {
                // 混和全科模式
                currentActiveBank = shuffle([...defaultBank, ...insurancePracticeBank, ...insuranceLawBank]);
                currentModeName = "🚀 隨機全科綜合測試";
                currentModeThemeColor = "#38bdf8";
            }
            
            currentIdx = 0;
            score = 0;
            const titleEl = document.getElementById('quiz-mode-title');
            titleEl.innerText = currentModeName;
            titleEl.style.color = currentModeThemeColor;

            document.getElementById('quiz-screen').classList.add('active-screen');
            document.getElementById('home-screen').classList.remove('active-screen');
            renderQuiz();
        }

        function renderQuiz() {
            if (currentIdx >= currentActiveBank.length) {
                document.getElementById('final-score').innerText = `最終得分：${score} / ${currentActiveBank.length}`;
                document.getElementById('quiz-screen').classList.remove('active-screen');
                document.getElementById('result-screen').classList.add('active-screen');
                return;
            }

            const qData = currentActiveBank[currentIdx];
            document.getElementById('q-progress').innerText = `${currentIdx + 1} / ${currentActiveBank.length}`;
            document.getElementById('q-score').innerText = score;
            document.getElementById('question').innerText = `${currentIdx + 1}. ${qData.question}`;
            
            const optArea = document.getElementById('options');
            optArea.innerHTML = '';
            
            shuffle(qData.options).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    const btns = document.querySelectorAll('.opt-btn');
                    btns.forEach(b => b.disabled = true);
                    if (opt === qData.answer) {
                        btn.classList.add('correct');
                        document.getElementById('feedback').innerHTML = "<span style='color:#4ade80'>✔ 判斷正確！</span>";
                        score++;
                    } else {
                        btn.classList.add('wrong');
                        document.getElementById('feedback').innerHTML = `<span style='color:#f87171'>✘ 答錯了！正確答案應為：${qData.answer}</span>`;
                        btns.forEach(b => { if(b.innerText === qData.answer) b.classList.add('correct'); });
                    }
                    document.getElementById('next-btn').style.display = 'block';
                };
                optArea.appendChild(btn);
            });
            document.getElementById('feedback').innerText = '';
            document.getElementById('next-btn').style.display = 'none';
        }

        function nextQuestion() { currentIdx++; renderQuiz(); }

        // ==========================================
        // 📖 複習區展示控制器
        // ==========================================
        function showReview(mode) {
            let bank, title, themeClass, titleColor;
            if (mode === 'practice') {
                bank = insurancePracticeBank;
                title = "📖 保險實務 - 完整題庫清單";
                themeClass = "practice-card";
                titleColor = "#818cf8";
            } else if (mode === 'law') {
                bank = insuranceLawBank;
                title = "📖 保險法規 - 完整題庫清單";
                themeClass = "law-card";
                titleColor = "#f472b6";
            } else {
                bank = defaultBank;
                title = "📖 預設預覽區";
                themeClass = "";
                titleColor = "#38bdf8";
            }
            
            const titleEl = document.getElementById('review-title');
            titleEl.innerText = title;
            titleEl.style.color = titleColor;

            const container = document.getElementById('review-container');
            container.innerHTML = '';

            bank.forEach((item, i) => {
                const card = document.createElement('div');
                card.className = `review-card ${themeClass}`;
                card.innerHTML = `<div class="review-q">${i+1}. ${item.question}</div><div class="review-a">正確解答：${item.answer}</div>`;
                container.appendChild(card);
            });

            document.getElementById('home-screen').classList.remove('active-screen');
            document.getElementById('review-screen').classList.add('active-screen');
        }

        // 支援 Enter 快捷鍵自動跳轉下一題
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('next-btn').style.display === 'block') {
                nextQuestion();
            }
        });
    </script>
</body>
</html>
