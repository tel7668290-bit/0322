<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小寶貝專屬題庫練習系統</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .screen {
            width: 100%;
            max-width: 750px;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            align-items: center;
            max-height: 95vh;
            overflow-y: auto;
        }
        .active-screen { display: flex; }

        h1 { font-size: 26px; color: #38bdf8; margin-top: 0; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #94a3b8; margin-bottom: 20px; font-size: 14px; text-align: center; }

        /* ---------------- 首頁專區排版設計 ---------------- */
        .section-header {
            width: 100%;
            color: #fbbf24;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
            border-bottom: 2px solid #334155;
            padding-bottom: 5px;
            letter-spacing: 1px;
        }

        .subject-card {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .subject-title {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .start-action { color: #ffffff; }
        .start-action:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        .review-action { background: #334155; color: #cbd5e1; border: 1px solid #475569; }
        .review-action:hover { background: #475569; color: #fff; transform: translateY(-2px); }

        /* 各科專屬主題色 */
        .theme-mixed { background: #38bdf8; color: #0f172a; font-size: 16px; padding: 14px; }
        .theme-practice { background: #6366f1; }
        .theme-law { background: #ec4899; }
        .theme-ethics { background: #f59e0b; }
        .theme-theory { background: #10b981; }
        .theme-finance { background: #06b6d4; }

        .nav-btn {
            background: #334155;
            color: #cbd5e1;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            align-self: flex-start;
            margin-bottom: 15px;
        }

        /* ---------------- 測驗區樣式 ---------------- */
        .quiz-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 15px;
        }
        .question-text { font-size: 18px; font-weight: bold; margin-bottom: 20px; width: 100%; line-height: 1.5; }
        
        .options-grid { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            padding: 12px 15px;
            background: #0f172a;
            border: 2px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1.4;
        }
        .opt-btn:hover:not(:disabled) { border-color: #38bdf8; background: #1e293b; }
        .correct { background: #22c55e !important; border-color: #22c55e !important; color: white !important; }
        .wrong { background: #ef4444 !important; border-color: #ef4444 !important; color: white !important; }

        .feedback-area { height: 50px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-top: 10px; text-align: center; }
        .next-btn { background: #fbbf24; color: #0f172a; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none; margin-top: 5px; }

        /* ---------------- 複習清單樣式 ---------------- */
        .review-list { width: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .review-card { background: #0f172a; border-left: 4px solid #334155; padding: 12px; border-radius: 8px; line-height: 1.5; }
        .review-q { font-size: 15px; font-weight: bold; margin-bottom: 6px; color: #f8fafc; }
        .review-a { color: #4ade80; font-weight: bold; font-size: 14px; }

        @media(max-width: 600px) {
            .btn-row { grid-template-columns: 1fr; gap: 8px; }
        }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active-screen">

        <div class="subtitle">讓小寶隨便就考到</div>

        <button class="action-btn theme-mixed" style="width: 100%; font-weight: 900;" onclick="startTest('mixed')">🎲 隨機全科大混合抽測 (各科抽10題，共50題)</button>

        <div class="section-header">📂 獨立科目測驗與複習 (每次隨機抽測30題)</div>

            <div class="btn-row">
                <button class="action-btn start-action theme-practice" onclick="startTest('practice')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('practice')">📖 完整題庫</button>
            </div>
        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #f472b6;">⚖️ 專業科目：保險法規</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-law" onclick="startTest('law')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('law')">📖 完整題庫</button>
            </div>
        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #fbbf24;">🛡️ 專業科目：職業道德</div>
            <div class="btn-row">

        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #34d399;">💡 專業科目：保險理論</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-theory" onclick="startTest('theory')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('theory')">📖 完整題庫</button>
            </div>
        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #22d3ee;">📈 專業科目：金融市場常識</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-finance" onclick="startTest('finance')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('finance')">📖 完整題庫</button>
            </div>
        </div>
    </div>

    <div id="quiz-screen" class="screen">

        </div>
        <div id="question" class="question-text">載入中...</div>
        <div id="options" class="options-grid"></div>
        <div id="feedback" class="feedback-area"></div>
        <button id="next-btn" class="next-btn" onclick="nextQuestion()">下一題 ➡️</button>
    </div>

    <div id="result-screen" class="screen">

        function startTest(mode) {
            if (mode === 'practice') {
                // 單科打亂後，安全截取最多 30 題 (若題庫不足30題則全上)
                currentActiveBank = shuffle(insurancePracticeBank).slice(0, 30);
                currentModeName = "📄 專業科目：保險實務 (隨機30題)";
                currentModeThemeColor = "#818cf8";
            } else if (mode === 'law') {
                currentActiveBank = shuffle(insuranceLawBank).slice(0, 30);
                currentModeName = "⚖️ 專業科目：保險法規 (隨機30題)";
                currentModeThemeColor = "#f472b6";
            } else if (mode === 'ethics') {
                currentActiveBank = shuffle(ethicsBank).slice(0, 30);
                currentModeName = "🛡️ 專業科目：職業道德 (隨機30題)";
                currentModeThemeColor = "#fbbf24";
            } else if (mode === 'theory') {
                currentActiveBank = shuffle(theoryBank).slice(0, 30);
                currentModeName = "💡 專業科目：保險理論 (隨機30題)";
                currentModeThemeColor = "#34d399";
            } else if (mode === 'finance') {
                currentActiveBank = shuffle(financeBank).slice(0, 30);
                currentModeName = "📈 專業科目：金融市場常識 (隨機30題)";
                currentModeThemeColor = "#22d3ee";
            } else {
                // 混和全科模式：每個科目獨立隨機抽取 10 題
                const p10 = shuffle(insurancePracticeBank).slice(0, 10);
                const l10 = shuffle(insuranceLawBank).slice(0, 10);
                const e10 = shuffle(ethicsBank).slice(0, 10);
                const t10 = shuffle(theoryBank).slice(0, 10);
                const f10 = shuffle(financeBank).slice(0, 10);
                
                // 合併 50 題後再次打亂，避免前面全是同一科
                currentActiveBank = shuffle([...p10, ...l10, ...e10, ...t10, ...f10]);
                currentModeName = "🎲 隨機全科大混合抽測 (共50題)";
                currentModeThemeColor = "#38bdf8";
            }
            
            currentIdx = 0;
            score = 0;
            const titleEl = document.getElementById('quiz-mode-title');
            titleEl.innerText = currentModeName;
            titleEl.style.color = currentModeThemeColor;

            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('quiz-screen').style.display = 'flex';
            renderQuiz();
        }

        function renderQuiz() {
            if (currentIdx >= currentActiveBank.length) {
                document.getElementById('final-score').innerText = `最終得分：${score} / ${currentActiveBank.length}`;
                document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
                document.getElementById('result-screen').style.display = 'flex';
                return;
            }

            const qData = currentActiveBank[currentIdx];
            document.getElementById('q-progress').innerText = `${currentIdx + 1} / ${currentActiveBank.length}`;
            document.getElementById('q-score').innerText = score;
            document.getElementById('question').innerText = `${currentIdx + 1}. ${qData.question}`;
            
            const optArea = document.getElementById('options');
            optArea.innerHTML = '';
            
            shuffle(qData.options).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    const btns = document.querySelectorAll('.opt-btn');
                    btns.forEach(b => b.disabled = true);
                    if (opt === qData.answer) {
                        btn.classList.add('correct');
                        document.getElementById('feedback').innerHTML = "<span style='color:#4ade80'>✔ 判斷正確！</span>";
                        score++;
                    } else {
                        btn.classList.add('wrong');
                        document.getElementById('feedback').innerHTML = `<span style='color:#f87171'>✘ 答錯了！正確答案應為：${qData.answer}</span>`;
                        btns.forEach(b => { if(b.innerText === qData.answer) b.classList.add('correct'); });
                    }
                    document.getElementById('next-btn').style.display = 'block';
                };
                optArea.appendChild(btn);
            });
            document.getElementById('feedback').innerText = '';
            document.getElementById('next-btn').style.display = 'none';
        }

        function nextQuestion() { currentIdx++; renderQuiz(); }

        // ==========================================
        // 📖 複習區展示控制器
        // ==========================================
        function showReview(mode) {
            let bank, title, titleColor;
            if (mode === 'practice') { bank = insurancePracticeBank; title = "📖 保險實務 - 完整題庫清單"; titleColor = "#818cf8"; }
            else if (mode === 'law') { bank = insuranceLawBank; title = "📖 保險法規 - 完整題庫清單"; titleColor = "#f472b6"; }
            else if (mode === 'ethics') { bank = ethicsBank; title = "📖 職業道德 - 完整題庫清單"; titleColor = "#fbbf24"; }
            else if (mode === 'theory') { bank = theoryBank; title = "📖 保險理論 - 完整題庫清單"; titleColor = "#34d399"; }
            else if (mode === 'finance') { bank = financeBank; title = "📖 金融市場常識 - 完整題庫清單"; titleColor = "#22d3ee"; }
            
            const titleEl = document.getElementById('review-title');
            titleEl.innerText = title;
            titleEl.style.color = titleColor;

            const container = document.getElementById('review-container');
            container.innerHTML = '';

            bank.forEach((item, i) => {
                const card = document.createElement('div');
                card.className = "review-card";
                card.style.borderLeftColor = titleColor;
                card.innerHTML = `<div class="review-q">${i+1}. ${item.question}</div><div class="review-a">正確解答：${item.answer}</div>`;
                container.appendChild(card);
            });

            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('review-screen').style.display = 'flex';
        }

        // 支援 Enter 快捷鍵自動跳轉下一題
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('next-btn').style.display === 'block') {
                nextQuestion();
            }
        });
    </script>
</body>
</html>
