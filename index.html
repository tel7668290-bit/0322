{id:1,question:"金融從業人員從事保險招攬行為，下列那一項是錯的？",options:{"A":"解釋保險商品內容及保單條款","B":"說明填寫要保書注意事項、轉送要保文件及保險單","C":"經所屬公司授權從事保險招攬行為","D":"可以向未經授權公司從事保險招攬行為"},answer:"D"},
{id:2,question:"金融從業人員從事保險招攬所用文書、圖畫、廣告文宣，下列那一項是錯的？",options:{"A":"應標明所屬公司之名稱","B":"所屬公司為代理人、經紀人者並應標明往來保險業名稱","C":"保險代理人、經紀人所屬業務員所使用之文書、圖書、廣告文宣，應經往來保險業同意方可使用","D":"廣告文宣之內容可任意將保險業報經主管機關審查通過之保單條款、費率及要保書文件予以更改"},answer:"D"},
{id:3,question:"金融從業人員於保險業務員登錄後，應專為下列何者從事保險招攬？",options:{"A":"自己","B":"要保人","C":"所屬公司","D":"保險人"},answer:"C"},
{id:4,question:"金融從業人員從事保險業務招攬時，對不特定之第三人散播不實言論或文宣，擾亂金融秩序或其他公司營業、信譽，所屬公司如何處分？",options:{"A":"罰鍰處分","B":"減薪處分","C":"停止招攬1年","D":"不需再作其他處分"},answer:"C"},
{id:5,question:"金融從業人員，從事保險業務招攬時，將本人之登錄證提供他人進行招攬、掛名或其他使用者，會受到何處分？",options:{"A":"註銷保險業務員登錄","B":"停止招攬6個月","C":"停止招攬10個月","D":"停止招攬1年"},answer:"B"},
{id:6,question:"金融從業人員應以公司專業、形象及服務等招攬客戶：",options:{"A":"不得惡意毀謗競爭者","B":"不得惡意削價方式招攬","C":"避免於報章雜誌刊登誇大不實廣告誘導客戶","D":"以上敘述皆正確"},answer:"D"},
{id:7,question:"金融從業人員如有多年市場交易經驗",options:{"A":"可以與客戶簽署任何獲利保證之契約","B":"可以逕自代客操作","C":"可以多層次傳銷方式進行","D":"以上皆不可為之"},answer:"D"},
{id:8,question:"金融從業人員為客戶辦理開戶作業時：",options:{"A":"應告知客戶金融商品之風險","B":"毋須告知客戶交易風險","C":"應告知客戶金融商品絕無風險","D":"應告知客戶金融商品交易風險有限"},answer:"A"},
{id:9,question:"證券商之業務人員從事業務招攬，下列何者為錯誤的業務招攬行為？",options:{"A":"不得對過去投資分析之績效作誇大不實之宣傳","B":"任意提供主觀性之投資情報","C":"對有價證券之募集，不得提供未來投資成果之預告","D":"不得對不特定人以收取不相當之對價參加理財投資分析活動，以招攬客戶"},answer:"B"},
{id:10,question:"證券商之業務人員辦理客戶開戶及徵信時，應該抱持何種態度？",options:{"A":"由於客戶與自己存在親戚關係，所以審查過程可以盡量寬鬆","B":"由於客戶與自己有過節，所以採取嚴格的態度","C":"為了提高客戶投資的意願，因此，本身可以代替其填全部資料，以省去作業程序","D":"以上皆非"},answer:"D"},
{id:11,question:"證券商之業務人員招攬業務時，應該如何做，才能提高本身的業績？",options:{"A":"自己掏錢買禮物送給客戶","B":"勤練話術，以博取客戶的信任","C":"培養本身的專業，以專業與誠心來面對及服務客戶","D":"提供上市上櫃公司內線消息給客戶"},answer:"C"},
{id:12,question:"證券商於開業前需加入證券商同業公會並簽署會員自律公約，下列何者是屬於證券商會員應共同信守的基本要求？",options:{"A":"不得以不當之方法直接或間接阻礙其他會員之業務發展或參與公平之競爭","B":"為取得競爭優勢，不擇手段向同業大量挖角","C":"為爭取業績，採取不合理、不正當之價格競爭行為","D":"為顧及同業和諧，對同業之違規行為，即使知情，亦不應主動檢舉"},answer:"A"},
{id:13,question:"證券商從事廣告、業務招攬及營業促銷活動，下列何者為正確？",options:{"A":"應依社會一般道德、誠實信用原則","B":"應依保護投資人之精神","C":"應維持公正之證券交易市場","D":"以上皆是"},answer:"D"},
{id:14,question:"證券商從事廣告、業務招攬及營業促銷活動，不得有下列何種行為？",options:{"A":"違背或牴觸證券法規","B":"藉主管機關核准，作為保證獲利之宣傳","C":"為競爭目的，散布損害他人營業信譽之廣告","D":"以上皆是"},answer:"D"},
{id:15,question:"金融從業人員辦理充分瞭解客戶作業，應充分知悉並評估客戶之狀況，下列何者為是？",options:{"A":"應充分知悉並評估客戶之投資知識及投資經驗","B":"應充分知悉並評估客戶之財務狀況","C":"應充分知悉並評估客戶之承受投資風險程度","D":"以上皆是"},answer:"D"},
{id:16,question:"以下何者為金融服務業向不特定多數人之銷售行為？",options:{"A":"透過發言人公佈商品內容","B":"透過新聞稿通知媒體商品內容","C":"於傳播媒體宣傳金融商品","D":"以上皆是"},answer:"D"},
{id:17,question:"金融從業人員招攬業務時，下列行為何者是正確的？",options:{"A":"得以電子郵件促銷未經主管機關核准的業務","B":"得以網路向多數人推薦國內私募基金","C":"為爭取業績，應極力推銷收益率最高的商品而避談風險","D":"客戶簽約前應向客戶說明契約內容"},answer:"D"},
{id:18,question:"金融從業人員招攬業務時，下列何者不宜？",options:{"A":"作保證獲利或負擔損失之表示","B":"以獲利招攬業務必須同時說明其風險","C":"使用公司名稱應清楚、明確且不得誤導客戶","D":"如涉及比較其他同業應為客觀公平之比較"},answer:"A"},
{id:19,question:"金融從業人員從事業務推廣與招攬時，應秉持之原則，下列何者為錯誤？",options:{"A":"誠實信用原則","B":"客戶資料保密原則","C":"利益迴避原則","D":"利潤至高原則"},answer:"D"},
{id:20,question:"金融從業人員下列行為何者為非？",options:{"A":"主動提供商品相關資訊","B":"私下接受客戶禮品及招待","C":"寄送生日卡片","D":"適時的電話問候"},answer:"B"},
{id:21,question:"金融從業人員向供應商或客戶建議或徵求業務時，下列何種行為是被禁止的？",options:{"A":"提出任何對等交換的建議","B":"表示可能因為對方不接受而取消服務或業務","C":"可能因為對方的接受而給予特別的服務或業務","D":"以上皆是"},answer:"D"},
{id:22,question:"金融從業人員與客戶維持良好關係，最主要的基礎是？",options:{"A":"有服務的熱誠與專業能力","B":"經常送禮","C":"提供內線消息","D":"以上皆非"},answer:"A"},
{id:23,question:"金融從業人員在行銷商品時應考慮？",options:{"A":"行銷佣金或津貼較多的商品，以提高自己的收入","B":"行銷高風險金融商品，以爭取業績","C":"深入了解客戶需求，提供對客戶最有利最合適的商品","D":"配合公司的營業方針，推展利潤高的商品"},answer:"C"},
{id:24,question:"金融從業人員對於客戶於填寫相關資料時，若發現客戶有違反告知之情事應如何處理？",options:{"A":"事不關己，不要理他","B":"即時向客戶求證其真實性","C":"協助造假","D":"自己改正"},answer:"B"},
{id:25,question:"金融從業人員若有發生所推薦產品與消費者需求衝突時應如何處理？",options:{"A":"以公司產品為優先","B":"將產品說成與客戶需求相同","C":"以客戶需求為最優先原則","D":"以自己所獲報酬為優先考量"},answer:"C"},
{id:26,question:"銀行受理開戶時，應實施雙重身分證明文件查核及留存該身分證明文件。若屬個人開戶，下列那些證件可以當作證明文件？",options:{"A":"戶口名簿","B":"駕照","C":"健保卡","D":"以上皆是"},answer:"D"},
{id:27,question:"有關金融從業人員之行銷行為，下列何者有誤？",options:{"A":"應充分告知客戶產品之性質與內容","B":"推廣文宣應清楚、公正及不誤導投資人","C":"應遵守相關法令規定","D":"可自行勾選未經客戶同意申請之事項"},answer:"D"},
{id:28,question:"金融從業人員推廣業務時，應遵守下列何種事項？",options:{"A":"注意服裝儀容","B":"配帶明確標示公司名稱之名牌及名片","C":"應妥善保管申請人資料，不得挪作他用","D":"以上皆是"},answer:"D"},
{id:29,question:"金融從業人員執行業務時，不應有下列何種行為？",options:{"A":"登載損害同業信譽之廣告","B":"故意毀損同業之申請書架","C":"故意破壞同業之各項宣傳品","D":"以上皆是"},answer:"D"},
{id:30,question:"銀行受理開戶時，下列何者為非？",options:{"A":"應核對開戶人確為本人","B":"由開戶人依約定當面親自簽名或蓋章","C":"留存開戶人身分證影本","D":"自行勾選未經客戶同意申請之事項"},answer:"D"},
{id:31,question:"有關金融從業人員之業務推廣文宣，下列何者為意？",options:{"A":"推廣文宣應清楚、公正及不誤導投資人","B":"推廣文宣應讓投資人能適當瞭解產品所涉風險","C":"推廣文宣應避免誤導消費者不正確之價值及理財觀念","D":"以上皆主"},answer:"D"},
{id:32,question:"金融服務業從事投顧業務時舉辦投資說明會時，若發表證券市場之投資意見涉及何種事項時應同時說明研判依據？",options:{"A":"市場分析","B":"產業趨勢","C":"行情研判","D":"以上皆是"},answer:"D"},
{id:33,question:"以下金融從業人員從事投信投顧之業務推廣與招攬行為，哪一項是明顯地違反所謂「公平競爭原則」？",options:{"A":"提供客戶基金申購手續費優惠來促銷新基金","B":"散佈同業之不實資料","C":"提供客戶有關同業與自己公司類似產品及手續費或經理費費率差異比較表","D":"以上皆是"},answer:"B"},
{id:34,question:"金融服務業從事投顧業務舉辦投資講習會，應遵守那些原則？",options:{"A":"不提供涉及個股未來買賣價位研判","B":"不散布誇大資料取信他人","C":"不對不特定人涉及指數預期","D":"以上皆是"},answer:"D"},
{id:35,question:"欣欣證券投資信託（股）公司如擬於平面刊登廣告，其警語表示方式應注意以下哪幾點？",options:{"A":"以粗體印刷顯著標示","B":"不得小於廣告上其他部分之最小字體","C":"一般人在快速閱覽相關廣告時，均顯而易見","D":"以上皆是"},answer:"D"},
{id:36,question:"有關會員及其銷售機構從事廣告及營業活動行為規範所稱之「廣告」，何項敘述不正確？",options:{"A":"以促進業務為目的","B":"發佈新聞稿","C":"基金收益分配公告","D":"運用傳播媒體為工具"},answer:"C"},
{id:37,question:"下列何者不是證券投信公司的基金銷售機構？",options:{"A":"票券業","B":"證券經紀商","C":"人身保險業","D":"銀行"},answer:"A"},
{id:38,question:"證券投資信託基金銷售機構的責任包括？",options:{"A":"應充分知悉客戶之風險承受度","B":"完成申購前交付簡式公開說明書","C":"注意客戶疑似洗錢之行為","D":"以上皆是"},answer:"D"},
{id:39,question:"金融從業人員於登錄後，應於期滿前辦妥換發登錄證手續，未辦妥前不得為保險之招攬。下列何者為登錄證之有效期間？",options:{"A":"2年","B":"3年","C":"4年","D":"5年"},answer:"D"},
{id:40,question:"保險經紀人，應基於下列何者利益，代向保險人洽訂保險契約？",options:{"A":"要保人","B":"被保險人","C":"受益人","D":"保險人"},answer:"B"},
{id:41,question:"金融從業人員從事保險業務招攬時依法有何義務？A．應出示登錄證 B．應告知授權範圍 C.提供名片",options:{"A":"AC","B":"AB","C":"BC","D":"ABC"},answer:"B"},
{id:42,question:"客戶投保傷害險後由公務員退休轉為從事建築臨時工維生，金融從業人員得知後應如何正確處理？",options:{"A":"與保險無關不必理會","B":"工作辛苦危險，應規勸另覓良職","C":"立即要求客戶向保險公司提出工作變更批改申請","D":"立即請客戶退保"},answer:"C"},
{id:43,question:"客戶投保後提出終止保險契約之申請，金融從業人員應如何正確處理？",options:{"A":"提出違約之告訴","B":"可拒絕之","C":"從業人員僅從事招攬工作，故不在服務範圍之內","D":"強制汽車責任保險除有法定原因外，不得終止契約，其他保險則應儘力解說保險重要，如仍欲終止，應同意並協助辦理"},answer:"D"},
{id:44,question:"以下何者是根據契約或授權書，向保險公司收取費用，並代理經營業務之金融從業人員？",options:{"A":"保險經紀人","B":"保險公證人","C":"保險代理人","D":"以上皆是"},answer:"C"},
{id:45,question:"以下何者為不得從事保險業招攬之金融從業人員？",options:{"A":"保險業務員","B":"保險公證人","C":"保險代理人","D":"保險經紀人"},answer:"B"},
{id:46,question:"金融從業人員於受理客戶買賣時：",options:{"A":"不可以有進行對作或跟單之行為","B":"同意客戶不需要出具授權書，可以提供帳戶供他人使用","C":"為規避繳稅，提供自己或他人帳戶供客戶使用","D":"為牟取客戶最大利益，逕行為客戶設定獲利、停損點"},answer:"A"},
{id:47,question:"金融從業人員當知悉客戶有操縱金融市場之意圖時：",options:{"A":"仍可接受其委託進行金融商品交易","B":"不可接受其委託進行金融商品交易","C":"有條件地接受其委託進行金融商品交易","D":"經主管同意即可接受其委託進行金融商品交易"},answer:"B"},
{id:48,question:"張三的客戶因期貨交易失利，決定全數出金，張三應如何交付客戶剩餘的權利金：",options:{"A":"以轉帳方式撥款至與客戶書面約定之存款帳戶","B":"以轉帳方式撥款至客戶來電時指示之存款帳戶","C":"以現金方式請客戶親臨期貨商簽收確認","D":"以支票禁背方式請客戶親臨期貨商簽收確認"},answer:"A"},
{id:49,question:"如客戶對金融商品無交易意願，金融從業人員為業績考量應：",options:{"A":"將其從客戶名單刪除，不再提供服務","B":"了解客戶的需求，找尋適合客戶的商品","C":"與客戶約定損失共同承擔，勸誘交易","D":"將客戶轉由其他從業人員服務"},answer:"B"},
{id:50,question:"證券商之業務人員從事法令規定證券業務所為之行為，下列敘述何者為正確？",options:{"A":"證券商之業務人員所為之行為屬於該業務人員個人之行為，與證券商無關","B":"證券商之業務人員所為之行為不屬於該證券商授權範圍內之行為","C":"證券商之業務人員所為之行為，視為該證券商授權範圍內之行為","D":"證券商之業務人員所為之行為是否為該證券商授權範圍，應由法院判定"},answer:"C"},
{id:51,question:"依現行法令規定，證券商辦理財富管理業務，提供接受高凈值客戶執行資產配置之服務，是基於何種法律關係及基礎辦理此項業務？",options:{"A":"以信託方式辦理","B":"以相互信任方式辦理","C":"完全依客戶指示方式辦理","D":"任由業務人員自由決定方式辦理"},answer:"A"},
{id:52,question:"證券商辦理客戶開戶買賣有價證券，要注意事項為何？",options:{"A":"與客戶簽訂受託買賣有價證券契約並辦妥開戶手續","B":"應指派專人作契約內容之說明及有關證券買賣程序之講解","C":"對客戶辦理徵信並詳實評估客戶的投資能力","D":"以上皆是"},answer:"D"},
{id:53,question:"金融從業人員與客戶以簽約方式受託執行業務，以下何者為是？",options:{"A":"應依主管口頭指示辦理","B":"應依業務績效考量辦理","C":"應依與客戶簽訂契約之本旨辦理","D":"應依公司之最大利益辦理"},answer:"C"},
{id:54,question:"金融從業人員與客戶以簽約方式受託執行業務，以下何者為是？",options:{"A":"應依契約所定運用範圍執行投資或交易","B":"雖非為契約約定投資範圍，應爭取市場先機先行投資","C":"如違反契約約定，應經客戶口頭同意才可執行","D":"如逾越契約運用範圍得於事後通知客戶"},answer:"A"},
{id:55,question:"金融從業人員受客戶委託從事投資時，不得有以下何種行為？",options:{"A":"故意誤導客戶所投資運用標的之風險","B":"對投資產品之價值故意為錯誤之記錄","C":"故意誤導受益人有關所投資運用商品應收取之費用","D":"以上皆是"},answer:"D"},
{id:56,question:"金融從業人員受客戶委託執行業務，如具有投資運用決定權，不得兼任以下何種業務？",options:{"A":"兼任投資執行人員","B":"兼任投資資產保管人員","C":"兼任投資交割人員","D":"以上皆是"},answer:"D"},
{id:57,question:"以下何者是正確的？",options:{"A":"客戶不得請求閱覽其帳戶明細","B":"客戶不得請求對事務處理情形提供說明","C":"經客戶請求，應於合理營業時間內對事務之處理情形提供說明","D":"客戶財產帳冊屬於業務機密，客戶不得請求閱覽"},answer:"C"},
{id:58,question:"金融從業人員之職責要求，下列何者正確？",options:{"A":"只照顧自己親朋好友","B":"只照顧行員","C":"公平對待所有客戶，而不偏袒某一客戶","D":"只照顧VIP客戶"},answer:"C"},
{id:59,question:"金融從業人員受託執行業務時，下列何者為非？",options:{"A":"客戶利益置於公司或個人的利益之上","B":"受託人必須揭露與客戶的利益衝突","C":"受託人應公平對待所有客戶，不得偏袒某一客戶","D":"受託人應以公司之利益為最高利益"},answer:"D"},
{id:60,question:"接受客戶受託執行之業務，何者得為之？",options:{"A":"明顯違反相關法令規定者","B":"收受客戶酬庸，而未損及公司利益者","C":"未經主管機關核准承辦之業務活動","D":"符合相關法令規定，且業經主管機關核准之業務"},answer:"D"},
{id:61,question:"金融從業人員不應該有下列何種行為？",options:{"A":"以職務上所知悉消息，告知第三人","B":"不得利用客戶名義或帳戶，為自己或第三人買賣","C":"不得有隱瞞、利誘客戶之行為","D":"接受客戶委託買賣時，不得以自己之計算為買入或賣出之相對行為"},answer:"A"},
{id:62,question:"金融從業人員於受託執行業務時，下列何者正確？",options:{"A":"盡一切可能確認並瞭解客戶的需求，如同處理自己業務一般","B":"盡全力持守榮譽及廉潔以維護所屬公司之信譽","C":"應遵守專業行為規範","D":"以上皆是"},answer:"D"},
{id:63,question:"金融從業人員基於職業道德應如何對待客戶，下列何者行為是不對的？",options:{"A":"公平對待所有的客戶","B":"將客戶的利益置於公司利益或員工利益之上","C":"將公司利益或員工利益置於客戶的利益之上","D":"以客戶最高利益行事"},answer:"C"},
{id:64,question:"下列何者屬善良管理人之原則？",options:{"A":"為客戶適度分散投資風險","B":"集中購買單一投資商品","C":"以高獲利高風險商品為推介目標","D":"未告知投資風險"},answer:"A"},
{id:65,question:"金融從業人員應以自己的專業知識替客戶選擇合適的商品，在執行時應遵守之原則為？",options:{"A":"最大誠信原則","B":"從業人員利益最大化原則","C":"金融商品風險最大化原則","D":"以上皆是"},answer:"A"},
{id:66,question:"金融商品風險高低不同，對屬於保守型之客戶，從業人員應推薦之商品為何？",options:{"A":"穩健保守型商品","B":"高風險高報酬商品","C":"目前公司主力推薦之商品","D":"公司所有之商品"},answer:"A"},
{id:67,question:"有關金融從業人員辦理全權委託業務，下列陳述何者有誤？",options:{"A":"不得從事足以損害委任人權益之交易","B":"得對無權過問之同仁洩漏客戶資料","C":"不得違反契約、內部作業規範、內部控制等行為","D":"不得為與委任人有利益衝突之第三人從事代客操作業"},answer:"B"},
{id:68,question:"金融從業人員辦理衍生性商品業務時，應遵循下列何者事項？",options:{"A":"可幫助客戶遞延、隱藏損失","B":"可幫助客戶粉飾財務報表","C":"可幫助客戶提前認列收入","D":"不得利用衍生性商品幫助客戶遞延、隱藏損失或虛報、提前認列收入等"},answer:"D"},
{id:69,question:"金融從業人員辦理催收業務時，下列何者為應遵守之事項？",options:{"A":"不得違反公共利益","B":"僅能對債務人本人及其保證人催收","C":"不得對非債務之第三人干擾或催討","D":"以上皆是"},answer:"D"},
{id:70,question:"下列那一項為金融從業人員辦理投資型金融商品之推介或銷售業務時，應遵守之事項？",options:{"A":"應避免不當銷售或推介之行為","B":"不得誤導消費者不正確之價值及理財觀念","C":"不得使用類似大眾所熟悉之他人商標，以混淆消費者","D":"以上皆是"},answer:"D"},
{id:71,question:"下列關於金融從業人員辦辦理投資型金融商品之推介或銷售業務時，應遵守之事項何者正確？",options:{"A":"應揭露商品的各項特性及風險","B":"商品設計應符合客戶之風險偏好","C":"推介適合客戶之商品","D":"以上皆是"},answer:"D"},
{id:72,question:"金融從業人員執行業務時，應本持下列何者原則？",options:{"A":"善良管理原則","B":"保密原則","C":"誠信公正原則","D":"以上皆是"},answer:"D"},
{id:73,question:"下列陳述何者為金融從業人員應遵守之事項？",options:{"A":"不可利用客戶名義為自己從事交易","B":"可利用客戶名義為自己從事交易","C":"可利用客戶名義供他人從事交易","D":"以上皆非"},answer:"A"},
{id:74,question:"金融從業人員辦理全權委託業務，為期精確銷售或推介適合客戶之商品，應廣泛了解客戶之：",options:{"A":"家庭背景","B":"生涯規劃","C":"風險偏好","D":"以上皆是"},answer:"D"},
{id:75,question:"下列所述金融從業人員辦理全權委託業務應廣泛了解客戶之事項，何者有誤？",options:{"A":"投資需求","B":"投資經驗","C":"是否提供餽贈","D":"財務狀況"},answer:"C"},
{id:76,question:"金融從業人員遇有存戶遺忘或未及時領回銀行存摺時，應採取下列何措施？",options:{"A":"可代客保管存摺","B":"應即設簿登記，交指定主管人員集中保管","C":"不發函或電告通知客戶僅需等待洽領","D":"以上皆非"},answer:"B"},
{id:77,question:"客戶申辦業務檢附之文件內含瑕疵時，下列敘述何者正確？",options:{"A":"應確實檢視，審慎評估處理方式","B":"應視與客戶之交情決定受理與否","C":"仍照常予辦理，並向客戶示意要求其提供酬謝金或封口費","D":"以上皆非"},answer:"A"},
{id:78,question:"王大明是一位證券分析人員，因為在餐廳吃飯時偶然聽到日日紅公司員工的談話，回辦公室後就把分析報告中對日日紅公司股票的建議由買進改為賣出。王大明違反了什麼原則？",options:{"A":"保密原則","B":"公平原則","C":"專業原則","D":"忠實誠信原則"},answer:"C"},
{id:79,question:"金融從業人員為提供投資人良好的服務，下列敘述何者有誤？",options:{"A":"應瞭解並遵守相關法令之規定，不得有違反或幫助他人違反法令之行為","B":"應確實掌握客戶之資力、投資經驗與目的，以提供適當之服務，謀求客戶之最大利益","C":"應盡善良管理之責任及注意，代客戶保管有價證券或其他資產","D":"應妥慎保管客戶資料，禁止洩露機密資訊或有不常使用之情事"},answer:"C"},
{id:80,question:"金融從業人員從事保險業務招攬時，於下列何者情形不負通知義務？",options:{"A":"為他方所知者","B":"為他方所不知者","C":"已發生者","D":"自己所知者"},answer:"A"},
{id:81,question:"下列何者屬於金融從業人員招攬保險，利用其身分從事業務上的不當行為？",options:{"A":"招攬過程對客戶有恐嚇、威脅之言語或行動，或有肢體上暴行，經查證屬實者","B":"協助要求醫師開立錯誤或內容不實之診斷及處置證明，或不當誘使要保人或被保險人要求醫師開立錯誤或內容不實診斷及處置證明","C":"未親晤客戶致未能取得保戶親簽之要保相關文件","D":"以上皆是"},answer:"D"},
{id:82,question:"金融從業人員在從事保險招攬時應充分瞭解要保人及被保險人之事項，其内容至少應包含？",options:{"A":"要保人及被保險人之基本資料","B":"要保人與被保險人及被保險人與受益人之關係","C":"要保人及被保險人是否符合投保之條件","D":"以上皆是"},answer:"D"},
{id:83,question:"就身心障礙人士的投保需求，逕行拒絕受理、拒絕協助送件或勸退，會受到何種處分？",options:{"A":"停止招攬3個月","B":"停止招攬6個月","C":"停止招攬10個月","D":"停止招攬1年"},answer:"A"},
{id:84,question:"金融從業人員招攬保險時不應告知要保人下列那些事項？",options:{"A":"可延欠保費","B":"可退佣","C":"可折讓","D":"以上皆是"},answer:"D"},
{id:85,question:"金融從業人員招攬保險業務時應告知要保人投保應注意事項，下列何者為非？",options:{"A":"要保人親自填寫並簽章","B":"如何逃稅","C":"若要保人或被保險人為未成年人，需經其法定代理人同意，並於要保書上簽章","D":"應據實說明"},answer:"B"},
{id:86,question:"金融從業人員對保險要保書的各項詢問說明，應如何要求客戶？",options:{"A":"可避重就輕","B":"就個人隱私可不必回答","C":"可任由其自由回答","D":"應據實說明"},answer:"D"},
{id:87,question:"金融從業人員從事保險招攬時，有誠實填寫招攬報告書的義務，下列何者為招攬報告書應包含的內容：",options:{"A":"招攬經過","B":"要保人及被保險人是否投保其他商業保險","C":"家中主要經濟來源者","D":"以上皆是"},answer:"D"},
{id:88,question:"金融從業人員有下列哪種情況之一時，不可登錄為保險業務員；如果已登錄者，所屬公司應通知各有關公會註銷其登錄：",options:{"A":"申請登錄之文件有虛偽之記載者","B":"曾犯偽造文書、侵占、詐欺、背信罪，經宣告有期徒刑以上之刑確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾三年者","C":"受破產之宣告，尚未復權者","D":"以上皆是"},answer:"D"},
{id:89,question:"金融從業人員在向客戶辦理開戶作業時，應告知下列那些事項？",options:{"A":"相關費用","B":"相關交易流程","C":"相關的交易風險","D":"以上皆是"},answer:"D"},
{id:90,question:"交易人張三於週一透過某金融服務業完成一筆金融商品交易，以下敘述何者正確？",options:{"A":"該金融服務業應依規定製作一份對帳資料，寄送給張三","B":"可由該金融服務機構業務員代領交易報告書再轉交客戶","C":"為節省作業成本，未經約定一律以電子方式寄送交易報告書","D":"依客戶要求決定寄送與否"},answer:"A"},
{id:91,question:"金融服務業對客戶有告知義務與通知責任，下列敘述何者正確？",options:{"A":"應對須告知及通知事項儘速忠實告知","B":"可自行事先與客戶約定代為處理，毋須另行通知","C":"若主管指示毋須告知，則不告知客戶","D":"只告知有利於客戶之事項"},answer:"A"},
{id:92,question:"金融服務業於接受客戶委任簽訂全權委託契約前，下列那一事項毋須先向客戶說明？",options:{"A":"公司之背景","B":"每一位交易決定人員之學經歷與操作績效","C":"某位客戶控告公司不當運用其所存入之委任資金，一審判處公司勝訴，但客戶不服上訴，目前仍在法院審理中","D":"金融商品於特定價位買賣保證獲利"},answer:"D"},
{id:93,question:"證券商辦理財富管理業務，為防範內線交易及利益衝突，對於辦理財富管理業務人員之規範，下列何者為正確？",options:{"A":"不得接受客戶不合法交易","B":"從客戶獲知其買賣某標的商品之相關訊息，有利益衝突或不當得利之虞者，不得從事該等標的之買賣","C":"應明確告知客戶執行財富管理業務人員之所屬部門，不得有混淆客戶之行為","D":"以上皆為正確"},answer:"D"},
{id:94,question:"證券商辦理財富管理業務，對客戶之收費應如何處理？",options:{"A":"列為公司機密","B":"提供財富管理服務實際收取之手續費、推介銷售商品獲取之佣金及其他名義費用向客戶充分告知","C":"將牌告之收費標準充分揭露","D":"客戶有詢問時才告知大概情形"},answer:"B"},
{id:95,question:"證券經紀商接受客戶委託買賣有價證券，於成交後，證券業務人員應即時回報客戶，作成買賣報告書交付客戶，每月編製對帳單分送客戶，其主要目的為：",options:{"A":"增加公司員工的工作内容","B":"創造社會的工作機會","C":"確認交易及買賣委託之完成","D":"維持與客戶的友好關係"},answer:"C"},
{id:96,question:"金融從業人員執行事務明知有下列事項應告知客戶，何者為是？",options:{"A":"對於契約之重大條款認知錯誤","B":"對於業務執行之重大事項認知錯誤","C":"對於財產管理之重大事項認知錯誤","D":"以上皆是"},answer:"D"},
{id:97,question:"金融從業人員處理事務應盡善良管理人之注意義務，下列何者為錯誤的行為？",options:{"A":"告知客戶投資運用之風險","B":"告知客戶應給付相關款項及費用","C":"未告知客戶處理業務有利益衝突","D":"告知客戶公司相關資料"},answer:"C"},
{id:98,question:"金融從業人員告知客戶投資風險，以下何者為是？",options:{"A":"無須提供相關書面資料","B":"應代為填寫瞭解客戶作業之資料","C":"以招攬業務必須同時說明其風險","D":"太複雜之投資風險無須告知"},answer:"C"},
{id:99,question:"金融從業人員辦理業務如需告知客戶公司相關資料，得以提供公司之相關資料為何？",options:{"A":"公司及其相關分支機構或代理機構之營業地址、聯絡電話","B":"代表公司執行業務的人員之姓名或職稱","C":"代表公司可能與客戶聯繫的人員之姓名或職稱","D":"以上皆是"},answer:"D"},
{id:100,question:"金融從業人員處理管理運用業務之通知與報告義務為何？",options:{"A":"應就事務之處理情形定期報告客戶","B":"應依契約約定為必要之通知","C":"應公告事項應依相關規定辦理","D":"以上皆是"},answer:"D"},
{id:101,question:"依法令規定應於提供客戶相關文件中揭露風險警語，下列何者無須揭露警語？",options:{"A":"行銷文件","B":"印鑑卡","C":"公開說明書","D":"投資說明書"},answer:"B"},
{id:102,question:"金融從業人員與客戶簽訂契約，以下敘述何者為是？",options:{"A":"於訂約前並應先行提供契約或文件內容予客戶閱覽","B":"應盡合理注意使客戶於簽訂契約前有充分機會考慮條款","C":"應就客戶所提出疑義詳細說明之","D":"以上皆是"},answer:"D"},
{id:103,question:"金融從業人員應提供客戶充足且必要之資訊，須告知客戶投資之風險及其所從事投資之決定或交易過程。此為以下何項原則？",options:{"A":"資訊公開原則","B":"能力原則","C":"保密原則","D":"客觀性原則"},answer:"A"},
{id:104,question:"金融從業人員應秉持下列何種原則以提供客戶充足必要之資訊，告知客戶投資之風險及從事投資決定或交易過程之相關資訊，並向客戶快速揭露最新之資訊？",options:{"A":"專業誠信原則","B":"資訊公開原則","C":"善良管理原則","D":"守法原則"},answer:"B"},
{id:105,question:"從業人員提供客戶充足必要的資訊，告知客戶投資的風險及從事投資決定或交易過程之實質資訊等，是屬於下列何種職業道德原則？",options:{"A":"客觀原則","B":"資訊公開原則","C":"利益衝突原則","D":"保密原則"},answer:"B"},
{id:106,question:"有關公司之重大訊息，應：",options:{"A":"於公司未公開前提供給客戶","B":"基於合法方式取得後提供給客戶","C":"於公司未公開前促使他人利用該訊息獲私利","D":"將此訊息運用於非法用途上"},answer:"B"},
{id:107,question:"從業人員接受客戶的委託後應符合資訊公開原則來提供服務，何謂資訊公開原則？",options:{"A":"提供客戶充足必要、投資可能的風險及投資決定等相關資訊","B":"為提供最佳的服務，可將所有的資訊均反應給客戶","C":"將所有未公開的資訊提供給客戶作內線交易","D":"將客戶的資料提供給相關合作廠商"},answer:"A"},
{id:108,question:"金融從業人員行銷商品時，應",options:{"A":"一味地促銷商品","B":"批評他公司之商品","C":"重要事項先不予告知","D":"主動並詳細說明此商品之特性及應注意事項"},answer:"D"},
{id:109,question:"在提供專業服務過程中，從業人員不得有下列哪些行為？",options:{"A":"任何欺瞞、詐騙行為","B":"不實陳述或故意做錯","C":"誤導客戶","D":"以上皆是"},answer:"D"},
{id:110,question:"下下列何者行為是金融從業人員的職責？",options:{"A":"讓客戶充分了解商品內容","B":"隱瞞不利銷售的條件","C":"特別強調商品的獲利率","D":"避談商品的風險"},answer:"A"},
{id:111,question:"於業務推廣與招攬時，從業人員向客戶應盡之告知義務，法律敘述何者正確？",options:{"A":"依商品相關內容據實告知","B":"為爭取業績，隱匿部分應告知內容","C":"於告知時，可加入從業人員主觀之想法","D":"以上皆是"},answer:"A"},
{id:112,question:"各上市上櫃公司金融服務業應於何處揭露其所訂定之道德行為準則？",options:{"A":"年報","B":"公開說明書","C":"公開資訊觀測站","D":"以上皆是"},answer:"D"},
{id:113,question:"信用卡發卡機構在接獲被害人反映，發現有冒名申請信用卡案件時，應如何處理？",options:{"A":"不作任何通報","B":"儘速通報相關單位，避免損害擴大","C":"要求被害人負擔損失","D":"以上皆非"},answer:"B"},
{id:114,question:"金融從業人員辦理全權委託業務，下列何者有助於避免糾紛之發生？",options:{"A":"推廣文宣應清楚、公正及不誤導投資人","B":"充分告知產品所涉風險之性質與內容","C":"向投資人說明產品之可能最大損失","D":"以上皆是"},answer:"D"},
{id:115,question:"金融從業人員遇有客戶遺留印鑑、存摺及已蓋章之空白取款條等憑證文件時，應如何處理？",options:{"A":"私自代客保管","B":"立即交由金融機構指定人員妥善保管","C":"為避免糾紛，不予處理","D":"逕行銷燬"},answer:"B"},
{id:116,question:"金融從業人員遇客戶臨櫃提領現金（含由他人領款及陪同領款），經行員判斷有異常者，應如何處理？",options:{"A":"詢問客戶辦理動機與目的","B":"詢問客戶是否認識陪同提款的人","C":"經研判客戶顯屬遭詐騙者，應撥打警政署防範詐騙專線或逕向「110」報案","D":"以上皆是"},answer:"D"},
{id:117,question:"金融服務業從事基金管理業務，下列哪些事項必須告知客戶？",options:{"A":"收費基準及數額","B":"研究或分析報告與投資結果","C":"公司經營業務之種類與限制","D":"以上皆是"},answer:"D"},
{id:118,question:"發發投顧公司透過電腦選股每日提供前五大飆股名單給客戶而不告知任何理由或原因。發發公司有無違反告知義務？",options:{"A":"有","B":"無，因為報告只對特定人提供","C":"無，因為系統經多年驗證，並非怪力亂神","D":"無，因為涉及公司之智慧財產權，可不提供給客戶"},answer:"A"},
{id:119,question:"以下有關金融服務業從事投信業務對客戶收費資訊之陳述，何者有誤？",options:{"A":"應向客戶揭露收費之基準及數額","B":"所有會影響對客戶之收費或將調高之做法，都應符合公平誠信原則","C":"向所有客戶收取的費用都必須一樣","D":"調高費用者，應於與客戶協議書中揭露，並於定期表件中彙報"},answer:"C"},
{id:120,question:"購買基金之客戶要求投資信託公司揭露其財務狀況，公司人員應採取何者措施？",options:{"A":"得拒絕提供任何資料","B":"不得拒絕提供可公開之財務報表資料","C":"公司人員視情況隨興提供資料","D":"只提供口頭說明資料"},answer:"B"},
{id:121,question:"基金通路報酬之揭露原則為何？",options:{"A":"依基金別揭露","B":"依公司別揭露","C":"依註冊地別揭露","D":"不必揭露"},answer:"A"},
{id:122,question:"基金通路報酬揭露內容之通知方式為？",options:{"A":"公開網站","B":"電子郵件","C":"對帳單","D":"以上皆可"},answer:"D"},
{id:123,question:"金融從業人員於保險業務招攬時，對於被保險人所填要保書，下列何者正確？",options:{"A":"於空白要保書簽名即可","B":"要求被保險人親自填寫並簽名","C":"實務上可代填不用簽名","D":"口頭舉諾即可不用填寫"},answer:"B"},
{id:124,question:"金融從業人員從事保險業務招攬時，對被保險人因連續高額投保，與其固定收入顯不相當時，應如何處理？",options:{"A":"盡速收取保費","B":"維護客戶投保權益","C":"了解其動機，若有不良企圖應予以規勸導正","D":"只要保險公司同意即可"},answer:"C"},
{id:125,question:"金融從業人員收取保險費後下列何者行為是正確的？",options:{"A":"立即繳交保險公司","B":"累積一定數量後整批繳交可提升效率","C":"避免遺失可以轉用自己支票或信用卡繳交","D":"可由賠款扣抵"},answer:"A"},
{id:126,question:"金融從業人員從事保險業務招攬時，下列何者行為或觀念是錯誤的？",options:{"A":"業務人員對於商品應充分了解","B":"惡性殺價是市場競爭正常行為","C":"對被保險人應作適當的商品規劃","D":"各項權利義務須詳細說明清楚"},answer:"B"},
{id:127,question:"金融從業人員從事保險招攬業務時，下列何種行為是正確的？",options:{"A":"為節省客戶費用，提供錯價、放佣","B":"詳實說明客戶依保險契約的權利義務","C":"為增加業務人力，無須所屬公司同意即可招聘人員","D":"其他國家的商品對客戶較為有利，因此雖然未經我國主管機關核准或備查，仍可向客戶推銷"},answer:"B"},
{id:128,question:"金融從業人員提供保險理賠服務下列何者是正確的？",options:{"A":"提供專業之服務協助，並請申請人據實填寫理賠申請書","B":"提供專業之服務協助，並代填寫理賠申請書","C":"理賠金額可任由申請人要求給付","D":"允諾客戶一定可獲公司理賠"},answer:"A"},
{id:129,question:"發現保險契約錯誤記載時，金融從業人員應如何處理才屬正確的？",options:{"A":"只要要保書填寫正確即可","B":"立即送回保險公司更正或重新製作保單","C":"保險從業人員於錯誤處更正後，簽名即可","D":"錯誤處未達三個，可不必更正"},answer:"B"},
{id:130,question:"金融從業人員於保險業務招攬時，不慎對商品作出不正確之解釋，應如何正確處理？",options:{"A":"不影響，因口說無憑","B":"口述僅供參考，一切以要保書或文宣為準","C":"立即對客戶提出更正及正確解釋說明","D":"認知不同，難以斷定錯誤與否"},answer:"C"},
{id:131,question:"金融從業人員從事保險業務招攬應以何種態度經營及建立客戶群？",options:{"A":"專業誠信之態度","B":"得得過且過之態度","C":"業績至上","D":"自身利益優先"},answer:"A"},
{id:132,question:"金融從業人員發現客戶需求與其公司所提供保險商品有落差時，應採取下列何種作為？",options:{"A":"不擇手段，爭取業務","B":"避重就輕，轉移焦點","C":"誠實面對，據實說明","D":"藉巧妙說詞掩蓋事實"},answer:"C"},
{id:133,question:"金融從業人員於保險業務招攬時，得要求要保人履行據實說明義務，係屬下列何種原則？",options:{"A":"損害補償原則","B":"保險利益原則","C":"主力近因原則","D":"最大誠信原則"},answer:"D"},
{id:134,question:"金融從業人員於保險業務招攬時，得約束要保人或被保險人的事項有告知、通知、保證，是基於何種原則？",options:{"A":"最大誠信原則","B":"利益衝突原則","C":"損害賠償原則","D":"以上皆非"},answer:"A"},
{id:135,question:"下列何者是金融從業人員於保險業務招攬時的不當行為？",options:{"A":"客戶外觀明顯可見或業務員明知應告知事項而惡意隱匿或唆使客戶隱匿。","B":"協助、任憑客戶偽造、變造或做不實之登載於要保書、理賠申請文件或其他文件","C":"唆使（誘導）客戶對應告知事項做不實之告知。","D":"以上皆是"},answer:"D"},
{id:136,question:"金融從業人員不得與客戶作獲利保證，係因：",options:{"A":"任何交易皆有風險","B":"職業道德","C":"法令禁止","D":"以上皆是"},answer:"D"},
{id:137,question:"金融從業人員張三與客戶李四是青梅竹馬，因此張三可以：",options:{"A":"代領李四的對帳單再親手交付","B":"和李四約定利益分享、損失共同承擔","C":"代為保管李四的存摺、印鑑","D":"以上皆非"},answer:"D"},
{id:138,question:"金融從業人員於受託執行業務時，下列何者非禁止行為？",options:{"A":"教育客戶利用電子系統買賣，以爭取買賣時間","B":"如客戶業務繁忙，請其事先在委託書蓋章，再代理買賣","C":"代客戶領取密碼","D":"為節省時間，先替客戶買賣，結帳後再請客戶填寫買賣委託書"},answer:"A"},
{id:139,question:"金融從業人員為能使客戶儘速交易，下列行為何者可接受？",options:{"A":"可先行交易，開戶文件後補即可","B":"事先告知客戶備妥開戶所需證明文件","C":"接受未經授權之代理開戶","D":"熟識的客戶免辦理開戶作業即可交易"},answer:"B"},
{id:140,question:"下列何者為金融服務業之開戶經辦應有之服務態度？",options:{"A":"依當天心情決定是否完成客戶開戶手續","B":"只幫交情好的業務員辦理客戶開戶","C":"將自行來開戶的客戶介紹給業務員代操","D":"為客戶詳細解說開戶程序並交付相關文件"},answer:"D"},
{id:141,question:"客戶李四有一筆定存500萬元到期，欲從事商品投資，金融從業人員應：",options:{"A":"建議李四申購高額手續費之商品為自己賺取獎金","B":"依李四需求，建議客戶申購適合自己的商品","C":"視公司本月主推商品為何，建議李四申購該商品","D":"如這個月已達到業績目標，勸誘李四下個月再申購"},answer:"B"},
{id:142,question:"下列何者是證券商之業務人員執行業務公平對待客戶應秉持的原則？",options:{"A":"優先考慮自己的業績","B":"協助客戶炒作股價","C":"應本誠實及信用原則","D":"完全維護公司利益"},answer:"C"},
{id:143,question:"證券商辦理財富管理業務，下列何者為證券商為防範內線交易及利益衝突之機制？",options:{"A":"有關業務人員直接或間接接受客戶或第三人之饋贈應訂定規範標準或管理措施","B":"辦理財富管理業務之人員，不得接受客戶不合法交易，從客戶獲知其買賣某標的商品之相關訊息，有利益衝突或不當得利之虞者，不得從事該等標的之買賣","C":"加強控管辦理財富管理業務之人員，不得與客戶約定分享利益或承擔損失，直接或間接要求、期約或收受不當之金錢、財物或其他利益，致影響其專業判斷與職務執行之客觀性","D":"以上皆是"},answer:"D"},
{id:144,question:"證券商辦理財富管理業務推廣時，下列敘述何者為正確？",options:{"A":"加強對客戶宣導金融常識，提升客戶風險辨識能力，俾利建立正確理財觀念","B":"證券商宜採防止財富管理業務人員收受佣金回扣，或接受招待等不當利益之措施","C":"證券商宜採防止財富管理業務人員未經客戶授權，擅自為客戶進行交易，或私自挪用客戶款項之措施","D":"以上皆是"},answer:"D"},
{id:145,question:"對於證券商之業務人員而言，下列敘述何者正確？",options:{"A":"由於獲悉某上市公司內部未公開訊息，然受限於在證券商上班，因此，只能利用人頭戶來買賣該公司股票以獲取利益","B":"對於客戶資產帳面價值的增減，為了不讓客戶壓力太大，善意的謊言是必要的","C":"若客戶答應，除了公司契約外，私下亦可與客戶另訂一份","D":"以上皆非"},answer:"D"},
{id:146,question:"證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？",options:{"A":"辦理受託買賣有價證券時，有隱瞞、詐欺或其他足以致人誤信之行為","B":"以他人或親屬名義供客戶申購、買賣有價證券","C":"接受客戶委託買賣有價證券時，同時以自己之計算為買入或賣出之相對行為","D":"以上皆是"},answer:"D"},
{id:147,question:"為促進證券業遵循法規及落實金融消費者保護，下列何者為證券業及其業務人員向客戶提供衍生性金融商品交易服務公平對待客戶應秉持之原則？",options:{"A":"應以善良管理人之注意義務及忠實義務，本誠實信用原則為之","B":"客戶為自己的親朋好友，因此釋放出未公開資訊供其投資參考","C":"對於與法律相關的文件，為保護客戶予以銷毀及竄改","D":"為服務及保護客戶，提供客戶經過美化的績效報告"},answer:"A"},
{id:148,question:"證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？",options:{"A":"依據法令規定執行業務","B":"招攬、媒介、促銷未經核准之有價證券或其衍生性商品","C":"依據客戶委託事項及條件，執行有價證券之買賣","D":"受理客戶本人開戶"},answer:"B"},
{id:149,question:"金融從業人員應忠實執行業務，以下何種行為是錯誤的？",options:{"A":"不得因執行業務而享有個人不當利益","B":"故意設計交易行為以掩飾利害關係人交易","C":"不得對客戶有虛偽、詐欺行為","D":"不得對客戶有足致客戶誤信之行為"},answer:"B"},
{id:150,question:"金融從業人員為客戶管理運用財產，管理運用之利益應如何處理？",options:{"A":"不得以任何名義享有利益","B":"得與他人交換而享有利益","C":"得與客戶以代付差旅費方式分享利益","D":"得與客戶約定收益共享或損失分擔"},answer:"A"},
{id:151,question:"金融從業人員執行業務，以下何種行為是正確的？",options:{"A":"有偽造之行為","B":"有詐欺之行為","C":"有足致客戶誤信之行為","D":"應秉忠實信用原則處理事務"},answer:"D"},
{id:152,question:"金融從業人員執行業務何種行為符合誠實原則？",options:{"A":"對於客戶未來投資報酬，故意提供不適當之預測","B":"誤導客戶可能之績效","C":"對所投資產品之價值正確詳實記錄","D":"誤導客戶所投資運用標的之風險"},answer:"C"},
{id:153,question:"以下敘述何者為非？",options:{"A":"信託關係是高度信賴關係，客戶辦理業務首重公司信用","B":"委託投資關係有賴客戶對公司管理資產能力之肯定","C":"辦理業務應先爭取業績，無須告訴客戶相關風險","D":"辦理業務應維護消費者權益"},answer:"C"},
{id:154,question:"金融從業人員對不當利益應：",options:{"A":"可接受招待","B":"不可收現金，有價證券則不限","C":"不得接受","D":"可收禮品"},answer:"C"},
{id:155,question:"金融服務業稽核人員得兼任下列何種職務？",options:{"A":"銀行存款櫃檯人員","B":"證券商債券交易員","C":"保險公司核保人員","D":"以上皆非"},answer:"D"},
{id:156,question:"金融從業人員不得有下列何種行為？",options:{"A":"參加專業證照之考試以提昇自身素質","B":"配合政府金融政策，促進經濟發展，盡盡社會責任","C":"利用客戶名義或帳戶，為自已從事交易","D":"以上皆是"},answer:"C"},
{id:157,question:"金融從業人員與客戶間之往來：",options:{"A":"不得接受禮品或收取任何有價值物品","B":"可收禮品","C":"可收現金","D":"可收現金及禮品"},answer:"A"},
{id:158,question:"金融從業人員應遵守忠實義務原則，故：",options:{"A":"仍可從事內線交易","B":"禁止短線交易，禁止不當得利","C":"應與客戶發生衝突","D":"不一定要遵守法規"},answer:"B"},
{id:159,question:"對公司有控制能力之法人股東，應訂定相關之執行職務守則以為遵循，此為擔任董事、監察人之何種義務？",options:{"A":"忠實與注意義務","B":"保密義務","C":"善良管理義務","D":"守法義務"},answer:"A"},
{id:160,question:"金融從業人員應遵守善良管理原則，故應盡善良管理人之責任及注意義務。以下何者為是？",options:{"A":"不管客戶風險","B":"不提供客戶服務","C":"對客戶說謊","D":"為客戶適度分散風險，並提供最佳之專業服務"},answer:"D"},
{id:161,question:"身為金融從業人員應保持尊嚴，不得有玷辱職業信譽之任何行為，且與委託人間應有之約定，應如何應對？",options:{"A":"可以違反","B":"視情況違反","C":"不得違反","D":"以上皆非"},answer:"C"},
{id:162,question:"下列何者係金融從業人員秉持誠實信用原則之行為？",options:{"A":"假借銀行存款名義招攬保險","B":"以高預定利率作不實比較，誘使消費者抱持錯誤認知而購買保險","C":"不以單獨強調或與其他金融商品比較之方式誤導消費者","D":"以上皆是"},answer:"C"},
{id:163,question:"客戶將資產委託給金融從業人員從事投資，身為一位優秀的金融從業人員，應為公司及客戶盡何種責任及義務？",options:{"A":"善良管理人之責任及注意義務","B":"提供內線交易","C":"隨時透露客戶財產狀況給其他人","D":"以上皆非"},answer:"A"},
{id:164,question:"關於金融從業人員執行業務時，下列敘述何者正確？",options:{"A":"勸誘客戶解約他公司之商品","B":"將他公司之商品作不公平之比較","C":"不散播不實言論及文宣","D":"販售非經主管機關核准之商品"},answer:"C"},
{id:165,question:"金融從業人員若有代為收付金錢之行為者應遵守下列何項行為規範？",options:{"A":"收現但轉以自己之支票付款","B":"收到客戶款項應馬上歸繳公司","C":"收到隔幾天再給公司","D":"存於自己帳戶再處理"},answer:"B"},
{id:166,question:"金融從業人員在銷售金融商品時，應對銷售之商品詳細說明，不得為業績而隱藏不告知金融商品應有之風險，係屬何種原則？",options:{"A":"誠實信用原則","B":"內線交易原則","C":"服務原則","D":"善良風俗原則"},answer:"A"},
{id:167,question:"金融從業人員基於招攬業務時，應秉持誠實信用原則，下列行為何者不屬誠實信用原則？",options:{"A":"客戶對商品有不懂之處應再仔細說明","B":"商品一旦售出，即使客戶對商品內容有疑問也置之不理","C":"客戶交給我們的資料，不可隨意散播","D":"以上皆是"},answer:"B"},
{id:168,question:"金融從業人員對於客戶資料，不應有下列何種行為？",options:{"A":"妥為保管","B":"不得出售","C":"應有保密之義務","D":"提供同業參考"},answer:"D"},
{id:169,question:"金融從業人員對於客戶資料處理方式，以下何者為非？",options:{"A":"不得對外任加討論","B":"不得任意對外發表","C":"得對無權過問之同仁洩漏","D":"不得擅自利用客戶資料為自己進行交易而謀取利益"},answer:"C"},
{id:170,question:"金融從業人員得以何種名義，向顧客收受不當佣金、酬金？",options:{"A":"個人","B":"經理","C":"主管機關","D":"以上皆非"},answer:"D"},
{id:171,question:"金融從業人員辦理全權委託業務應遵守事項，下列敘述何者為非？",options:{"A":"得向顧客收受不當佣金、酬金","B":"應避免不當銷售或推介之行為","C":"不得向他人出售、洩漏客戶資料","D":"應遵守相關法令規定"},answer:"A"},
{id:172,question:"金融從業人員應尊重消費者合法權益，當其權益受到侵害時，應如何處理？",options:{"A":"不予受理","B":"請客戶自行負擔損失","C":"秉誠信原則妥適處理","D":"應視與客戶之交情決定受理與否"},answer:"C"},
{id:173,question:"金融從業人員在向客戶推介或銷售金融商品時，以下敘述何者有誤？",options:{"A":"不得委託無相關金融證照之人員從事之","B":"應審酌客戶年齡等情況予以推介或銷售適當之金融商品","C":"善盡充分告知投資風險內容之職責","D":"為賺取佣金，儘量勸誘客戶於短期間內，以多次贖回、再申購金融商品之方式"},answer:"D"},
{id:174,question:"信用卡發卡機構對於信用卡業務需要所登載及製播廣告，應遵守下列何者事項？",options:{"A":"避免造成消費者有不當擴張個人信用之價值觀","B":"必須依據法令規範確實登載規定警語","C":"必須充分揭露費用及利率","D":"以上皆是"},answer:"D"},
{id:175,question:"證券投信事業對於有業務往來的證券商，應採何種管理事項？",options:{"A":"應簽訂書面約定，將退還手續費捐予慈善機構","B":"定期對財務、業務及服務品質作評比","C":"除退還的手續費之外，得接受證券商的其它利益","D":"以上皆是"},answer:"B"},
{id:176,question:"依據忠實誠信原則，下列哪一項非投信投顧從業人員執行業務時應有的行為？",options:{"A":"遵守契約規定","B":"以善良管理人之注意義務本誠實信用原則執行業務","C":"考慮客戶的財務狀況適度分散投資","D":"依所有人的最佳利益行事，包含客戶、公司及股東"},answer:"D"},
{id:177,question:"金融從業人員對誰負有忠實誠信義務？",options:{"A":"所有投資大眾","B":"客戶","C":"公司股東","D":"以上皆是"},answer:"B"},
{id:178,question:"李四是一位證券分析師，於電視上向觀眾分析產業趨勢時，宣稱他取得國外某知名大學商學院MBA學位，但事實上，李四僅於該校取得商學院學分課程，且真實學歷僅限於國內大學經濟系學士學位。試問李四違反以下哪一原則？",options:{"A":"專業原則","B":"保密原則","C":"公平競爭原則","D":"忠實誠信原則"},answer:"D"},
{id:179,question:"金融從業人員發現保險商品條款涉及被保險人利益之解釋，如有爭議時，應如何處理？",options:{"A":"作有利保險公司之解釋","B":"作有利被保險人之解釋","C":"以訴訟方式處理","D":"不需理會"},answer:"B"},
{id:180,question:"金融從業人員從事保險業務招攬時，明知道保險標的之危險已消滅，仍要求客戶投保，則保險契約：",options:{"A":"無效","B":"有效","C":"不得解除","D":"以上皆非"},answer:"A"},
{id:181,question:"金融從業人員從事保險業務招攬時，其利益與客戶之利益無法兼顧面臨取捨時，從業人員應如何處理？",options:{"A":"以自身利益為重","B":"給予客戶專業分析，爭取合理之利益","C":"以達成公司要求為準則","D":"以客戶意見為準，忽略自身之專業"},answer:"B"},
{id:182,question:"金融從業人員招攬業務時遇市場對手競爭時，應保持如何態度？",options:{"A":"惡意攻訐同業","B":"以平常心，給予客戶專業建議","C":"刻意扭曲，陷人錯誤判斷","D":"隱惡揚善，規避責任"},answer:"B"},
{id:183,question:"金融從業人員從事保險業務招攬時，除考慮到自身利益外，以下哪一項更加必須顧到？",options:{"A":"公司利益","B":"社會責任","C":"業績成長","D":"以上皆非"},answer:"B"},
{id:184,question:"金融從業人員同時兼有保險代理人、經紀人資格者，是否可同時申請二者執業證書？",options:{"A":"可以","B":"為避免利益衝突，僅得擇一","C":"視情況而定","D":"依其個人意願"},answer:"B"},
{id:185,question:"金融從業人員為公司內部人員執行證券期貨經紀業務時，為避免利益衝突：",options:{"A":"應優先執行公司內部人員之委託","B":"應依公司內部人員及客戶委託時間之先後順序執行","C":"應依委託金額多寡決定執行順序","D":"應由金融從業人員自行決定"},answer:"B"},
{id:186,question:"當金融從業人員張三的客戶在未告知其不滿的情況下，轉向李四交易時，張三應：",options:{"A":"醜化客戶，告訴李四，該客戶是位麻煩人物","B":"聯合其他同事排擠李四，讓李四離職","C":"試圖了解原因並虛心改進，以提升服務品質","D":"醜化李四，向主管告狀，宣稱李四行為惡劣"},answer:"C"},
{id:187,question:"金融從業人員張三這個月的業績只差500萬元就達到業績目標，為能達到門檻領到目標獎金，張三應採用下列何種方式較為適當：",options:{"A":"勸誘客戶李四申購商品並保證獲利","B":"商請另一位從業人員轉單給自己，約定獎金分享","C":"借用客戶名義申購商品，領到獎金再贖回","D":"積極拓展業務、爭取客戶，以達到業績目標"},answer:"D"},
{id:188,question:"金融從業人員因職務關係獲悉足以影響金融商品價格未公開之重大消息時：",options:{"A":"應即以書面報告並列管保密","B":"應廣為眾知，造福親朋好友","C":"應立即為客戶交易，牟取其最大利益","D":"應立即利用他人名義交易，牟取個人最大利益"},answer:"A"},
{id:189,question:"金融從業人員執行業務時，下列敘述何者不當？",options:{"A":"應善加利用職務所得訊息，為本身牟取利益","B":"不以職務所得訊息，為本身牟取利益","C":"應以客戶利益優先，不以個人業績為考量","D":"不以本身利益仲介客戶從事非法交易"},answer:"A"},
{id:190,question:"金融從業人員獲悉已影響相關客戶利益之訊息時：",options:{"A":"依客戶之重要性決定是否通知","B":"依與客戶之交情決定是否通知","C":"不須做任何處理","D":"應盡可能公平合理的通知每一位客戶"},answer:"D"},
{id:191,question:"若發生金融服務業之業務人員對其與客戶之利益衝突或不同客戶間之利益衝突情事時，應如何處理：",options:{"A":"以個別客戶對公司之貢獻度為依據","B":"以契約約定為依據","C":"以多數客戶之利益為依據","D":"以損益標準為處理原則"},answer:"B"},
{id:192,question:"金融服務業之業務人員面對本身業績與公司規定衝突時，應該如何面對？",options:{"A":"為了本身業績考量，可以忽略它","B":"以公司的規定為主","C":"先把公司提供的金融商品或服務銷售出去，再向上級反應","D":"以上皆非"},answer:"B"},
{id:193,question:"防止利益衝突是從事金融服務業職業道德的要項，何謂利益衝突？",options:{"A":"各獨立的個體，會因某一方的利益被歸優先，而使另一方可能蒙受損失","B":"利益衝突一定會造成雙方獲利","C":"利益衝突一定是某一方觸犯法律","D":"以上皆非"},answer:"A"},
{id:194,question:"防止利益衝突是從事金融服務業職業道德的要項，利益衝突若以代理制度來解釋，是指那兩方面的人發生利益衝突？",options:{"A":"受益人及受託人","B":"受託人及委託人","C":"受益人及委託人","D":"受託人及經理人"},answer:"B"},
{id:195,question:"防止利益衝突是從事金融服務業職業道德的要項，以下何項屬於利益衝突的含意？",options:{"A":"數種正當利益存在有彼此競爭矛盾的現象","B":"利益衝突屬於一種狀態或情境","C":"避免利益衝突亦屬道德範疇","D":"以上皆是"},answer:"D"},
{id:196,question:"防止利益衝突是從事金融服務業職業道德的要項，下列那種情況可能發生利益衝突？",options:{"A":"為個人私利竊取公司機密","B":"透過公司財產或資訊以取得獲利","C":"與公司為業務之競爭","D":"以上皆是"},answer:"D"},
{id:197,question:"為了防範公司可能與客戶或員工發生利益衝突的問題，下列何者是公司的內部管理規章應規範的內容？",options:{"A":"組織架構與人員資格條件","B":"風險管理制度","C":"內部控制制度","D":"以上皆是"},answer:"D"},
{id:198,choose:"以下何者之間於辦理業務時可能有利益衝突情事？",options:{"A":"行使投資運用時客戶與從業人員間","B":"銷售商品時客戶與其他客戶間","C":"辦理業務時客戶與金融集團其他子公司間","D":"以上皆是"},answer:"D"},
{id:199,question:"金融從業人員辦理業務應防止利益衝突，下列所述何者為錯誤的？",options:{"A":"應注意業務特性不同所造成之利益衝突","B":"應注意不同部門資產移轉產生利益衝突","C":"應注意部門間資訊可以無限制互相交流","D":"應注意利益不當輸送"},answer:"C"},
{id:200,question:"以下何種行為有利益衝突之虞？",options:{"A":"向放款客戶強力推銷無法賣出之金融商品","B":"為全權委託客戶購入公司本身股票","C":"將客戶之信託財產投資公司利害關係人發行之股票","D":"以上皆是"},answer:"D"},
{id:201,question:"以下何者不得參與投資決策？",options:{"A":"與業務相關人員有利害關係者","B":"投資決策人員","C":"具有運用決定權人","D":"以上皆是"},answer:"A"},
{id:202,question:"應如何建置利害關係人檔案？",options:{"A":"隨便填填交差了事","B":"應詳實提供資料並定期更新","C":"稽核人員查到再提供","D":"應參考其他同仁所填資料填寫"},answer:"B"},
{id:203,question:"金融從業人員執行資產管理事務時，為避免與公司發生利益衝突，應避免以下何種行為？",options:{"A":"購買公司發行之有價證券","B":"購買公司之不動產","C":"由公司購買客戶委託管理的財產","D":"以上皆是"},answer:"D"},
{id:204,question:"金融從業人員與客戶間辦理利害關係交易行為時，得採取何種措施？",options:{"A":"告知利益衝突之情形並取得客戶書面同意","B":"無須取得客戶之書面同意","C":"不得拒絕接受有利益衝突之委託","D":"應為公司積極爭取業務，接受委託"},answer:"A"},
{id:205,question:"以下所述何者違反防止利益衝突？",options:{"A":"資訊交互運用應注意內部資訊控管流程","B":"信託專責部門應指派專人負責內部資訊控管流程","C":"客戶信託財產內容得提供其他部門分析運用","D":"共用營業設備應注意內部資訊控管流程"},answer:"C"},
{id:206,question:"金融服務業之董監事對與本公司有利害關係之交易，應採取下列何項原則辦理？",options:{"A":"善良管理原則","B":"公平競爭原則","C":"專業原則","D":"利益迴避原則"},answer:"D"},
{id:207,question:"下列就金融從業人員之敘述何者為非？",options:{"A":"與自身利益相關的業務應該迴避","B":"因業務知悉公司股票將上漲，不可以事先買進","C":"客戶的餽贈不能收受","D":"只要對公司有益，所有法律規範可以先行放下"},answer:"D"},
{id:208,question:"公司董事、監察人或經理人，對下列何種行為應予避免？",options:{"A":"對於本身及客戶之資訊負有保密責任","B":"透過使用公司資產、資訊或藉由職務之便以獲取私利","C":"遵循法令規章","D":"保護並適當使用公司資產"},answer:"B"},
{id:209,question:"金融從業人員基於維護公司利益不應有何種表現？",options:{"A":"知悉授信客戶財務狀況惡化，應立即告知主管，並加以妥善處理","B":"當利率可能出現巨幅波動而侵蝕公司獲利時，應主動告知主管","C":"不得收受競爭對手之酬庸，以洩露公司內部機密","D":"為了績效考量，隱瞞自身職務之缺失"},answer:"D"},
{id:210,question:"金融服務業董事對董事會所列議案如有涉其本身利害關係致損及該公司利益之虞時，應採行下列何種措施？",options:{"A":"自行迴避，不加入表決","B":"加入表決","C":"本身不加入表決，但代理其他董事行使其表決權","D":"依其自由意志為之"},answer:"A"},
{id:211,question:"若某項活動、利益或關係可能妨礙從業人員追求公司及客戶之最高利益行事之能力時，應保持警覺，此屬何種行為？",options:{"A":"能力原則","B":"防範利益衝突行為","C":"客觀性原則","D":"誠信原則"},answer:"B"},
{id:212,question:"金融服務業董事、監察人或經理人在公司擔任職務時應避免下列何人獲得不當利益？",options:{"A":"配偶","B":"父母","C":"子女","D":"以上皆是"},answer:"D"},
{id:213,question:"為避免與客戶之利益衝突，下列何者不正確？",options:{"A":"於法律許可範圍內為客戶之利益執行專業判斷","B":"視客戶之忠誠度再決定執行業務之程度","C":"不受客戶忠誠與否之影響","D":"不受個人利益、其他客戶利益或任何其他人意願之影響"},answer:"B"},
{id:214,question:"金融從業人員處理某項業務時，若與公司之利益發生衝突應採取何種方式？",options:{"A":"基於利益衝突原則應予以迴避","B":"仍應繼續辦理","C":"因對自己有利，更應加強爭取該業務","D":"該業務轉移給自己的配偶來執行"},answer:"A"},
{id:215,question:"金融從業人員銷售對自己有利益的商品，如果該商品不符合客戶的需求，將會違反什麼原則？",options:{"A":"能力原則","B":"利益衝突原則","C":"損失原則","D":"以上皆是"},answer:"B"},
{id:216,question:"金融從業人員辦理全權委託業務，為避免利益衝突，應遵守下列何種事項？",options:{"A":"不得與委任人有利益衝突之第三人從事全權委託業務，以及從事足以損害委任人權益之交易","B":"可利用委任人之交易帳戶，為自己從事交易","C":"可利用委任人之交易帳戶，為委任人以外之第三人從事交易","D":"以上皆是"},answer:"A"},
{id:217,question:"下列關於金融從業人員辦理投資型金融商品推介或銷售業務時，應遵守之事項何者有誤？",options:{"A":"可與客戶約定分享利益或共同承擔損失","B":"應妥為保管客戶資料","C":"應避免不當銷售或推介之行為","D":"不可利用客戶帳戶或名義為自己謀取不當利益"},answer:"A"},
{id:218,question:"為維持市場交易之公平性，金融從業人員可否利用公司內部資訊擅自為自己或相關人員進行交易而謀取利益？",options:{"A":"可以","B":"不可以","C":"客戶同意即可","D":"視交易金額高低而定"},answer:"B"},
{id:219,question:"依據投信投顧公會會員自律公約，會員對其與客戶間或不同客戶之間的利益衝突情事，處理原則為？",options:{"A":"應避免之","B":"以口頭約定作為依據","C":"以多數客戶之利益為依據","D":"以損益標準作為處理原則"},answer:"A"},
{id:220,question:"投資顧問事業從業人員行為準則針對經手人員及利害關係人帳戶往來有所規範。所謂的利害關係人不包括：",options:{"A":"未成年子女","B":"本人","C":"配偶利用他人名義投資衍生性金融商品而間接受有利益者","D":"以上皆非"},answer:"D"},
{id:221,question:"基金銷售時有關贈品之規範為何？",options:{"A":"可以送贈品","B":"不可以送贈品","C":"可以送贈品但不能超過新台幣200元","D":"無規範"},answer:"B"},
{id:222,question:"圓滿投信招待光明證券新竹分公司人員五天四夜泰國之旅作為基金銷售目標達成之獎勵，請問是否可行？",options:{"A":"可以接受，因為非金錢報酬","B":"不能接受","C":"經主管機關核准即可","D":"向分公司主管報備即可"},answer:"B"},
{id:223,question:"金融從業人員從事保險業務招攬後，擅自將所蒐集客戶之個人資料，轉交給第三人，該行為如何？",options:{"A":"正常行為","B":"異常行為","C":"適法行為","D":"違法行為"},answer:"D"},
{id:224,question:"下列何者是金融從業人員從事保險業務招攬的不當行為？",options:{"A":"代客戶簽章","B":"未經客戶同意或授權填寫有關保險契約文件","C":"未經授權而代收保險費或代收保險費未依規定交付保險業開發之正式收據","D":"以上皆是"},answer:"D"},
{id:225,question:"下列何者為金融從業人員從事保險業務招攬時，應注意之事項？",options:{"A":"除非有法律規定，否則不得洩露客戶資料","B":"妥善保管客戶資料，避免讓不相關的第三人取得","C":"不得銷售或販賣客戶資料","D":"以上皆是"},answer:"D"},
{id:226,question:"金融從業人員對於經手業務所得知之客戶訊息，應抱持如何態度始屬適當？",options:{"A":"可在市場上交換獲取利益","B":"反正我不洩露，別人也會洩露","C":"本於職業道德，應予維護","D":"視狀況而定"},answer:"C"},
{id:227,question:"金融服務業如經客戶同意以電子郵件方式寄送對帳單者：",options:{"A":"應比照網路交易認證機制，須透過憑證機構之資料加密等功能，始得傳送予期貨交易人","B":"經客戶同意，不需網路交易認證機制，只需有客戶電子郵件信箱即可寄送","C":"電子郵件寄送方式，只要能取得客戶的電子郵件閱讀回條，即可不需網路交易認證機制","D":"為預防電腦駭客取得客戶資料，不可以電子郵件方式寄送對帳單"},answer:"A"},
{id:228,question:"金融服務事業基於金控共同行銷策略：",options:{"A":"不須經客戶同意，可將客戶之基本資料、財務資料相互利用","B":"必須經客戶同意，方可將客戶之基本資料、財務資料相互利用","C":"若未經客戶同意，僅可將客戶之基本資料相互利用，財務資料不可利用","D":"若未經客戶同意，僅可將其客戶之財務資料相互利用，基本資料不可利用"},answer:"B"},
{id:229,question:"對於客戶之申訴或檢舉案件，下列敘述何者適當？",options:{"A":"以積極主動的態度面對及妥善處理","B":"對於申訴或檢舉人之姓名、地址須予以保密","C":"以言詞提出申訴或檢舉之案件，應留存談話紀錄","D":"以上皆是"},answer:"D"},
{id:230,question:"對於金融從業人員應有之態度，下列敘述何者正確？",options:{"A":"應妥慎保管客戶資料，除依法令所為之查詢外，不得洩露客戶委託事項","B":"不得利用職務之便，洩露或利用公司及客戶之資料圖利","C":"不得利用或竊用他人電子帳號及密碼，為任何業務或非業務行為","D":"以上皆是"},answer:"D"},
{id:231,question:"當金融從業人員知悉客戶未經授權利用他人名義從事商品交易時：",options:{"A":"應接受其委託並為其保守秘密","B":"在客戶承諾補具授權書的情況下，先接受其委託進行交易","C":"拒絕接受其委託進行交易","D":"可有條件地接受其委託進行交易"},answer:"C"},
{id:232,question:"金融從業人員應本保密原則，忠實執行業務，何者敘述有誤？",options:{"A":"可提供客戶委託之事項予依法進行調查之主管機關或檢調單位","B":"如經客戶同意，可將客戶之基本資料、財務資料互為通用","C":"可為了保護個人隱私，以非真實姓名從事金融商品交易分析","D":"未能出示身分證明文件者，可拒絕就其個人資料申請查詢"},answer:"C"},
{id:233,question:"基於職務的關係而獲得的客戶資料，金融服務業之從業人員應該如何做才正確？",options:{"A":"由於大環境不佳，基於自己未來生活著想，可以將客戶資料轉賣給別人","B":"必須忠於保密原則，絕不對外洩露","C":"隨意丟棄，不整理","D":"以上皆是"},answer:"B"},
{id:234,question:"證券商基於防制洗錢及打擊資恐目的，需要持續監控客戶之帳戶及其交易，下列何者屬於疑似洗錢、資恐或武擴客戶帳戶類的交易態樣？",options:{"A":"無正當理由開立多個帳戶，且實質受益人為同一人者","B":"客戶係屬重要政治性職務人員，但意圖規避正確且完整的填寫申請表格，或未充分說明其資金或有價證券之來源正當性者","C":"以不同公司名義但皆有相同之法定代表人或有權簽署人，開立數個帳戶者","D":"以上皆是"},answer:"D"},
{id:235,question:"證券商之從業人員，如發現公司內部有違反法令規章或職業道德之情事時，下列何者是最好的作法？",options:{"A":"與自己沒有利害關係，假裝沒有看到","B":"私下告訴同業的朋友","C":"立刻向公司總經理或董事長或其他適當人員呈報","D":"直接向檢調機關檢舉"},answer:"C"},
{id:236,question:"證券商基於防制洗錢及打擊資恐目的，需要持續監控客戶之帳戶及其交易，下列何者屬於疑似洗錢、資恐或武擴交易類的交易態樣？",options:{"A":"新開戶或一定期間內無交易之帳戶突然大額交易者","B":"客戶突然大額匯入或買賣冷門、小型或財務業務不佳之有價證券，且無合理原因者","C":"無正當理由短期內連續大量買賣特定股票者","D":"以上皆是"},answer:"D"},
{id:237,question:"有關證券商管理相關法令對保密及不得為之行為規範，誰應該遵守？",options:{"A":"證券商之負責人","B":"證券商之業務人員","C":"證券商本身","D":"以上皆是"},answer:"D"},
{id:238,question:"下列何者屬於證券商的商業機密，身為公司的員工，不可對第三者透露？",options:{"A":"客戶及其買賣交易證券的相關資料","B":"公司名稱、營業處所、聯絡電話、電子郵件信箱等資料","C":"公司官方網站提供的資訊","D":"以上皆是"},answer:"A"},
{id:239,question:"金融從業人員辦理業務對客戶資料之保密，以下何者為非？",options:{"A":"客戶基本資料無須保密","B":"客戶帳務資料應予保密","C":"客戶信用資料應予保密","D":"客戶投資及保險資料應予保密"},answer:"A"},
{id:240,question:"從事電話行銷行為時，應主動提供下列何訊息讓受話人知悉？",options:{"A":"所屬公司名稱","B":"發話人可供識別的代碼及姓氏","C":"發話目的","D":"以上皆應提供"},answer:"D"},
{id:241,question:"公司委任第三人處理相關事務，受任第三人應注意下列保密事項，何者為錯誤？",options:{"A":"客戶資料得提供關係企業促銷業務","B":"客戶資料不得外洩","C":"客戶資料不得不當利用","D":"客戶資料之使用應建立內部控制機制"},answer:"A"},
{id:242,question:"金融從業人員對於客戶之相關資料：",options:{"A":"可任意放置","B":"可隨便公開","C":"不須保密","D":"確實保密"},answer:"D"},
{id:243,question:"所謂保密原則，下列何者為非？",options:{"A":"對存款人的法定代理人不必保密","B":"客戶的住址資料必須保密","C":"存款餘額100萬元以上才須保密，100萬元以下請示主管即可","D":"保密對象包含駐守銀行的警察"},answer:"C"},
{id:244,question:"若有第三人欲索取當事人之帳戶資料，何者為非？",options:{"A":"須經當事人書面同意方可為之","B":"須主動積極提供之，以表現金融從業人員之熱誠","C":"經當事人之法定代理人書面同意方可為之","D":"依保密原則，可直接拒絕對方之要求"},answer:"B"},
{id:245,question:"從業人員對於自客戶取得之機密資料應盡保密義務，所謂保密原則下列何者正確？",options:{"A":"不得以任何方式洩露予與執行該業務無關之人","B":"不得為交付目的以外之利用","C":"應以善良管理人之注意義務管理之","D":"以上皆是"},answer:"D"},
{id:246,question:"金融從業人員對於客戶的資料，應如何處理？",options:{"A":"予以保密","B":"未經客戶同意，提供給關係企業做行銷","C":"告知同事給予參考","D":"讓其他客戶瞭解"},answer:"A"},
{id:247,question:"金融從業人員在公共場所不得有之行為：",options:{"A":"談論公司重要機密","B":"談論國家大事","C":"談論藝文趣事","D":"談論個人未來計畫"},answer:"A"},
{id:248,question:"金融從業人員為客戶辦理財富管理，對客戶本身的資產、各項資料及隱私都應該妥慎保管不得洩露或不當使用，以符合下列何種原則？",options:{"A":"利益衝突原則","B":"保密原則","C":"禁止原則","D":"告知原則"},answer:"B"},
{id:249,question:"金融從業人員對於取自客戶之相關資料或資訊應不得為下列之行為？",options:{"A":"公開","B":"販售","C":"複製","D":"以上皆是"},answer:"D"},
{id:250,question:"妥善保管客戶資料，確保客戶相關資料及客戶隱私之保密性，是屬下列哪一原則之表現？",options:{"A":"守法原則","B":"保密原則","C":"能力原則","D":"誠信原則"},answer:"B"},
{id:251,question:"金融從業人員對客戶之資料，應盡到如何之注意義務？",options:{"A":"刑法第十三條過失之注意義務","B":"自己之事務之注意義務","C":"受僱人之注意義務","D":"善良管理人之注意義務"},answer:"D"},
{id:252,question:"有關銀行授信資料，下列敘述何者為正確？",options:{"A":"應有保密之義務","B":"不得向他人出售、洩露","C":"不得提供自己或他人使用","D":"以上皆是"},answer:"D"},
{id:253,question:"信用卡推廣人員與特約商店辦理簽約時所檢附之合約資料，應如何處理？",options:{"A":"妥為保管","B":"不得移做他用","C":"不將資料外洩給第三人","D":"以上皆是"},answer:"D"},
{id:254,question:"信用卡發卡機構之聘雇人員對於客戶資料，下列何者為正確？",options:{"A":"應有保密之義務","B":"不得向他人出售、洩露","C":"不得提供自己或他人使用","D":"以上皆是"},answer:"D"},
{id:255,question:"金融從業人員對於客戶資料處理方式，下列何者為正確？",options:{"A":"得提供他人使用","B":"得向他人出售、洩露","C":"不得出售或提供他人使用","D":"可與同業交換使用"},answer:"C"},
{id:256,question:"為強化客戶對金融機構的信賴，金融從業人員對客戶資料之處理，以下敘述何者正確？",options:{"A":"對於客戶資料之保密應依據相關主管機關之法令規定辦理，善盡對客戶資料保密之職責","B":"對於客戶資料之保密，除法令規定外，未經客戶簽訂契約或書面表示同意前，不得以任何方式洩露往來客戶之相關業務資料","C":"若發生客戶資料外洩時，應依內部之通報程序向相關主管報告，儘速研議緊急補救措施，並審酌案件內容通報主管機關或治安單位","D":"以上皆是"},answer:"D"},
{id:257,question:"下列就金融從業人員對客戶資料之保密原則的陳述何者正確？",options:{"A":"不得透露予依法所進行調查行為之主管機關或司法人員","B":"不得透露予公司指定之授權人員","C":"應妥慎保管客戶資料","D":"提供關係企業進行業務促銷"},answer:"C"},
{id:258,question:"金融從業人員銷售保險商品之招攬廣告，應遵守下列那些法令？",options:{"A":"個人資料保護法","B":"消費者保護法","C":"保險法等相關法令","D":"以上皆是"},answer:"D"},
{id:259,question:"金融從業人員從事保險業務招攬時，主張保險利益原則，主要是防止什麼危險發生？",options:{"A":"政治危險","B":"倫理危險","C":"職業危險","D":"道德危險"},answer:"D"},
{id:260,question:"金融從業人員於保險業務招攬時，可否於保險契約中免除或減輕保險公司依保險法應負義務者？",options:{"A":"可以","B":"不可以","C":"可以，但需要保人同意","D":"以上皆非"},answer:"B"},
{id:261,question:"金融從業人員登錄為保險業務員後，依法令規定應如何加強教育訓練？",options:{"A":"每年參加所屬公司辦理的教育訓練","B":"自我進修即可","C":"閱讀其他業務員撰寫的行銷書籍","D":"以上皆是"},answer:"A"},
{id:262,question:"保險契約簽訂後，契約雙方應遵守規範下列何者正確？",options:{"A":"遵守簽訂條件和條款","B":"切實履行各自的義務和責任","C":"明確被保險人利益受到法律保護","D":"以上皆是"},answer:"D"},
{id:263,question:"無行為能力或限制行為能力之人申請登錄保險業務員下列處理何者正確？",options:{"A":"可予登錄","B":"不予登錄","C":"經特准可予登錄","D":"可自由決定登錄"},answer:"B"},
{id:264,question:"有重大喪失債信情事尚未了結或了結後尚未逾三年之已登錄保險業務員，應作何處置？",options:{"A":"維持登錄","B":"若申請登錄，應不予登錄；已登錄者，所屬公司應通知各有關公會註銷其登錄","C":"撤銷或維持登錄均可","D":"經允許可維持登錄"},answer:"B"},
{id:265,question:"金融從業人員銷售保險商品之招攬廣告，除應遵守相關法令外，並應遵守什麼規定？",options:{"A":"商場守則","B":"商場資訊","C":"保險業相關自律規範","D":"以上皆是"},answer:"C"},
{id:266,question:"下列有關金融從業人員從事保險招攬所用的文宣、廣告、簡介、商品說明書及建議書等文書，何者為是？",options:{"A":"應標明所屬公司之名稱","B":"內容應與保險公司報經主管機關審查通過之保險單條款、費率及要保書等文件相符","C":"經所屬公司核可同意使用，其內容並應符合主管機關訂定之資訊揭露規範","D":"以上皆是"},answer:"D"},
{id:267,question:"金融從業人員從事保險業務招攬，主張損害補償原則，主要理由為何？",options:{"A":"預防道德危險發生","B":"預防損害發生","C":"預防不當得利發生","D":"以上皆是"},answer:"C"},
{id:268,question:"金融服務業及其受僱人員不得有下列何者行為？",options:{"A":"違反法令或相關規章之情事","B":"違反公司內部規定之情事","C":"破壞同業和諧及公共利益之情事","D":"以上皆是"},answer:"D"},
{id:269,question:"下列何者為金融從業人員應有的職業道德？",options:{"A":"對於內部業務人員之違規事件，應主動向主管報告","B":"對於內部業務人員之違規事件，應代為掩護以維持同事情誼","C":"對於內部業務人員之違規事發暗自竊喜並落井下石","D":"對於同業之違規應大加韃伐，自家公司違規則無所謂"},answer:"A"},
{id:270,question:"金融服務業及其受僱人員不應以業績為優先考量，對於下列何者應拒絕其交易？",options:{"A":"未完成開戶手續者","B":"經評估逾越其交易能力而無法提供適當擔保者","C":"不適合該金融商品交易者","D":"以上皆是"},answer:"D"},
{id:271,question:"金融從業人員於執行工作時，如發現其他人員有不法情事，何者敘述適當？",options:{"A":"應通報內部權責單位處理","B":"基於保密原則，假裝若無其事","C":"當機立斷，直接請其改正","D":"與其交換條件，牟取自身利益"},answer:"A"},
{id:272,question:"從事證券及金融相關專門職業，有那些特性？",options:{"A":"維持高度職業倫理道德的承諾","B":"強制性再教育訓練的專業要求","C":"利他主義態度的普及","D":"以上皆是"},answer:"D"},
{id:273,question:"對於一個證券或金融從業人員而言，下下列何者為最重要的因素？",options:{"A":"服裝儀容","B":"職業道德","C":"人脈","D":"家世背景"},answer:"B"},
{id:274,question:"為促進證券業遵守法規及落實金融消費者保護，證券商業務人員銷售衍生性金融商品不得有下列何者行為？",options:{"A":"與客戶約定分享利益或承擔損失，直接或間接要求、期約或收受不當之金錢、財物或其他利益","B":"擅自修改或製作相關標準文件交付予客戶","C":"擅自為客戶進行交易，或私自挪用客戶款項","D":"以上皆是"},answer:"D"},
{id:275,question:"下列何者是證券商及其從業人員執行業務關於職業道德的行為規範？",options:{"A":"對客戶提供金融商品與服務應注意誠信與公平交易","B":"保護並適當使用公司資產","C":"執行業務必須遵循法令規章","D":"以上皆是"},answer:"D"},
{id:276,question:"下列何者不是證券商及其從業人員執行業務關於職業道德的行為規範？",options:{"A":"執行業務避免利益衝突","B":"下班後與親朋好友或同學餐敘","C":"不洩露公司及客戶的機密資料","D":"遵照法令及公司管理規章的規定執行業務"},answer:"B"},
{id:277,question:"如何判斷證券商的業務人員是否具有職業道德？",options:{"A":"持有多種證券、期貨、或銀行、保險的專業證照","B":"不論是否執行業務或在何時何地，均能遵守法規與自律原則","C":"擁有高額的營業業績並領取高額的營業獎金","D":"擁有廣闊的政商及人際關係"},answer:"B"},
{id:278,question:"下列何者屬於證券商及其從業人員執行業務應遵守的執業道德規範？",options:{"A":"忠實執行工作，並以事實為根據","B":"以政府的法令及公司內部管理規章的規定為準則，嚴明紀律，保守機密","C":"公司與員工、員工與員工、公司與客戶、員工與客戶間互相尊重，相互配合","D":"以上皆是"},answer:"D"},
{id:279,question:"資本市場是信用市場，市場參與者相互間的信用是市場存在的基礎及價值，因此，證券交易法對於破壞市場信用的行為，通常會處以最嚴厲的處分，下列何者不屬於破壞市場信用的行為？",options:{"A":"內線交易","B":"人為操縱股價","C":"員工加班不依法給加班費","D":"有價證券之募集、發行、私募或買賣有虛偽、詐欺或其他足致他人誤信之行為"},answer:"C"},
{id:280,question:"下列何者非為充實與增進證券及金融業務人員專業的作法？",options:{"A":"參加軍事訓練","B":"參加公司內部舉辦或外部專業機構辦理之職前訓練","C":"持續定期參加公司內部舉辦及外部專業機構辦理之在職訓練","D":"各種相關證券及金融業專業證照之取得"},answer:"A"},
{id:281,question:"下列何者為確保證券商從業人員在公司遵守法令執行業務的作法？",options:{"A":"設置法令遵循單位專責負責推動","B":"對公司員工施以適當合宜的法規訓練","C":"內部稽核單位將公司法令遵循制度執行情形列入查核","D":"以上皆是"},answer:"D"},
{id:282,question:"以下敘述何者為是？",options:{"A":"法規過於專業，經辦人員毋須了解法規","B":"公司主管要求時，經辦再更新法規即可","C":"經辦人員應隨時注意業務相關法規之更新","D":"以上皆非"},answer:"C"},
{id:283,question:"違反會員自律公約之處置，下列何者為非？",options:{"A":"先請示主管機關，核准後再處置","B":"由各業公會依規定辦理","C":"依自律公約規定處分","D":"處分報經各公會理事會決議後執行並報知主管機關"},answer:"A"},
{id:284,question:"違反會員自律公約之處分，以下何者為非？",options:{"A":"處以違約金","B":"停止其應享有之部分或全部權益","C":"責令會員對其所屬人員為適當之處分","D":"終止會員營業執照"},answer:"D"},
{id:285,question:"金融從業人員應遵守守法原則，故：",options:{"A":"可從事內線交易","B":"不得有違反或幫助他人違反法令之行為","C":"可洩露客戶資料","D":"可違反相關規定"},answer:"B"},
{id:286,question:"下列何者不屬於洗錢防制法所稱金融機構？",options:{"A":"票券金融公司","B":"證券集中保管事業","C":"人力銀行","D":"信用卡公司"},answer:"C"},
{id:287,question:"金融從業人員之職業道德不包含下列何者？",options:{"A":"保護公司資產","B":"保守客戶秘密","C":"個人利益至上","D":"誠信、客觀"},answer:"C"},
{id:288,question:"何者為金融從業人員應有之表現？",options:{"A":"知悉公司有重大舞弊案件，應循正當管道向上級通報","B":"從事不當授信、涉及嚴重違反授信原則之業務","C":"知悉公司財務及業務重大缺失，未向公司內部稽核部門報告","D":"為自己或第三人不法之利益，損害公司之利益"},answer:"A"},
{id:289,question:"金融從業人員依據洗錢防制法之規定，不得有下列何種行為？",options:{"A":"掩飾或隱匿因自己或他人重大犯罪所得財物或財產上利益者","B":"收受、搬運、寄藏或收買他人因重大犯罪所得財物或財產上利益者","C":"洩露或交付關於申報疑似洗錢交易或洗錢犯罪嫌疑之文書、圖畫、消息或物品者","D":"以上皆是"},answer:"D"},
{id:290,question:"金融從業人員應如何強化自身之法律知識且養成自律精神？",options:{"A":"不定期檢視相關法令之規定，留意是否有更改與增訂之法律規範","B":"參與同業公會所舉辦之在職訓練","C":"秉持守法、誠信原則，在所從事之業務行為上建立誠信與專業精神","D":"以上皆是"},answer:"D"},
{id:291,question:"金融從業人員之自律行為何者為非？",options:{"A":"未經許可，不得在公司工作時間內，兼任公司以外之任何職務","B":"對於公司各項文件、函電、簿冊、圖表、典章制度、公物等，得以攜出並對外談論","C":"對職務上所獲悉之任何未經公司同意公開之營業資訊負有絕對保密義務","D":"非經主管許可，不得擅自對外發表任何有關公司業務之意見"},answer:"B"},
{id:292,question:"金融服務業內部應加強宣導職業道德觀念，並且鼓勵員工於懷疑或發現有人違反法令規章或道德行為準則時之處理，下列何者不適當？",options:{"A":"隱忍不報","B":"向監察人報告","C":"向經理人報告","D":"向內部稽核主管報告"},answer:"A"},
{id:293,question:"金融相關從業人員之資格條件，下列何項不在優先考慮範圍之內？",options:{"A":"品德","B":"專業","C":"相關經驗","D":"性別"},answer:"D"},
{id:294,question:"金融從業人員於尚未符合相關人員資格時：",options:{"A":"可經辦各項業務","B":"代理經辦相關業務","C":"不得經辦相關業務","D":"於能力範圍內，仍可執行相關業務"},answer:"C"},
{id:295,question:"關於金融從業人員之道德規範，下列敘述何者為正確？",options:{"A":"因為自身的安危，即使知道直屬主管違反法規也不能越級報告","B":"為了同事間和諧的氣氛，我應該將同事私下向客戶收受回扣的事保密","C":"雖然金融從業人員必須保守客戶的秘密，但若家人需要，可以透露一些無所謂","D":"對於客戶的無禮要求，仍然必須依公司規定辦理"},answer:"D"},
{id:296,question:"金融從業人員得遵守下列單位所訂規範？",options:{"A":"從業人員自律規範","B":"政府機關命令","C":"公司規章","D":"以上皆是"},answer:"D"},
{id:297,question:"懲戒違反道德行為準則之員工時，應有下列何者考量？",options:{"A":"逕行公開譴責","B":"逕行吊銷或撤銷相關資格者，不得於媒體公告之，以保障其工作權及隱私權","C":"應給予申復機會及救濟管道","D":"以上皆是"},answer:"C"},
{id:298,question:"道德行為規範應包括何種原則？",options:{"A":"守法原則、誠信原則、自律原則","B":"保密原則、能力原則、資訊公開原則","C":"客戶利益優先原則、利益衝突原則、禁止不當得利原則","D":"以上皆是"},answer:"D"},
{id:299,question:"金融從業人員在自己的工作領域中，應：",options:{"A":"專注自己及他人之升遷","B":"不參加公司的教育訓練","C":"不斷加強自己的專業知識","D":"不涉獵本業以外之相關知識"},answer:"C"},
{id:300,question:"道德行為規範適用之事業體為何？",options:{"A":"限於上市櫃公司","B":"限於金融產業","C":"限於營利事業","D":"各種事業體均得適用"},answer:"D"},
{id:301,question:"金融從業人員要落實公平待客原則，必須先奠定從業人員認定公平待客之重要性，首要將下列何者列為宗旨",options:{"A":"優先保障公司權益","B":"優先保障集團利益","C":"優先保障金融消費者利益","D":"以上皆是"},answer:"C"},
{id:302,question:"對於金融從業人員之行為，下列何者為非？",options:{"A":"不應利用公司內部資訊為自己謀取利益","B":"可與客戶約定分享利益或共同承擔損失","C":"不可利用客戶帳戶或名義為自己從事交易","D":"不可將他人或自己帳戶供客戶從事交易"},answer:"B"},
{id:303,question:"金融從業人員對於往來客戶，於符合法令規定之範圍內，下列作為何者為是？",options:{"A":"提供客戶充足之資訊，以便其充分瞭解公司業務","B":"當客戶合法權益受到侵害時，應正面回應，並作妥適之處理","C":"確實依據相關法令、公司章程之規定，忠實履行職務","D":"以上皆是"},answer:"D"},
{id:304,question:"信用卡發卡機構辦理催收欠款業務時，下列何項為應遵守之事項？",options:{"A":"不得違反公共利益","B":"僅能對債務人本人及其保證人催收","C":"不得對非債務之第三人之干擾或催討","D":"以上皆是"},answer:"D"},
{id:305,question:"信用卡發卡機構之行銷人員從事下列行為何者不正確？",options:{"A":"自行勾選未經客戶同意申請之卡片","B":"確認客戶申請之卡片","C":"確認客戶資料無誤才送件","D":"確認申請人本人身分，以免冒名申請"},answer:"A"},
{id:306,question:"有關金融從業人員辦理衍生性金融商品業務，應提醒客戶於交易前充分瞭解之事項，下列何者為正確？",options:{"A":"商品之性質","B":"相關之財務、會計、稅制或法律等事宜","C":"自行審度本身財務狀況及風險承受度","D":"以上皆是"},answer:"D"},
{id:307,question:"下列關於金融從業人員辦理投資型金融商品推介或銷售業務時，下列應遵守之事項何者有誤？",options:{"A":"依據客戶風險之承受度提供客戶適當之商品","B":"避免不當銷售或推介之行為","C":"不可販售客戶資料，惟可提供給自己親友開設的公司參考","D":"廣泛了解客戶之家庭背景、生涯規劃"},answer:"C"},
{id:308,question:"金融從業人員辦理徵信工作，以下敘述何者有誤？",options:{"A":"徵信人員應依誠信公正原則，辦理徵信工作","B":"為謀徵信工作迅速完成，徵信單位對於經常往來客戶，毋需再辦理徵信","C":"徵信人員對徵信資料應依法嚴守秘密","D":"辦理徵信，除另有規定外，應以直接調查為主，間接調查為輔"},answer:"B"},
{id:309,question:"下列何者不得接受上市公司、上櫃公司、證券承銷商所提供利益或其它利益？",options:{"A":"各金融事業公會會員","B":"金融事業負責人","C":"金融從業人員","D":"以上皆是"},answer:"D"},
{id:310,question:"投顧事業業務廣告如違反相關規範，投信投顧公會應進行查證，對於涉有違反規範之情事者將如何處理？",options:{"A":"提證期局審議","B":"提消保會議處","C":"直接報金管會","D":"提公會自律委員會審議"},answer:"D"},
{id:311,question:"下列何者不違反投信投顧公會會員自律公約？",options:{"A":"向上市公司募集基金，並將經理之基金投資於該上市公司股票","B":"不洩露所管理的基金或委任人委任事項的相關資訊","C":"向上櫃公司募集基金，且承諾將該資金投資於該上櫃公司股票","D":"在未經核准前，接受客戶預約認購基金"},answer:"B"},
{id:312,question:"金融從業人員自律規範中，有關個人交易須申報的帳戶規範對象為：",options:{"A":"以自己名義開立之帳戶","B":"配偶之帳戶","C":"配偶利用他人名義持有者之他人帳戶","D":"以上皆是"},answer:"D"},
{id:313,question:"吳自強是一位證券分析人員，他從上市公司ABC的員工處得知ABC產品設計發生重大瑕疵，並且主要客戶因此已經取消大部分的訂單。吳自強發現該消息尚未公佈，吳自強應該：",options:{"A":"立即向公司指定人員或部門提出書面報告","B":"透露消息給報章雜誌媒體","C":"依據公平公正原則通知所有客戶","D":"通知親朋好友放空該ABC公司股票"},answer:"A"},
{id:1314,question:"為了保護金融消費者權益，讓金融消費爭議能公平、合理、有效的處理，下列何者是最重要且為金融業務整合性的專業法律？",options:{"A":"金融消費者保護法","B":"消費者保護法","C":"個人資料保護法","D":"證券投資人及期貨交易人保護法"},answer:"A"},
{id:315,question:"下列何者是屬於金融消費者保護法所謂的金融消費爭議，而受金融消費者保護法的保護？",options:{"A":"金融消費者與金融服務業間因商品或服務所生之刑事爭議","B":"金融消費者與金融服務業間因商品或服務所生之民事爭議","C":"金融消費者與金融服務業間因商品或服務所生之刑事及民事爭議","D":"金融消費者與金融服務業間所生之任何爭議"},answer:"B"},
{id:316,question:"證券商接受法人、其他機構或特定自然人授權買賣有價證券，為避免交易紛爭及業務人員操縱舞弊，下列何者不是證券商應注意的事項？",options:{"A":"應提供特別資訊與服務","B":"應確保客戶委託係依公平及衡平方式予以執行","C":"應注意依相關規定適當保存完善之執行委託紀錄及交易憑證","D":"應確定經紀部門及自營部門間應有適當之防火牆"},answer:"A"},
{id:317,question:"為公平合理、迅速有效處理金融消費爭議，以保護金融消費者權益，下列何者為依金融消費者保護法設立之金融消費爭議處理機構？",options:{"A":"財團法人證券投資人及期貨交易人保護中心","B":"財團法人金融消費評議中心","C":"財團法人中華民國證券暨期貨市場發展基金會","D":"行政院消費者保護會"},answer:"B"},
{id:318,question:"金融服務業從事廣告、業務招攬及營業促銷活動，不得有下列何種情事？",options:{"A":"違反法令、主管機關之規定或自律規範","B":"虛偽、不實、隱匿、或其他足致他人誤信","C":"損害金融服務業或他人營業信譽","D":"以上皆是"},answer:"D"},
{id:319,question:"金融服務業從事廣告、業務招攬及營業促銷活動，不得有下列何種情事？",options:{"A":"故意截取報章雜誌不實之報導作為廣告內容","B":"對於業績及績效作誇大之宣傳","C":"使用之文字或訊息內容使人誤信能保證本金之安全或保證獲利","D":"以上皆是"},answer:"D"},
{id:320,question:"證券商業務人員辦理衍生性金融商品交易業務，於交易相對人要求確認其身分時，應如何處理？",options:{"A":"請客戶自行打電話給公司確認","B":"應配合出示身分證明文件或識別證件","C":"立刻報警處理","D":"不予理會，要辦不辦隨客戶便"},answer:"B"},
{id:321,question:"金融消費者向財團法人金融消費評議中心申請金融消費爭議之評議，下述何種情形將會被決定不受理？",options:{"A":"未先向金融服務業申訴","B":"非屬金融消費爭議","C":"申請已逾法定期限","D":"以上皆主"},answer:"D"},
{id:322,question:"財團法人金融消費評議中心對金融服務業與金融消費者間之金融消費爭議所作出的評議決定書，經送經法院核可者，其法律效力如何？",options:{"A":"與民事確定判決有同一之效力","B":"金融服務業與金融消費者事後可再進行協商","C":"金融服務業得就該事件再次申請評議","D":"金融服務業事後後悔，可不接受評議決定"},answer:"A"},
{id:323,question:"下列何者是屬於金融消費者保護法所稱的金融服務業？",options:{"A":"證券業","B":"銀行業","C":"期貨業","D":"以上皆是"},answer:"D"},
{id:324,question:"財團法人金融消費評議中心對於金融消費者申請評議之金融消費爭議案件，有那些處理機制？",options:{"A":"未先向該金融服務業經申訴的申請案，先移請該金融服務業先行處理","B":"試行調處","C":"進行評議","D":"以上皆是"},answer:"D"},
{id:325,question:"金融服務業從事廣告、業務招攬及營業促銷活動，依法皆受到主管機關的監督管理，下列利用何種傳播媒體、宣傳工具或方式屬之？",options:{"A":"電腦、傳真、電話、手機簡訊、廣播、跑馬燈","B":"宣傳單、布條、招牌、公車或其他交通工具上之廣告","C":"與公共領域相關之網際網路、電子郵件及電子視訊等","D":"以上皆是"},answer:"D"},
{id:326,question:"金融服務業與金融消費者訂立提供金融商品或服務之契約前，下列敘述何者為正確？",options:{"A":"應充分了解金融消費者之相關資料，以確保該商品或服務對金融消費者之適合度","B":"應向金融消費者充分說明該金融商品、服務及契約之重要內容，並充分揭露風險","C":"金融服務業對於金融消費者個人資料之蒐集、處理及利用者，應向金融消費者充分說明個人資料保護之相關權利，以及拒絕同意可能之不利益","D":"以上皆是"},answer:"D"},
{id:327,question:"政府為更積極保護證券投資人，訂定多種專業法律，請問下列何者不屬於此種專業法律？",options:{"A":"證券交易法","B":"組織犯罪防制條例","C":"金融消費者保護法","D":"證券投資人及期貨交易人保護法"},answer:"B"},
{id:328,question:"依金融消費者保護法之規定，金融服務業提供金融商品或服務前說明契約重要內容及揭露風險之金融消費者，是指下列何者？",options:{"A":"與金融服務業訂定金融商品或服務契約之契約相對人","B":"契約相對人為無行為能力人者，其法定代理人","C":"契約相對人為限制行為能力人、受輔助宣告人者，其法定代理人、輔助人","D":"以上皆正確"},answer:"D"},
{id:329,question:"證券商經營有價證券承銷、自行買賣、受託買賣等業務，應由何人執行？",options:{"A":"公司一般職員","B":"公司董事或監察人","C":"依證券商負責人及業務人員管理規則規定登記合格之業務人員","D":"以上人員皆可"},answer:"C"},
{id:330,question:"公司在本身合乎規定之情形下申請案件，僅為縮短辦理時程而對公家機關承辦公務員贈送高價禮品，是否合法？",options:{"A":"基於人情世故不構成違法","B":"構成不違背職務行賄罪","C":"構成違背職務行賄罪","D":"送禮均不構成違法送錢才違法"},answer:"B"},
{id:331,question:"行（受）賄罪成立要素之一為具有對價關係，而作為公務員職務之對價有「賄賂」或「不正利益」，下列何者不屬於「賄賂」或「不正利益」？",options:{"A":"招待至溫泉飯店住宿泡溫泉","B":"介紹工作","C":"免除債務","D":"開工邀請觀禮"},answer:"D"},
{id:332,question:"有關向公務機關「請託關說」行為之敘述，下列何者不正確？",options:{"A":"請託關說是指其內容涉及機關業務具體事項之決定或執行，且因該事項之決定或執行致有不當影響特定權利義務之虞者","B":"要求制訂徇私之特殊規格，以利取得獨家議價權利，進而藉機獲取利益是違法之請託關說","C":"請民意代表向機關爭取採購標案，是選民服務的一種，並非請託關說","D":"不當請託關說有可能涉及刑事責任"},answer:"C"},
{id:333,question:"請問下列有關受理檢舉機關對於檢舉人保護之說明，何者不正確？",options:{"A":"政府訂有「獎勵保護檢舉貪污瀆職辦法」，明訂對檢舉人之保護","B":"受理檢舉之機關對於檢舉人之姓名、年齡、住所或居所有保密義務","C":"對於檢舉人之檢舉書、筆錄或其他資料，除有絕對必要者外，應另行保存，不附於偵查案卷內","D":"如有洩密情事，洩密人員雖不涉刑事責任，但有民事損害賠償責任"},answer:"D"},
{id:334,question:"為建立良好之公司治理制度，公司內部宜納入何種檢舉人制度？",options:{"A":"告訴乃論制度","B":"吹哨者（whistleblower）管道及保護制度","C":"不告不理制度","D":"一事不兩罰制度"},answer:"B"},
{id:335,question:"因檢舉同一貪污瀆職案件，最高獎金以新臺幣多少元為限？",options:{"A":"100萬","B":"300萬","C":"500萬","D":"1000萬"},answer:"D"},
{id:336,question:"檢舉人應以何種方式檢舉貪污瀆職始能核給獎金？",options:{"A":"匿名","B":"委託配偶檢舉","C":"以真實姓名檢舉","D":"以他人名義檢舉"},answer:"C"}

{id:1,question:"從危險管理之觀點，危險定義係指",options:{"A":"損失機率很高者","B":"容易造成傷害之活動","C":"損失機率可以預測者","D":"損失發生的不確定性"},answer:"D"},
{id:2,question:"下列何者屬可保危險：",options:{"A":"人身上危險","B":"財產上危險","C":"責任上危險","D":"以上皆是"},answer:"D"},
{id:3,question:"下列何者屬非人身上的危險？",options:{"A":"死亡","B":"失業","C":"疾病","D":"房屋失火"},answer:"D"},
{id:4,question:"對他人遭受的財產損失或身體傷害，依法應負賠償責任之危險為",options:{"A":"財產危險","B":"人身危險","C":"責任危險","D":"動態危險"},answer:"C"},
{id:5,question:"損失頻率係指",options:{"A":"理賠次數／保險單位數","B":"損失總額／簽單保費","C":"理賠次數／損失總額","D":"保險單位數／理賠次數"},answer:"A"},
{id:6,question:"損失幅度係指",options:{"A":"簽單保費／保險單位數","B":"損失總額／理賠次數","C":"理賠次數／損失總額","D":"保險單位數／理賠次數"},answer:"B"},
{id:7,question:"純損危險不會有下列何種可能結果",options:{"A":"獲利","B":"無損失","C":"有損失","D":"以上皆是"},answer:"A"},
{id:8,question:"保險與危險管理之對象，一般限於",options:{"A":"動態危險","B":"純損危險","C":"投機性危險","D":"群體性危險"},answer:"B"},
{id:9,question:"下列何種危險屬不可保危險：",options:{"A":"死亡","B":"火災","C":"車禍","D":"售價波動"},answer:"D"},
{id:10,question:"投機性危險與純損危險之不同，在於投機性危險具有那項特性",options:{"A":"獲利之可能","B":"道德性危險","C":"巨額損失的可能","D":"以上皆非"},answer:"A"},
{id:11,question:"以下何者屬一般商業保險所承保危險",options:{"A":"道德危險","B":"心理危險","C":"投機性危險","D":"純損危險"},answer:"D"},
{id:12,question:"下列何者非屬財產毀損所致直接損失",options:{"A":"本身價值滅失或減少","B":"修理費用","C":"營業中斷損失","D":"復原成本"},answer:"C"},
{id:13,question:"下列何者屬工廠因火災致營業中斷之損失",options:{"A":"靜態危險","B":"純損危險","C":"從屬損失","D":"以上皆是"},answer:"C"},
{id:14,question:"造成損失發生之意外事件係指",options:{"A":"危險事故","B":"危險因素","C":"危險程度","D":"以上皆非"},answer:"A"},
{id:15,question:"下列何者屬有形財物本身影響損失發生之危險因素",options:{"A":"實質危險因素","B":"道德性危險因素","C":"怠忽性危險因素","D":"以上皆是"},answer:"A"},
{id:16,question:"危險因素（Hazard）可分為",options:{"A":"財產的、人身的、責任的","B":"實質的、道德的、怠忽的","C":"實質的、社會的、經濟的","D":"靜態的、動態的"},answer:"B"},
{id:17,question:"惡意縱火詐領保險金，屬於",options:{"A":"道德性危險因素","B":"實質危險因素","C":"怠忽性危險因素","D":"以上皆是"},answer:"A"},
{id:18,question:"被保險人因有保險保障而對損失之發生漠不關心，以致增加無謂損失之情形，屬於",options:{"A":"惡意行為","B":"道德性危險因素","C":"怠忽性危險因素","D":"詐欺行為"},answer:"C"},
{id:19,question:"下列何者屬實質危險因素",options:{"A":"有形財物會影響損失發生之條件","B":"故意促使危險事故發生","C":"因疏忽或不注意而使危險事故發生","D":"以上皆是"},answer:"A"},
{id:20,question:"採行下列何種危險管理措施，可以完全將損失發生之頻率降為零",options:{"A":"損失預防","B":"避免危險","C":"損失抑制","D":"保險轉嫁"},answer:"B"},
{id:21,question:"因為外出有可能會發生意外，所以待在家中的行為屬",options:{"A":"損失預防","B":"損失移轉","C":"損失抑制","D":"避免危險"},answer:"D"},
{id:22,question:"損失頻率低、損失幅度小之危險，主要採",options:{"A":"避免","B":"預防與抑制","C":"損失自留","D":"保險"},answer:"C"},
{id:23,question:"損失頻率低、損失幅度大之危險，主要採",options:{"A":"避免","B":"預防與抑制","C":"損失自留","D":"保險"},answer:"D"},
{id:24,question:"危險管理對企業之效益為",options:{"A":"間接改善企業利潤","B":"直接增進企業績效","C":"決定企業經營成敗","D":"以上皆是"},answer:"D"},
{id:25,question:"危險管理對社會之效益為",options:{"A":"降低社會成本","B":"確保及增加社會之經濟效益","C":"促進社會經濟之進步與成長","D":"以上皆是"},answer:"D"},
{id:26,question:"危險管理對家庭之效益為",options:{"A":"巨災發生，仍維持一定生活水準","B":"可使負擔生計者，無後顧之憂，努力於創業","C":"可節省保費支出","D":"以上皆是"},answer:"D"},
{id:27,question:"下列何種危險管理措施具有降低損失頻率之功能",options:{"A":"損失預防","B":"損失抑制","C":"損失自留","D":"以上皆非"},answer:"A"},
{id:28,question:"下列何者屬於損失抑制措施",options:{"A":"消防救火","B":"災後清理或出售殘餘物","C":"傷者急救送醫及復健","D":"以上皆是"},answer:"D"},
{id:29,question:"針對損失幅度不大，且預期損失成本較能準確估計之損失，最宜採行何種危險管理措施",options:{"A":"保險轉嫁","B":"避免危險","C":"損失自留","D":"損失預防"},answer:"C"},
{id:30,question:"採行危險管理措施時，保險轉嫁與損失自留可以搭配運用，其最典型之方式，係於保險契約訂定",options:{"A":"特約條款","B":"自負額","C":"除外條款","D":"以上皆非"},answer:"B"},
{id:31,question:"危險管理採行損失自留，其條件為：",options:{"A":"危險之損失幅度不大，可以藉本身財務承擔能力予以吸收","B":"預期損失成本可以較準確估計","C":"危險轉嫁或其他危險管理措施不可行或成本不經濟","D":"以上皆是"},answer:"D"},
{id:32,question:"下列何種危險適合損失自留，如實施保險轉嫁反不經濟",options:{"A":"損失頻率高，幅度大","B":"損失頻率高，幅度小","C":"損失頻率低，幅度小","D":"損失頻率低，幅度大"},answer:"C"},
{id:33,question:"下列何者屬危險自己承擔的原因",options:{"A":"危險測定自願承擔","B":"由於對危險沒有採取防護性措施","C":"由於自己的錯誤或疏忽而造成損失由自己承擔","D":"以上皆是"},answer:"D"},
{id:34,question:"工程合約中的免責協定是何種危險管理方法",options:{"A":"損失預防","B":"避免","C":"損失抑制","D":"非保險轉嫁"},answer:"D"},
{id:35,question:"加強員工訓練以降低職業災害之發生是何種危險管理方法",options:{"A":"避免危險","B":"損失預防","C":"自行承擔","D":"損失轉嫁"},answer:"B"},
{id:36,question:"保險人業務經營之穩定與保險費率之合理，須賴下列何者之充份發揮運作",options:{"A":"危險管理","B":"控制理賠","C":"大數法則","D":"再保險"},answer:"C"},
{id:37,question:"對於發生頻率低而損失幅度大的危險，下列那種危險管理組合最好",options:{"A":"損失預防＋損失抑制","B":"損失預防＋自行承擔","C":"損失自留＋保險","D":"損失自留＋損失抑制"},answer:"C"},
{id:38,question:"經營保險事業之各種組織稱為",options:{"A":"保險人","B":"要保人","C":"被保險人","D":"保險經紀人"},answer:"A"},
{id:39,question:"以其財物、生命或身體為保險標的，在危險事故發生時，遭受損失，享有賠償請求權之人稱為",options:{"A":"要保人","B":"被保險人","C":"受益人","D":"保險代理人"},answer:"B"},
{id:40,question:"被保險人或要保人約定享有賠償請求權之人稱為",options:{"A":"要保人","B":"被保險人","C":"受益人","D":"保險代理人"},answer:"C"},
{id:41,question:"某一現象在若干次的重複中，會有規則出現，而抽樣數愈大，該出現愈規則稱為",options:{"A":"大數法則","B":"損害填補原則","C":"最大誠信原則","D":"以上皆非"},answer:"A"},
{id:42,question:"保險係透過下列何種方式，將預期的賠款成本，轉由被保險大眾分攤",options:{"A":"自負額","B":"繳交保險費","C":"代位求償","D":"再保險"},answer:"B"},
{id:43,question:"下列何者非屬於保險的功能",options:{"A":"損失補償","B":"促進損失預防","C":"社會救濟","D":"減少焦慮"},answer:"C"},
{id:44,question:"保險具有促使被保險人預防損失之功能，如能妥善採行，具有下列何種效益",options:{"A":"減少保險賠款","B":"降低保險費率","C":"降低社會成本","D":"以上皆是"},answer:"D"},
{id:45,question:"下列何種危險屬於不可保危險",options:{"A":"被保險人故意行為","B":"股價漲跌","C":"投機性危險","D":"以上皆是"},answer:"D"},
{id:46,question:"下列何者非屬可保危險在技術上應具備之條件",options:{"A":"危險單位數量眾多且性質相似","B":"損失非出於偶然","C":"危險事故所致損失須能界定","D":"保險費成本必須經濟合理"},answer:"B"},
{id:47,question:"受市場因素或經濟情況波動所致之損失不可保，係因",options:{"A":"凡過去損失經驗不佳，保險人不願承保","B":"有道德性危險","C":"損失程度無法明確界定，損失無法公平合理分攤","D":"損失可以預期，不合保險原則"},answer:"C"},
{id:48,question:"下列何種保險非屬財產保險業所得經營",options:{"A":"傷害保險","B":"責任保險","C":"保証保險","D":"年金保險"},answer:"D"},
{id:49,question:"政策保險係以實施特定之國家政策為目的之保險，下列何者屬非政策性保險",options:{"A":"社會保險","B":"輸出保險","C":"商業火險","D":"農業保險"},answer:"C"},
{id:50,question:"要保人投保時，基於",options:{"A":"損害補償原則","B":"主力近因原則","C":"最大誠信原則","D":"保險利益原則"},answer:"C"},
{id:51,question:"當事人於締結保險契約之時，要保人應將有關保險標的之重要事實告知保險人，且需遠超一般契約之誠意，所以學者稱保險契約為",options:{"A":"對價契約","B":"要物契約","C":"最大誠信契約","D":"非要式契約"},answer:"C"},
{id:52,question:"下列何者屬表達最大誠信原則之方式",options:{"A":"通知義務","B":"施救義務","C":"告知義務","D":"設立猶豫期間"},answer:"C"},
{id:53,question:"要保人故意不為真實之告知，致保險契約被解除時，其保險費應如何處理：",options:{"A":"必須返還","B":"無須返還","C":"可返還一半","D":"視個案而定"},answer:"B"},
{id:54,question:"訂立保險契約時，要保人應據實說明範圍以何為限：",options:{"A":"保險人的口頭詢問","B":"保險人的書面詢問","C":"以上皆是","D":"以上皆非"},answer:"B"},
{id:55,question:"要保人違反據實說明之義務，保險人知有解除之原因後，得行使解除權之期限為何：",options:{"A":"一個月","B":"二個月","C":"三個月","D":"四個月"},answer:"A"},
{id:56,question:"要保人違反據實說明之義務，保險人在訂立契約後多久期限內可以行使解除權：",options:{"A":"一年","B":"二年","C":"三年","D":"半年"},answer:"B"},
{id:57,question:"保險契約訂立時，保險標的之危險已發生或已消滅，原則上其契約效力為何：",options:{"A":"無效","B":"得終止","C":"得解除","D":"維持原狀"},answer:"A"},
{id:58,question:"被保險人在保險契約所約定之保險事故發生後，就其遭受的損害能獲得充分補償原則為",options:{"A":"最大誠信原則","B":"保險利益原則","C":"損害補償原則","D":"近因原則"},answer:"C"},
{id:59,question:"下列何種保險符合損害補償原則",options:{"A":"人壽保險","B":"定值保險","C":"重置成本財產保險","D":"實際現金價值財產保險"},answer:"D"},
{id:60,question:"財產保險契約雙方當事人於訂立契約時，事先約定保險價額而載明於契約稱為",options:{"A":"定值保險契約","B":"超額保險契約","C":"不定值保險契約","D":"原保險契約"},answer:"A"},
{id:61,question:"下列何者係指損失發生時，保險人支付於被保險人之補償金額",options:{"A":"保險金額","B":"保險價額","C":"保險利益","D":"保險賠款"},answer:"D"},
{id:62,question:"要保人如違反誠信，致保險人無法對危險做正確之估計，保險人有何權利",options:{"A":"解除保險契約","B":"免除賠償責任","C":"與被保險人比例分攤損失","D":"增加保險費"},answer:"A"},
{id:63,question:"對他人遭受的財產損失或身體傷害，依法應負賠償責任之危險為",options:{"A":"財產危險","B":"人身危險","C":"責任危險","D":"動態危險"},answer:"C"},
{id:64,question:"下列何者屬足額保險",options:{"A":"保險金額等於保險價額","B":"保險金額小於保險價額","C":"保險金額大於保險價額","D":"以上皆非"},answer:"A"},
{id:65,question:"下列何種保險屬保險金額等於保險價額",options:{"A":"定值保險","B":"超額保險","C":"足額保險","D":"以上皆非"},answer:"C"},
{id:66,question:"要保人或被保險人對於保險標的無保險利益者，其保險契約效力為何？",options:{"A":"契約失效","B":"保險人得解除契約","C":"保險人得撤銷契約","D":"保險人得終止契約"},answer:"A"},
{id:67,question:"要保人意圖不當得利而複保險者，保險契約效力為何？",options:{"A":"失效","B":"解除","C":"終止","D":"無效"},answer:"D"},
{id:68,question:"財產保險之要保人或被保險人於何時必須具有保險利益",options:{"A":"要保時","B":"保險契約成立時","C":"損失發生時","D":"請求賠償時"},answer:"C"},
{id:69,question:"惡意複保險契約法律效力為何",options:{"A":"無效","B":"解除","C":"終止","D":"以上皆非"},answer:"A"},
{id:70,question:"善意的超額保險，其契約效力為何？",options:{"A":"保險金額全部有效","B":"保險價額超過保險金額部份有效","C":"保險契約全部無效","D":"保險價額以內有效"},answer:"D"},
{id:71,question:"下列何者屬保險金額",options:{"A":"保險人在保險期間內所負之最高賠償責任","B":"保險標的之實際現金價值","C":"保險標的之可保價值","D":"以上皆是"},answer:"A"},
{id:72,question:"保險單中，保險人之最大賠償責任限額係指下列何者",options:{"A":"保險金額","B":"補償損失","C":"發票金額","D":"保險價額"},answer:"A"},
{id:73,question:"訂約時保險標的之價值未事先約定，而於契約中載明須至損失發生時，按保險事故發生時之實際價值計算賠償金額之契約稱為：",options:{"A":"定值保險契約","B":"變額保險契約","C":"不定值保險契約","D":"定額保險契約"},answer:"C"},
{id:74,question:"在不定值保險契約中，被保險人遇有不足額保險時，須按不足額之比例分攤損失，主要係因",options:{"A":"被保險人無等額之保險利益","B":"被保險人未以足額之保險金額為基礎，繳交應繳之保險費","C":"保險人須懲罰被保險人惡意為不足額之保險","D":"以上皆非"},answer:"B"},
{id:75,question:"下列何者屬保險標的之重置成本",options:{"A":"原始取得成本","B":"在估計價值之當時的重新購置成本","C":"零售價格","D":"以上皆是"},answer:"B"},
{id:76,question:"善意之超額保險，其保險金額超過可保價值部份屬於無效，故如有損失，應比照下列何種方式為理賠",options:{"A":"不足額保險","B":"足額保險","C":"解除保險契約","D":"以上皆非"},answer:"B"},
{id:77,question:"保險人行使代位求償權之金額，以下列何者為限",options:{"A":"侵權行為人法定賠償金額","B":"保險契約之保險金額","C":"保險人賠償金額","D":"以上皆非"},answer:"C"},
{id:78,question:"保險人於何時可行使代位求償權",options:{"A":"被保險人索賠時","B":"知悉肇事第三人對保險事故負有法律賠償責任時","C":"對被保險人給付賠償金額後","D":"以上皆非"},answer:"C"},
{id:79,question:"保險契約設定自負額，使得保險費率下降，原因為何？",options:{"A":"小額賠案之理賠費用減少","B":"小額之賠款支出減少","C":"被保險人之損失頻率與損失幅度降低","D":"以上皆是"},answer:"D"},
{id:80,question:"定值保險契約保險標的物之價值係於下列何種情形下訂定完成",options:{"A":"當事人雙方事先約定","B":"損失發生時再予估計","C":"依據市價核算","D":"以上皆非"},answer:"A"},
{id:81,question:"下列何者係屬保險契約中設定自負額之目的",options:{"A":"減少小額賠款及其理賠手續","B":"促使被保險人加強損失預防與控制","C":"促使危險性質改善，減少被保險人保險費負擔","D":"以上皆是"},answer:"D"},
{id:82,question:"對以重置成本為基礎之保險契約而言，下列敘述何者為不正確",options:{"A":"不會構成不足額保險","B":"可保價值係以重置成本計算","C":"計算可保價值，不須扣除折舊","D":"以上皆是"},answer:"A"},
{id:83,question:"下列何種保險契約最符合補償契約之精神",options:{"A":"定值保險契約","B":"不定值保險契約","C":"重置成本保險契約","D":"以上皆非"},answer:"B"},
{id:84,question:"保險人於決定損失是否為保險事故所致時，須確認導致損失之事故為",options:{"A":"因果關係上之直接原因","B":"時間上最接近之原因","C":"主力近因","D":"以上皆是"},answer:"C"},
{id:85,question:"某保單訂有扣減式自負額2,000元，當損失為4,500元時，保險人應負責賠償",options:{"A":"6,500元","B":"4,500元","C":"2,500元","D":"2,000元"},answer:"C"},
{id:86,question:"代位求償是下列何項保險原則延伸出來之子原則",options:{"A":"最大誠信原則","B":"保險利益原則","C":"損害補償原則","D":"主力近因原則"},answer:"C"},
{id:87,question:"某甲以同一汽車向乙保險公司投保車體損失險，又向丙公司投保汽車第三人責任險，此情形為",options:{"A":"複保險","B":"超額保險","C":"再保險","D":"以上皆非"},answer:"D"},
{id:88,question:"下列何者屬實際現金價值",options:{"A":"重置成本減折舊","B":"重置成本減費用","C":"重置成本減合理利潤","D":"重置成本減銷貨成本"},answer:"A"},
{id:89,question:"下列何者為保險人作成後交要保人收執且為保險契約成立之證明書據",options:{"A":"要保書","B":"保險單","C":"提單","D":"待通知保單（T.B.D）"},answer:"B"},
{id:90,question:"某甲房屋價值400萬元，向A保險公司投保火險200萬元，某日甲房屋遭鄰屋乙起火波及，損失300萬元，A保險公司於賠償甲房屋後，可向鄰屋乙求償",options:{"A":"400萬元","B":"300萬元","C":"200萬元","D":"150萬元"},answer:"D"},
{id:91,question:"下列何者屬保險契約中規範當事人雙方權利義務，且為普遍適用的條款",options:{"A":"特約條款","B":"不喪失價值條款","C":"基本條款","D":"防止損害擴大條款"},answer:"C"},
{id:92,question:"下列何者屬法律規定請求權存在之期限，逾此期限則請求權罹於時效而消滅",options:{"A":"除斥期間","B":"不爭條款","C":"消滅時效","D":"特約條款"},answer:"C"},
{id:93,question:"要保人只能依保險公司所定之條款同意訂立與否，並無討價還價空間之契約稱為",options:{"A":"單務契約","B":"有償契約","C":"附合契約","D":"射倖契約"},answer:"C"},
{id:94,question:"下列何者屬當事人於保險契約基本條款外，承諾履行特種義務之條款",options:{"A":"特約條款","B":"基本條款","C":"法定條款","D":"不爭條款"},answer:"A"},
{id:95,question:"要保人雖交付保費，但保險人是否給付保險金則繫於事故發生與否者之契約為何？",options:{"A":"單務契約","B":"有償契約","C":"射倖契約","D":"附合契約"},answer:"C"},
{id:96,question:"下列何者屬要保書的作用",options:{"A":"要保人的意思表示","B":"重要事項的告知","C":"保險人核保的依據","D":"以上皆是"},answer:"D"},
{id:97,question:"下列何者為保險契約成立之要件",options:{"A":"要約／承諾","B":"契約當事人具有行為能力","C":"契約當事人雙方之對價","D":"以上皆是"},answer:"D"},
{id:98,question:"下列何者非為保險契約生效之要件",options:{"A":"對價","B":"契約之目的須為合法","C":"契約當事人具有行為能力","D":"被保險人遵守最大誠信原則"},answer:"D"},
{id:99,question:"保險契約除外不保事項一般列示不承保之內容為何？",options:{"A":"標的","B":"危險事故","C":"損失","D":"以上皆是"},answer:"D"},
{id:100,question:"海上貨物保險契約將包裝不良所致之損失予以除外不保，其目的係為排除下列何種危險",options:{"A":"道德性危險","B":"怠忽性危險","C":"故意行為危險","D":"其他保險所承保之危險"},answer:"B"},
{id:101,question:"保險契約之明細表通常不列示",options:{"A":"被保險人名稱","B":"保險金額","C":"保險費","D":"除外不保事項"},answer:"D"},
{id:102,question:"下列何者非屬有關保險單載明不保事項的目的",options:{"A":"排除不可保危險","B":"減輕保險人的賠償責任","C":"便於保險公司控制危險","D":"避免兩種保險單保障的重複"},answer:"B"},
{id:103,question:"為避免同一類危險在兩種保險項下重複承保，一般以何種方式處理",options:{"A":"依其性質選擇由一種保險承保，而另一保險則予以除外不保","B":"降低保險費率以示公平","C":"損失發生時，由兩種保險平均分攤損失","D":"以上皆非"},answer:"A"},
{id:104,question:"保險契約一般將經常性或可以預期之損失予以除外不保，其目的為何？",options:{"A":"防止道德性危險","B":"排除一般性或非意外事故所致之損失，使保險費率合理化","C":"篩選品質優良之業務","D":"避免承保範圍重複"},answer:"B"},
{id:105,question:"保險契約中，要保人之對價為何？",options:{"A":"遵守誠信，據實告知","B":"繳付保險費","C":"善盡損失發生後與索賠時之各項義務","D":"以上皆是"},answer:"B"},
{id:106,question:"被保險人違反特約條款之法律效力為何？",options:{"A":"如損失之發生與特約條款之違反有因果關係，保險人才得據以解除保險契約","B":"無論損失之發生與特約條款之違反，有無因果關系，保險人皆得據以解除保險契約","C":"保險人得終止保險契約","D":"被保險人須補繳因而增加之保險費"},answer:"B"},
{id:107,question:"下列何種法律行為得使契約效力自始消滅？",options:{"A":"失效","B":"終止","C":"解除","D":"停效"},answer:"C"},
{id:108,question:"要保人依據保險契約有據實告知之義務，而該項義務應於何時履行",options:{"A":"保險契約存續期間","B":"損失發生時","C":"訂立保險契約時","D":"申請理賠時"},answer:"C"},
{id:109,question:"於基本條款外，何者屬保險公司與被保險人個別約定的條款",options:{"A":"明示條款","B":"默示條款","C":"特約條款","D":"航程變更條款"},answer:"C"},
{id:110,question:"下列有關特約條款的敘述何者為正確",options:{"A":"為當事人於保險契約的基本條款外，承認履行特種義務的條款","B":"與保險契約有關的一切事項，不問過去現在或將來，均得以特約條款定之","C":"保險契約當事人一方違反時，他方得解除契約","D":"以上皆是"},answer:"D"},
{id:111,question:"下列何者屬暫保單的功能",options:{"A":"減少簽發正式保單的繁瑣","B":"正式保單簽發前證明保險人的責任","C":"簡化被保險人投保的手續","D":"以上皆非"},answer:"B"},
{id:112,question:"下列何者為出具暫保單時機及目的",options:{"A":"保險契約部份條件尚未確定","B":"續保時，部份保險條件尚未重新洽妥時","C":"正式保單仍在繕製，而被保險人急需保險證明文件時","D":"以上皆是"},answer:"D"},
{id:113,question:"保險契約之批單構成契約之一部份，通常其效力",options:{"A":"等於原訂契約之規定","B":"優於原訂契約之規定","C":"次於原訂契約之規定","D":"以上皆非"},answer:"B"},
{id:114,question:"下列何者非屬批單的用途？",options:{"A":"證明保險的存在","B":"變更保險單的內容","C":"擴大承保範圍","D":"加保附加險"},answer:"A"},
{id:115,question:"為適應實際需要，保險契約訂立時或訂立後，經當事人雙方同意，用以補充或變更原保險契約內容之條款稱為",options:{"A":"保險單","B":"要保書","C":"批單","D":"暫保單"},answer:"C"},
{id:116,question:"下列何者於保險事故發生時有賠償損失之義務者為",options:{"A":"保險代理人","B":"保險經紀人","C":"保險人","D":"保險公證人"},answer:"C"},
{id:117,question:"下列何者屬保險契約中保險人之權利",options:{"A":"交付保險費","B":"請求賠償","C":"負擔賠償","D":"請求交付保險費"},answer:"D"},
{id:118,question:"下列何者於保險事故發生時，遭受損害，享有賠償請求權之人",options:{"A":"要保人","B":"被保險人","C":"保險人","D":"受益人"},answer:"B"},
{id:119,question:"下列何者屬保險契約中負有交付保險費義務之人",options:{"A":"要保人","B":"被保險人","C":"保險人","D":"受益人"},answer:"A"},
{id:120,question:"下列何者為財產保險契約中所指被保險人",options:{"A":"保險公證人","B":"受益人","C":"被保險財產之所有人","D":"保險人"},answer:"C"},
{id:121,question:"下列何者為要保人對保險人負擔保險責任所給付之對價",options:{"A":"保險金額","B":"保險費","C":"保險價額","D":"保險賠款"},answer:"B"},
{id:122,question:"下列何者於財產保險契約中，決定保險金額之根據為",options:{"A":"保險費","B":"保險價額","C":"要保人","D":"被保險人"},answer:"B"},
{id:123,question:"下列何者與保險契約發生直接關係，而為保險契約之當事人",options:{"A":"要保人及被保險人","B":"要保人與保險人","C":"受益人及被保險人","D":"被保險人及保險代理人"},answer:"B"},
{id:124,question:"下列何項為保險契約中不得以批單予以更改",options:{"A":"保險標的物之增減","B":"保險事故之更改","C":"保險期間之變更","D":"承認惡意之複保險為有效"},answer:"D"},
{id:125,question:"下列何者為保險契約之關係人",options:{"A":"被保險人","B":"保險代理人","C":"要保人","D":"保險經紀人"},answer:"A"},
{id:126,question:"以下所述何者為正確",options:{"A":"保險人在承保之危險事故發生時依其承保之責任有請求權","B":"保險人有負擔保險費之責任","C":"保險人在保險契約成立時，有保險費之請求權","D":"保險人係保險契約之關係人"},answer:"C"},
{id:127,question:"要求保險契約之當事人須具有行為能力，係因無行為能力之人具有下列何項瑕庛",options:{"A":"無力支付保險費","B":"容易發生保險事故","C":"意思表示依法無效","D":"以上皆是"},answer:"C"},
{id:128,question:"被保險人基於本身原因，提前終止保險契約，其保險費應如何處理",options:{"A":"按日數比例返還被保險人","B":"按短期費率計收有效期間保險費，餘額返還被保險人","C":"已繳之保險費不予退還","D":"以上皆非"},answer:"B"},
{id:129,question:"被保險人因故提前終止保險契約，其依短期保險費率計收之保險費較以日數比例計收之保險費為高，係因保險人須",options:{"A":"加速攤銷各項承保費用","B":"懲罰被保險人提前解約","C":"支應增加之賠款成本","D":"以上皆非"},answer:"A"},
{id:130,question:"以下何者為保險標的內容",options:{"A":"保險利益所寄存之客體","B":"保險契約之當事人","C":"保險承保之處所","D":"以上皆是"},answer:"A"},
{id:131,question:"下列何者為因財產之毀損而花費之修理復原費用",options:{"A":"間接損失","B":"直接損失","C":"從屬損失","D":"以上皆非"},answer:"B"},
{id:132,question:"下列何者屬保險標的之內容",options:{"A":"財產","B":"依法賠償責任","C":"人之身體或生命","D":"以上皆是"},answer:"D"},
{id:133,question:"凡列舉式保險契約，保險人對因列舉之危險事故所致之損失處理態度為何？",options:{"A":"無條件負賠償責任","B":"在因果關係上，非由除外不保事故引起者，始須負賠償責任","C":"無論直接或間接原因，均須由列舉之危險事故引起者，始須負賠償責任","D":"以上皆非"},answer:"B"},
{id:134,question:"下列何者屬俗稱之全險保險單",options:{"A":"概括式保險契約","B":"總括保額式保險契約","C":"列舉式保險契約","D":"以上皆非"},answer:"A"},
{id:135,question:"下列何種保險係採賠償責任限額方式承保",options:{"A":"火災保險","B":"海上貨物保險","C":"汽車綜合損失保險","D":"責任保險"},answer:"D"},
{id:136,question:"現金保險所承保事故不包括下列何者？",options:{"A":"火災及爆炸","B":"強盜","C":"搶奪","D":"監守自盜"},answer:"D"},
{id:137,question:"針對全險保險單，保險人處理態度為何？",options:{"A":"一切事故所致之損失負賠償責任","B":"一切事故所致之損失負賠償責任，但經載明除外不保之事項所致者不在此限","C":"因疏忽或過失所致之損失負賠償責任","D":"以上皆非"},answer:"B"},
{id:138,question:"於財產保險契約，以一個總保險金額，承保各處之貨物、財產，或承保同一地點之若干財產，此種保險稱為",options:{"A":"不定值保單","B":"總括保險單","C":"定值保單","D":"個別保險單"},answer:"B"},
{id:139,question:"下列何種保險之保險標的無可保價值",options:{"A":"海上貨物保險","B":"火災保險","C":"工程保險","D":"責任保險"},answer:"D"},
{id:140,question:"下列何者非為採定值保險的理由",options:{"A":"投保時保險金額有爭議","B":"保險標的市價不能確定","C":"保險標的發生損失時，不易估計","D":"保險標的發生損失後，不易重置"},answer:"A"},
{id:141,question:"我國產物保險商品採核准制者，主管機關應於收齊申請文件翌日起多久內核復",options:{"A":"30日","B":"40日","C":"45日","D":"90日"},answer:"B"},
{id:142,question:"責任保險中，不依責任性質分項訂定賠償限額，而以單一限額代替之承保方式為何",options:{"A":"合併單一總限額","B":"總括保額式","C":"概括式","D":"以上皆非"},answer:"A"},
{id:143,question:"下列何者為採定值保險方式承保之財產保險",options:{"A":"火災保險","B":"汽車保險","C":"海上貨物保險","D":"責任保險"},answer:"C"},
{id:144,question:"保險商品於保險業逕行銷售後十五個工作日內檢附資料送交主管機關備查。此一制度為",options:{"A":"核准制","B":"核備制","C":"備查制","D":"以上皆非"},answer:"C"},
{id:145,question:"下列何者屬保費中用以支付損失的部份",options:{"A":"附加保費","B":"純保費","C":"簽單保費","D":"滿期保費"},answer:"B"},
{id:146,question:"下列何項並非實施產險費率自由化之先決條件",options:{"A":"健全的保險市場","B":"完備的監理制度","C":"正確的統計資料","D":"足夠的行銷人員"},answer:"D"},
{id:147,question:"我國產險市場費率自由化採循序漸進方式實施，共分為幾個階段",options:{"A":"四個階段","B":"三個階段","C":"兩個階段","D":"未予明定"},answer:"B"},
{id:148,question:"下列何者為簽單保費中實際已兌現部份",options:{"A":"未滿期保費","B":"滿滿期保費","C":"附加保費","D":"純保費"},answer:"B"},
{id:149,question:"就監理實務而言，我國任意汽車保險之費率目前已採取下列何種費率制度",options:{"A":"強制費率","B":"規章費率","C":"自由費率","D":"以上皆非"},answer:"C"},
{id:150,question:"危險經過分類以後按照類別適用之費率計算保費之方法稱",options:{"A":"分類法","B":"個別法","C":"增減法","D":"追溯法"},answer:"A"},
{id:151,question:"下列何者係為符合公平原則，且有預防損失鼓勵作用之費率方法？",options:{"A":"分類法","B":"增減法","C":"個別法","D":"追溯法"},answer:"B"},
{id:152,question:"下列何者為財產保險商品審查應注意事項編撰內容",options:{"A":"審查會備忘錄","B":"審査委員審理意見","C":"相關審査原則","D":"以上皆是"},answer:"D"},
{id:153,question:"下列何者為我國未來將採取財產保險商品審查制",options:{"A":"核准制","B":"核備制","C":"準則制","D":"備查制方向邁進"},answer:"C"},
{id:154,question:"保險費率決定，按被保險危險之個別情況單獨計算之方法稱",options:{"A":"分類法","B":"個別法","C":"增減法","D":"追溯法"},answer:"B"},
{id:155,question:"費率之決定係依個別業務之情況單獨計算，亦即每筆業務由核保人員根據過去之費率及經驗向被保險人提出費率，由雙方決定費率，此種費率計算方法為",options:{"A":"分類法","B":"增減法","C":"個別法","D":"追溯法"},answer:"C"},
{id:156,question:"保險業務員有重大喪失債信情事尚未了結或了結後尚未逾",options:{"A":"一年","B":"二年","C":"三年","D":"四年"},answer:"C"},
{id:157,question:"業務員同時登錄為財產保險及人身保險業務員者",options:{"A":"其分別登錄之所屬公司","B":"其登錄之財產保險公司","C":"其登錄之人身保險公司","D":"其先登錄之保險公司"},answer:"A"},
{id:158,question:"下列敘述何者正確",options:{"A":"專屬代理人意指僅代理一家保險公司招攬業務","B":"普通代理人可同時接受數家保險公司委任代理","C":"保險代理人分為財產保險代理人及人身保險代理人","D":"以上皆是"},answer:"D"},
{id:159,question:"業務員違反下列何項情事者，所屬公司應按其情節輕重，予以處分",options:{"A":"妨害要保人或被保險人為告知者","B":"以登錄證供他人使用者","C":"未經所屬公司同意而招聘人員者","D":"以上皆是"},answer:"D"},
{id:160,question:"危險選擇就是要對下列何者作選擇？",options:{"A":"要保人","B":"被保險人","C":"保險標的物","D":"以上皆是"},answer:"D"},
{id:161,question:"核保是指保險人於承保前，對於保險標的之各種危險加以審核、評估，以作何決定",options:{"A":"承保與否","B":"承保條件","C":"承保費率","D":"以上皆是"},answer:"D"},
{id:162,question:"下列何者屬保險業務員之招攬行為",options:{"A":"解釋保險商品內容及保單條款","B":"說明填寫要保書注意事項","C":"轉送要保文件及保險單","D":"以上皆是"},answer:"D"},
{id:163,question:"關於核保下列敘述何者不正確？",options:{"A":"核保之主要工作在執行危險之選擇","B":"核保工作之主要目的在於鑑別危險之優劣，以決定業務之取捨","C":"嚴謹的核保，有助於保險經營之安全及利潤之穩定","D":"保險人應放寬核保標準，接受更多保單，以符合大數法則"},answer:"D"},
{id:164,question:"核保工作對於保險公司非常重要，下列何者為其理由",options:{"A":"鑑別危險之優劣","B":"決定業務之取捨","C":"確保保險公司經營之安全與利潤之穩定","D":"以上皆是"},answer:"D"},
{id:165,question:"保險人要求被保險人於損失發生後立即通知保險人，以使保險人得以作下列何種措施",options:{"A":"防止損失擴大","B":"保全殘餘之保險標的物","C":"調査損失發生之原因與損害程度","D":"以上皆是"},answer:"D"},
{id:166,question:"保險法規定被保險人違反損失通知之義務，保險人有何權限",options:{"A":"拒絕理賠","B":"就所受損失，請被保險人負賠償責任","C":"終止保險契約","D":"以上皆非"},answer:"B"},
{id:167,question:"被保險人發生保險事故，向保險人索賠時，須提供各項理賠文件，其主要目的為何？",options:{"A":"符合法令規定","B":"確定保險人之賠償責任及賠償金額","C":"便利損失分攤","D":"以上皆非"},answer:"B"},
{id:168,question:"保險法要求被保險人應於知悉保險事故發生後幾日內通知保險人",options:{"A":"三日內","B":"五日內","C":"七日內","D":"立即通知"},answer:"B"},
{id:169,question:"為使得保險人於支付保險賠款後，順利行使其對肇事第三人之代位求償權，被保險人應確實保留",options:{"A":"災後現場","B":"損失證明文件","C":"對該肇事第三人之損害賠償請求權","D":"和解書"},answer:"C"},
{id:170,question:"下列對比例再保險與非比例再保險的敘述何者為正確",options:{"A":"前者是危險之分擔，後者是損失的分擔","B":"前者的分攤基礎是保險金額，後者則是賠款","C":"前者對賠款分擔是按承擔保險金額責任之比例分擔，後者則在自負賠款額以上均由再保險人負擔","D":"以上皆是"},answer:"D"},
{id:171,question:"下列對再保險的敘述何者正確",options:{"A":"再保險合約的訂立方式可分為臨時與合約再保險","B":"上述方法均可以比例或非比例方式安排","C":"合約再保險又稱固定再保險","D":"以上皆是"},answer:"D"},
{id:172,question:"為確定保險人對於危險事故所致損失之賠償責任，保險人須查證",options:{"A":"事故是否發生於保險期間內","B":"被保險人對損失之項目是否具有保險利益","C":"導致損失之原因是否為保險事故","D":"以上皆是"},answer:"D"},
{id:173,question:"下列何者屬再保險的功能？",options:{"A":"分散危險責任","B":"擴大承保能量","C":"確保有利經營","D":"以上皆是"},answer:"D"},
{id:174,question:"下列敘述何者錯誤",options:{"A":"將分入再保業務的一部分給其他保險人的作法稱之為轉再保","B":"再保險依契約訂立之方式可分為合約再保險、臨時再保險","C":"超額賠款再保險屬於比例再保險","D":"在比例再保險中，再保險依約定比例分享保費並分擔損失"},answer:"C"},
{id:175,question:"下列敘述何者錯誤",options:{"A":"比率再保險以百分率決定自留水準","B":"溢額再保險以自留額決定自留水準","C":"比率再保與溢額再保均利用同險做為限制自留的參考","D":"比率再保分保人與再保險人分擔責任的依據是賠款"},answer:"D"},
{id:176,question:"保險法規定保險業者，最低自有資本之比率其作用是",options:{"A":"防止營運方法不當","B":"確保業者清償能力","C":"減少自由競爭之流弊","D":"增加經濟建設資金來源"},answer:"B"},
{id:177,question:"下列何者為經濟高度發展之國家，對於保險業之監理多採取方式",options:{"A":"公示方式","B":"準則方式","C":"實體監督方式","D":"以上皆非"},answer:"A"},
{id:178,question:"保險法規定保險業應按資本或基金實收總額之百分之",options:{"A":"十","B":"十五","C":"二十","D":"二十五"},answer:"B"},
{id:179,question:"以下何者非屬於政府對於保險業之財務監理",options:{"A":"保險自留額之限制","B":"責任準備金之提存","C":"資金之運用","D":"清償能力之規範"},answer:"A"},
{id:180,question:"保險業財務狀況惡化，不能支付其債務時，主管機關得依情節輕重分別為下列處分",options:{"A":"派員接管","B":"勒令停業","C":"命令解散","D":"以上皆是"},answer:"D"},
{id:181,question:"下列何者屬再保險之監理範圍",options:{"A":"自留額度","B":"核可再保公司","C":"再保險合約","D":"以上皆是"},answer:"D"},
{id:182,question:"金融消費者就金融消費爭議事件應先向金融服務業提出申訴，金融服務業應於收受申訴之日起三十日內為適當之處理，並將處理結果回覆提出申訴之金融消費者",options:{"A":"被保險人","B":"保險人","C":"保險經紀人","D":"保險公證人"},answer:"A"},
{id:183,question:"保險安定基金有墊付範圍及限額規定，目的為何？",options:{"A":"促使消費者慎選保險公司","B":"保障安定基金償付能力","C":"保障正常經營的保險公司不會因問題保險公司拖累","D":"以上皆是"},answer:"D"},
{id:184,question:"下列何單位提撥出资設立財團法人保險安定基金",options:{"A":"保險事業發展中心","B":"銀行","C":"人身及財產保險業","D":"保險局"},answer:"C"},
{id:185,question:"保險契約基本條款通常規定被保險人應履行下列何種義務？",options:{"A":"據實告知","B":"危險增加通知","C":"危險發生通知","D":"以上皆是"},answer:"D"},
{id:186,question:"保險安定基金設立目的為何？",options:{"A":"維護保險經紀人","B":"保障保險公司權益","C":"保障被保險人權益，維護金融之安定","D":"維護代理人權益，促進金融之安定"},answer:"C"},
