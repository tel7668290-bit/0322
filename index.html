<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小寶貝專屬題庫練習系統</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .screen {
            width: 100%;
            max-width: 750px;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            align-items: center;
            max-height: 95vh;
            overflow-y: auto;
        }
        .active-screen { display: flex; }

        h1 { font-size: 26px; color: #38bdf8; margin-top: 0; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #94a3b8; margin-bottom: 20px; font-size: 14px; text-align: center; }

        /* ---------------- 首頁專區排版設計 ---------------- */
        .section-header {
            width: 100%;
            color: #fbbf24;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
            border-bottom: 2px solid #334155;
            padding-bottom: 5px;
            letter-spacing: 1px;
        }

        .subject-card {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .subject-title {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .start-action { color: #ffffff; }
        .start-action:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        .review-action { background: #334155; color: #cbd5e1; border: 1px solid #475569; }
        .review-action:hover { background: #475569; color: #fff; transform: translateY(-2px); }

        /* 各科專屬主題色 */
        .theme-mixed { background: #38bdf8; color: #0f172a; font-size: 16px; padding: 14px; }
        .theme-practice { background: #6366f1; }
        .theme-law { background: #ec4899; }
        .theme-ethics { background: #f59e0b; }
        .theme-theory { background: #10b981; }
        .theme-finance { background: #06b6d4; }

        .nav-btn {
            background: #334155;
            color: #cbd5e1;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            align-self: flex-start;
            margin-bottom: 15px;
        }

        /* ---------------- 測驗區樣式 ---------------- */
        .quiz-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 15px;
        }
        .question-text { font-size: 18px; font-weight: bold; margin-bottom: 20px; width: 100%; line-height: 1.5; }
        
        .options-grid { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            padding: 12px 15px;
            background: #0f172a;
            border: 2px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1.4;
        }
        .opt-btn:hover:not(:disabled) { border-color: #38bdf8; background: #1e293b; }
        .correct { background: #22c55e !important; border-color: #22c55e !important; color: white !important; }
        .wrong { background: #ef4444 !important; border-color: #ef4444 !important; color: white !important; }

        .feedback-area { height: 50px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-top: 10px; text-align: center; }
        .next-btn { background: #fbbf24; color: #0f172a; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none; margin-top: 5px; }

        /* ---------------- 複習清單樣式 ---------------- */
        .review-list { width: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .review-card { background: #0f172a; border-left: 4px solid #334155; padding: 12px; border-radius: 8px; line-height: 1.5; }
        .review-q { font-size: 15px; font-weight: bold; margin-bottom: 6px; color: #f8fafc; }
        .review-a { color: #4ade80; font-weight: bold; font-size: 14px; }

        @media(max-width: 600px) {
            .btn-row { grid-template-columns: 1fr; gap: 8px; }
        }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active-screen">
        <h1>❤️小寶專用系統❤️</h1>
        <div class="subtitle">讓小寶隨便就考到</div>
        
        <div class="section-header" style="margin-top: 0;">🚀 全方位綜合訓練</div>
<button class="action-btn theme-mixed" style="width: 100%; font-weight: 900;" onclick="startTest('mixed')"> 🎲 隨機測驗 (各科抽 15 題，共 75 題)</button>

<div class="section-header">📂 獨立科目測驗與複習 (每次隨機抽測 50 題)</div>

        <div class="subject-card">
            <div class="subject-title" style="color: #818cf8;">📄 專業科目：保險實務</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-practice" onclick="startTest('practice')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('practice')">📖 完整題庫</button>
            </div>
        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #f472b6;">⚖️ 專業科目：保險法規</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-law" onclick="startTest('law')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('law')">📖 完整題庫</button>
            </div>
        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #fbbf24;">🛡️ 專業科目：職業道德</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-ethics" onclick="startTest('ethics')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('ethics')">📖 完整題庫</button>
            </div>
        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #34d399;">💡 專業科目：保險理論</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-theory" onclick="startTest('theory')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('theory')">📖 完整題庫</button>
            </div>
        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #22d3ee;">📈 專業科目：金融市場常識</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-finance" onclick="startTest('finance')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('finance')">📖 完整題庫</button>
            </div>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <button class="nav-btn" onclick="goHome()">🏠 返回首頁</button>
        <div id="quiz-mode-title" style="font-weight: bold; margin-bottom: 10px; font-size: 16px;"></div>
        <div class="quiz-header">
            <div>進度：<span id="q-progress">0/0</span></div>
            <div>得分：<span id="q-score">0</span></div>
        </div>
        <div id="question" class="question-text">載入中...</div>
        <div id="options" class="options-grid"></div>
        <div id="feedback" class="feedback-area"></div>
        <button id="next-btn" class="next-btn" onclick="nextQuestion()">下一題 ➡️</button>
    </div>

    <div id="result-screen" class="screen">
        <h1>🎉 測驗結束</h1>
        <div id="final-score" style="font-size: 22px; color: #fbbf24; font-weight: bold; margin: 20px 0;"></div>
        <button class="action-btn theme-mixed" style="width: 100%; max-width: 300px; padding: 12px; border-radius: 8px;" onclick="goHome()">🏠 回到首頁</button>
    </div>

    <div id="review-screen" class="screen">
        <button class="nav-btn" onclick="goHome()">🏠 返回首頁</button>
        <h2 id="review-title" style="margin-top: 0; margin-bottom: 15px; font-size: 20px;">複習區</h2>
        <div id="review-container" class="review-list"></div>
    </div>

    <script>
        // ==========================================
        // 📌 題庫資料庫設定 (各科精選導入)
        // ==========================================

        // 1. 保險實務題庫
        const insurancePracticeBank = [
            { id: 1, question: "行動裝置保險條款中明訂要保人/被保險人的資格。下列何者可以是行動裝置保險所規範的要保人/被保險人?1.一般自然人;2 一般法人;3 未成年人;受監護宣告成年人", options: ["1、2", "2、3", "1、3", "1、2、3"], answer: 0 },
            { id: 2, question: "業務員在招攬行動裝置保險時需注意那些事項?1 被保險人是否已經完全瞭解商品所承保的範圍;2.保單條款相關的規定;3.簽名是否為被保險人本人親簽", options: ["1、2", "1、3", "2、3", "1、2、3"], answer: 3 },
            { id: 3, question: "要保人投保行動裝置保險契約時,應記載於要保書上之事項為何?", options: ["行動裝置商品名稱", "行動裝置空機建議售價", "要保人/被保險人資料", "以上皆是"], answer: 3 },
            { id: 4, question: "下列何者可作為行動裝置保險之保險標的?", options: ["已購買三個月以上的行動裝置", "折價出清之福利品/良品", "全新行動裝置商品", "經原廠維修過後的行動裝置"], answer: 2 },
            { id: 5, question: "行動裝置保險的保險標的為下列何者?", options: ["行動裝置本體", "另行購買之行動裝置配件", "行動裝置內所儲存之資料、照片等", "行動裝置內所安裝之 APP 軟體"], answer: 0 },
            { id: 6, question: "行動裝置保險之保險標的是以下列何者為識別依據?", options: ["品牌", "型號", "IMEI碼或S/N序號", "投保日期"], answer: 2 },
            { id: 7, question: "行動裝置保險要保書上,下列何者屬於必須包含之內容?", options: ["要/被保人之基本資料", "行動裝置識別碼", "以上皆是", "以上皆非"], answer: 2 },
            { id: 8, question: "行動裝置空機建議售價之高低,會影響行動裝置保險的何種內容?", options: ["保險費", "承保範圍", "保險期間", "理賠次數上限"], answer: 0 },
            { id: 9, question: "行動裝置保險所承保的損失包含下列何者?1·意外摔落之損壞;2 無法正常使用之故障;3.不明原因之遺失", options: ["1、2", "1、3", "2、3", "1、2、3"], answer: 0 },
            { id: 10, question: "下列何者屬於行動裝置保險條款所規範的不保事項?", options: ["被保險人故意行為", "從事犯罪或教唆犯罪或逃避合法逮捕之行為", "屬於原廠保固範圍內之故障", "以上皆是"], answer: 3 },
            { id: 11, question: "下列何者與行動裝置保險之保費計算有關?", options: ["被保險人年齡", "行動裝置空機建議售價", "行動裝置之生產地點", "電信資費金額"], answer: 1 },
            { id: 12, question: "下列何者為行動裝置保險契約適用之原則?", options: ["最大誠信原則", "保險利益原則", "損害補償原則", "以上皆是"], answer: 3 },
            { id: 13, question: "下列何者不屬於行動裝置保險之承保範圍?", options: ["行動裝置意外損壞", "屬原廠保固責任內之瑕疵故障", "行動裝置因意外摔落而螢幕破裂", "行動裝置因打翻飲料而受潮"], answer: 1 },
            { id: 14, question: "下列何者可做為行動裝置保險的保險標的?", options: ["家用音響", "藝術品", "於指定通路購買之全新行動裝置", "以上皆非"], answer: 2 },
            { id: 15, question: "下列何者不屬於行動裝置保險之承保範圍?", options: ["受潮", "機體斷裂", "軟體導致之當機", "螢幕摔破"], answer: 2 },
            { id: 16, question: "下列何者屬於行動裝置保險之承保範圍?", options: ["泡水", "壓毀", "機體斷裂", "以上皆是"], answer: 3 },
            { id: 17, question: "下列何種移動式電子裝置屬於行動裝置保險之保險標的?", options: ["手機", "平板", "筆電", "以上皆是"], answer: 3 },
            { id: 18, question: "行動裝置保險之保險標的是指?", options: ["意外事故", "行動裝置", "保險費", "以上皆是"], answer: 1 },
            { id: 19, question: "下列何者屬於行動裝置保險之保險標的?", options: ["保護殼", "行動裝置所下載之APP", "行動裝置之本體", "以上皆非"], answer: 2 },
            { id: 20, question: "行動裝置保險之保障範圍及條款是經過哪個單位審核後,才能在市場上銷售?", options: ["國家通訊傳播委員會(NCC)", "金融監督管理委員會保險局", "行政院消費者保護處", "經濟部商業司"], answer: 1 },
            { id: 21, question: "下列何者為行動裝置保險之保險標的?", options: ["冷氣機", "筆記型電腦", "微波爐", "電視"], answer: 1 },
            { id: 22, question: "下列何者為行動裝置保險的承保範圍?", options: ["電腦病毒所導致之當機", "電池之單獨損毀", "行動裝置自然耗損", "行動裝置本體斷裂"], answer: 3 },
            { id: 23, question: "要保人若要投保行動裝置保險,請問投保的時間點為何?", options: ["購買行動裝置後七天內", "購買行動裝置後十五天內", "購買行動裝置後三十天內", "購買行動裝置的當下"], answer: 3 },
            { id: 24, question: "下列何者為行動裝置保險的承保範圍?", options: ["軟體問題所導致之當機", "配件單獨損毀", "行動裝置本體受潮", "外殼刮傷未影響功能"], answer: 2 },
            { id: 25, question: "欲加購行動裝置保險的用戶小陶,購買之行動裝置若無IMEI碼,可由下列何種資料作為產品識別碼?", options: ["商品貨號", "S/N序號", "商品料號", "發票號碼"], answer: 1 },
            { id: 26, question: "行動裝置保險之保費高低是依據下列何項做變動?", options: ["空機建議售價", "綁定資費後售價", "促銷特惠價", "以上皆非"], answer: 0 },
            { id: 27, question: "在相同保障範圍之行動裝置保險,若空機建議售價分別為三萬元與兩萬元的行動裝置,何者保費較高?", options: ["兩萬元", "三萬元", "兩者相同", "無法比較"], answer: 1 },
            { id: 28, question: "行動裝置保險契約一般而言是以什麼為保險費計算的基礎?", options: ["行動裝置空機建議售價", "被保險人年齡", "被保險人性別", "電信資費金額"], answer: 0 },
            { id: 29, question: "行動裝置保險之被保險人包含?", options: ["經被保險人許可使用保險標的之人", "保險契約所載明之被保險人", "以上皆是", "以上皆非"], answer: 2 },
            { id: 30, question: "下列何種身分購買新手機,具有可購買行動裝置保險之資格?", options: ["新申裝", "續約", "攜碼", "以上皆是"], answer: 3 },
            { id: 31, question: "被保險人於每次理賠所需自行負擔之金額,稱之為?", options: ["自負額", "保險費", "電信資費", "加值服務費用"], answer: 0 },
            { id: 32, question: "下列何者非屬行動裝置保險標的物中所稱之「行動裝置」?", options: ["手機", "平板", "筆電", "桌上型電腦"], answer: 3 },
            { id: 33, question: "於保險期間內之理賠次數達累計最高賠償次數時,保險契約效力將會?", options: ["30天後終止", "立即終止", "自始無效,退還保費", "以上皆非"], answer: 1 },
            { id: 34, question: "行動裝置保險契約之內容若發生疑義時,應以有利於誰的解釋為原則?", options: ["保險公司", "電信公司", "被保險人", "依法院判決而定"], answer: 2 },
            { id: 35, question: "採分期繳付保險費之行動裝置保險契約,其每期保險費是透過何種方式收取?", options: ["專員到府收費", "經電信帳單代收", "信用卡扣款", "約定金融帳戶扣款"], answer: 1 },
            { id: 36, question: "下列何者可成為行動裝置保險之保險標的?", options: ["合作廠商所銷售之全新行動裝置", "家用電視", "家用冰箱", "行動裝置之配件"], answer: 0 },
            { id: 37, question: "被保險人因下列何種情況發生時,應主動通知保險公司?", options: ["綁約門號有過戶之情形", "連絡電話異動", "被保險人想終止保險契約", "以上皆是"], answer: 3 },
            { id: 38, question: "下列何者並非行動裝置保險之理賠方式?", options: ["現金給付", "原機維修", "置換保險標的", "以上皆是"], answer: 0 },
            { id: 39, question: "下列何者為行動裝置保險的承保範圍?", options: ["電腦病毒所導致之當機", "耳機孔、卡槽之單獨故障", "行動裝置本體斷裂", "外殼刮傷未影響功能"], answer: 2 },
            { id: 40, question: "下列何者不屬於行動裝置保險之保險標的?", options: ["行動裝置之配件", "行動裝置之軟體", "行動裝置之外盒", "以上皆是"], answer: 3 },
            { id: 41, question: "下列何者為行動裝置保險所規範的承保範圍?", options: ["保險標的之磨損、腐蝕、氧化、鏽垢、變質及自然耗損", "電池單獨損壞", "將受損之保險標的送至非指定維修中心修復", "以上皆非"], answer: 3 },
            { id: 42, question: "行動裝置保險對以下何種情況不予賠償?", options: ["軟體中毒", "整批產品有瑕疵,全部自市場回收之費用", "被保險人故意行為導致", "以上皆是"], answer: 3 },
            { id: 43, question: "下列何者為行動裝置保險所規範的承保範圍?", options: ["行動裝置之配件損毀", "因韌體未更新導致之當機", "不當改裝行動裝置而致之損壞", "以上皆非"], answer: 3 },
            { id: 44, question: "行動裝置保險之被保險人需要將受損之保險標的送至下列何處,以利理賠服務之申請?", options: ["保險公司指定維修中心", "通訊行", "國家通訊傳播委員會(NCC)", "便利商店"], answer: 0 },

            { id: 40, question: "關於業務員從事保險招攬行為，下列敘述何者錯誤？", options: ["（A）所屬公司對其登錄之業務員應嚴加管理，並就其業務員招攬行為所生之損害依法應負連帶責任", "（B）業務員轉送要保文件及保險單不屬於保險招攬行為", "（C）業務員招攬涉及人身保險之商品者，應親晤要保人及被保險人", "（D）業務員應於所招攬之要保書上親自簽名並記載其登錄字號"], answer: 1 },
            { id: 41, question: "保險業務員有下列何種情形，除有犯罪嫌疑，應依法偵辦外，其行為時之所屬公司，並應按其情節輕重，予以一年以下停止招攬行為或撤銷業務員之登錄處分？①唆使要保人或被保險人對保險人為不告知或不實之告知；或明知要保人或被保險人不告知或為不實之告知而故意隱匿②以錯價、放佣或其他不當折減保險費之方法招攬③未經授權代收保險費或經授權代收保險費而挪用、侵占所收保險費④經所屬公司同意而招聘人員", options: ["（A）①③④", "（B）①②③④", "（C）①②③", "（D）①②④"], answer: 2 },
            { id: 42, question: "有關保險業務員從事保險招攬所用之文宣、廣告、簡介、商品說明書及建議書等文書，下列敘述何者屬錯誤？", options: ["（A）應標明所屬公司之名稱", "（B）所屬公司為代理人、經紀人者並應標明往來保險業名稱", "（C）保險代理人、經紀人公司所屬業務員所使用之文宣、廣告、簡介、商品說明書及建議書等文書，應經其往來保險業提供或同意方可使用", "（D）廣告文宣之内容可與保險業報經主管機關審查通過之保單條款、費率及要保書文件不符"], answer: 3 },
            { id: 43, question: "已領得保險代理人或經紀人執業證照之已登錄保險業務員，下列處理何者正確？", options: ["（A）註銷登錄", "（B）維持登錄", "（C）撤銷或維持登錄均可", "（D）經允許可維持登錄"], answer: 0 },
            { id: 44, question: "保險業務員有下列何種情形，除有犯罪嫌疑，應依法移送偵辦外，其行為時之所屬公司，並應按其情節輕重，予以一年以下停止招攬行為或撤銷業務員之登錄處分？①影響要保人或被保險人權益之事項為不實之說明或不為說明②妨害要保人或被保險人為告知③對要保人、被保險人或第三人以誇大不實之宣傳、廣告或其他不當之方法為招攬④以威脅、利誘、隱匿、欺騙等不當之方法或不實之說明慫恿要保人終止有效契約而投保新契約致使要保人受損害", options: ["（A）①③④", "（B）①②④", "（C）①②③", "（D）①②③④"], answer: 3 },
            { id: 45, question: "下列何者敘述是錯的？", options: ["（A）業務員從事產物保險招攬行為，必須得到所屬公司授權", "（B）前項授權行為應以書面為之，並載明於其登錄證上", "（C）同時登錄為財產保險及人身保險業務員者，其分別登錄之所屬公司不必依法負連帶責任", "（D）業務員招攬行為，所生之損害，所屬公司就其授權範圍應負連帶責任"], answer: 2 },
            { id: 46, question: "保險業務員管理規則定義之經營同類保險業務所指為何？", options: ["（A）指所經營之業務同為經紀人業務或同為代理人業務", "（B）指所經營之業務同為業務員通路或同為銀行保險通路", "（C）指所經營之業務同為政策保險或同為社會保險", "（D）指所經營之業務同為財產保險或同為人身保險"], answer: 3 },
            { id: 47, question: "保險業務員登錄後，應專為下列何者從事保險招攬", options: ["（A）自己", "（B）他人", "（C）所屬公司", "（D）保險公會"], answer: 2 },
            { id: 48, question: "保險業務員招攬行為所生之損害，其所屬公司依法應負何責任？", options: ["（A）不負責任", "（B）連帶責任", "（C）抽象過失責任", "（D）具體過失責任"], answer: 1 },
            { id: 49, question: "保險業務員經所屬公司授權從事保險招攬之行為，其授權方式，應如何行使", options: ["（A）口頭即可", "（B）不拘形式", "（C）書面為之即可", "（D）書面為之，並載明於登錄證上"], answer: 3 },
            { id: 50, question: "下列何者屬於業務員招攬保險不實告知", options: ["（A）以誇大不實之方式就不同保險契約內容，或與銀行存款及其他金融商品作不當之比較", "（B）未經保險契約當事人同意或授權而為填寫、簽章有關保險契約文件", "（C）參加資格測驗，或參加特別測驗時，發生重大違規、舞弊", "（D）以上皆非"], answer: 0 },
            { id: 51, question: "保險業在何種情形下，因遭受損失得請求安定基金予以低利貸款或墊支？", options: ["（A）承受經營不善同業之契約", "（B）與經營不善同業進行合併", "（C）以上皆是", "（D）以上皆非"], answer: 2 },
            { id: 52, question: "主管機關視各種保險之發展狀況，依下列何種資料分別規定其銷售前應採行之程序、審核及內容有錯誤、不實或違反規定之處置等事項之準則", options: ["（A）各種保險單條款", "（B）保險費", "（C）保險單條款、保險費以外之其他相關資料", "（D）以上皆是"], answer: 3 },
            { id: 53, question: "為健全保險業務之經營，保險業應聘用精算人員並指派其中一人擔任什麽角色，負責保險費率之釐訂，各種準備金之核算簽證及辦理其他經主管機關指定之事項", options: ["（A）簽證理算人員", "（B）簽證會計人員", "（C）簽證精算人員", "（D）簽證綜理人員"], answer: 2 },
            { id: 54, question: "保險業因財務或業務狀況顯著惡化，不能支付其債務，或無法履行契約責任或有損及被保險人權益之虞時，主管機關最後得依情節之輕重，分別為那些處分？①監管②接管③勒令停業清理或命令解散④斷水斷電", options: ["（A）②③", "（B）①②③④", "（C）①②③", "（D）①②"], answer: 2 },
            { id: 55, question: "保險業保險代理人公司保險經紀人公司辦理電話行銷業務應注意事項之訂定目的？①規範保險業、保險代理人公司及保險經紀人公司以電話行銷方式招攬保險之行為②保障消費大眾權益③維護保險業、保險代理人公司及保險經紀人公司之專業形象④協助保險業、保險代理人公司及保險經紀人公司招攬保險", options: ["（A）①③④", "（B）①②④", "（C）①②③", "（D）①②③④"], answer: 2 },
            { id: 56, question: "依保險業保險代理人公司保險經紀人公司辦理電話行銷業務應注意事項之規定，於電話線上成立保險契約，財產保險業所銷售之商品組合每張保單年繳保費不得高於", options: ["（A）新臺幣三萬元", "（B）新臺幣六萬元", "（C）新臺幣十萬元", "（D）新臺幣五萬元"], answer: 3 },
            { id: 57, question: "保險業保險代理人公司保險經紀人公司辦理電話行銷業務應注意事項規定以電話行銷時，傷害保險之保險金額，不得超過新臺幣多少", options: ["（A）300 萬元", "（B）400 萬元", "（C）500 萬元", "（D）600 萬元"], answer: 3 },
            { id: 58, question: "保險業辦理電話行銷人員進行電話行銷過程應經要保人同意全程錄音並備份存檔，保存期限不得低於", options: ["（A）保險契約期滿或通知要保人不同意承保後五年", "（B）保險契約成立後五年", "（C）保險契約期滿後三年", "（D）保險契約成立後三年"], answer: 0 },
            { id: 59, question: "保險業對於因電話行銷過程溝通不良所造成之爭議，應作有利於何者之解釋及處理", options: ["（A）保險公司", "（B）要保人", "（C）電話行銷人員", "（D）以上皆非"], answer: 1 },
            { id: 60, question: "保險業之電話行銷人員進行電話行銷時，除應先確認要保人之身分外，並應完整告知要保人下列何種資料？①電話行銷人員自己之姓名②電話行銷人員所屬公司名稱、服務電話③電話行銷人員之登錄字號④保險契約重要內容", options: ["（A）①②③④", "（B）①②④", "（C）①②③", "（D）①③④"], answer: 0 },
            { id: 61, question: "下列何者非屬保險業保險代理人公司保險經紀人公司辦理電話行銷所規範適用對象", options: ["（A）保險公證人公司", "（B）保險公司", "（C）保險代理人公司", "（D）保險經紀人公司"], answer: 0 },
            { id: 62, question: "要保人與保險業、保險代理人公司或保險經紀人公司間因電話行銷爭議或涉訟時，下列何者不正確？", options: ["（A）要保人得要求提供錄音備份", "（B）保險業不得拒絕提供錄音備份", "（C）保險業得因提供錄音備份而酌收工本費", "（D）保險業雖提供錄音備份，但不得收費"], answer: 3 },
            { id: 63, question: "要保人對下列何者無保險利益？", options: ["（A）財產上之現有利益", "（B）單純期待", "（C）因財產上之現有利益而生之期待利益", "（D）以上皆非"], answer: 1 },
            { id: 64, question: "契約經撤銷後其法律效力為何", options: ["（A）溯及自訂立契約時不生效力", "（B）自撤銷之後不生效力", "（C）經公證人公證之後不生效力", "（D）以上皆非"], answer: 0 },
            { id: 65, question: "契約經終止後其法律效力為何", options: ["（A）溯及自訂約時不生效力", "（B）自終止以後不生效力", "（C）經公證人公證之後不生效力", "（D）以上皆非"], answer: 1 },
            { id: 66, question: "要保人或被保險人，對於保險標的物無保險利益者，保險契約效力為何", options: ["（A）失其效力", "（B）得解除", "（C）得撤銷", "（D）得終止"], answer: 0 },
            { id: 67, question: "合夥人或共有人聯合為被保險人時，其中一人或數人讓與保險利益於他人者，保險契約效力為何", options: ["（A）不因之而失效", "（B）得解除", "（C）得終止", "（D）無效"], answer: 0 },
            { id: 68, question: "保險業務員從事保險招攬所用之文宣、廣告、簡介、商品說明書及建議書等文書之內容，應經何種程序始可使用？", options: ["（A）經主管機關核准者即可使用", "（B）經財政部核准者即可使用", "（C）應經所屬公司核可同意後始可使用", "（D）無需經所屬公司核可同意即可使用"], answer: 2 },
            { id: 69, question: "第三人利益契約，認定受益人有疑義時，依法推定為何", options: ["（A）要保人為自己之利益而訂立", "（B）要保人為被保險人之利益而訂立", "（C）要保人為其繼承人之利益而訂立", "（D）以上皆是"], answer: 0 },
            { id: 70, question: "凡基於有效契約而生之利益下列何者敘述正確", options: ["（A）不得為保險利益", "（B）亦得為保險利益", "（C）與保險利益無關", "（D）以上皆非"], answer: 1 },
            { id: 71, question: "要保人為他人之利益訂立保險契約是否有所限制？", options: ["（A）應經委任", "（B）得不經委任", "（C）應經公證", "（D）以上皆非"], answer: 1 },
            { id: 72, question: "保險契約由代理人訂立者，有何限制？", options: ["（A）不須載明代訂之意旨", "（B）應載明代訂之意旨", "（C）沒有任何限制", "（D）不可代為訂立"], answer: 1 },
            { id: 73, question: "保險契約由合夥人或共有人中之一人或數人訂立，而其利益及於全體合夥人或共有人，依法應如何行使始屬有效？", options: ["（A）自然及於全體合夥人或共有人", "（B）如無相反意見，即視為及於全體合夥人或共有人", "（C）應載明為全體合夥人或共有人訂立之意旨", "（D）不需載明為全體合夥人或共有人訂立之意旨"], answer: 2 },
            { id: 74, question: "依保險法規定，自負額部份，要保人是否可另向他保險人訂立保險契約？", options: ["（A）可以", "（B）不得", "（C）保險法未規定", "（D）依保險契約規定"], answer: 1 },
            { id: 75, question: "契約上載明保險標的一定價值之保險契約屬下列何種契約", options: ["（A）定值保險契約", "（B）不定值保險契約", "（C）任意性保險契約", "（D）強制性保險契約"], answer: 0 },
            { id: 76, question: "下列何者屬於『依訂約時情形顯失公平致使該部份之約定無效』之情形？", options: ["（A）免除或減輕要保人依保險法應負之義務者", "（B）免除或減輕被保險人依保險法應負之義務者", "（C）免除或減輕受益人依保險法應負之義務者", "（D）免除或減輕保險人依保險法應負之義務者"], answer: 3 },
            { id: 77, question: "下列那些人依保險法規定，於訂約時有重大不利益者，顯失公平致使該保險契約部分之約定無效？①要保人②受益人③被保險人④代理人", options: ["（A）①②③④", "（B）①②④", "（C）①②③", "（D）①③④"], answer: 2 },
            { id: 78, question: "因惡意的複保險致保險契約無效時，保險人於不知情之時期內權利為何", options: ["（A）仍取得保險費", "（B）仍不能取得保險費", "（C）已收的保險費要返還", "（D）視契約的規定而定"], answer: 0 },
            { id: 79, question: "下列何者屬複保險之要素", options: ["（A）同一保險利益", "（B）同一保險事故", "（C）數保險人", "（D）以上皆是"], answer: 3 },
            { id: 80, question: "除另有約定外，複保險要保人應將下列何種資料通知各保險人：", options: ["（A）他保險人之名稱", "（B）他保險人之保險金額", "（C）以上皆是", "（D）以上皆非"], answer: 2 },
            { id: 81, question: "責任保險保險單約定「被保險人對於第三人就其責任所為之承認、和解或賠償，未經保險人參與時，保險人不受拘束。」此一約定之效力如何", options: ["（A）無效", "（B）效力未定", "（C）得撤銷", "（D）有效"], answer: 3 },
            { id: 82, question: "訂約時，僅要保人知危險發生者，而保險人不受契約之拘束時應如何處理", options: ["（A）保險人不得請求償還費用，亦不得請求已收受之保險費", "（B）保險人得請求償還費用，亦無須返還已收受之保險費", "（C）保險人不得請求償還費用，但得請求已收受之保險費", "（D）保險人得請求償還費用，不得請求已收受之保險費"], answer: 1 },
            { id: 83, question: "要保人不實之說明，足以變更或減少保險人對於危險之估計者，致保險契約被解除時，保險費如何處理", options: ["（A）應返還", "（B）無須返還", "（C）可返還一半", "（D）視個案而定"], answer: 1 },
            { id: 84, question: "關於財產保險業與人身保險業得經營業務之範圍，下列敘述何者錯誤", options: ["（A）人身保險業不得兼營財產保險", "（B）財產保險業經營財產保險", "（C）財產保險業經主管機關核准，得經營傷害保險", "（D）財產保險業經主管機關核准，得經營年金保險"], answer: 3 },
            { id: 85, question: "要保人違反保險法據實說明義務之法律效力為何", options: ["（A）保險人須於知有解除之原因後一個月內解除契約", "（B）保險人於危險發生後亦得解除契約", "（C）以上皆是", "（D）以上皆非"], answer: 2 },
            { id: 86, question: "要保人違反據實說明之義務，保險人知有解除之原因後，行使解除權之期限為多久", options: ["（A）一個月", "（B）二個月", "（C）三個月", "（D）四個月"], answer: 0 },
            { id: 87, question: "保險契約訂立時，保險標的之危險已發生或已消滅，原則上其契約效力如何", options: ["（A）無效", "（B）得終止", "（C）得解除", "（D）維持原狀"], answer: 0 },
            { id: 88, question: "訂約時僅要保人知危險已發生者，下列何者不受契約之約束", options: ["（A）保險人", "（B）被保險人", "（C）受益人", "（D）保險經紀人"], answer: 0 },
            { id: 89, question: "要保人有為隱匿或遺漏不為說明，或為不實說明，足以變更或減少保險人對於危險之估計者，保險人得如何行使權利", options: ["（A）終止契約", "（B）解除契約", "（C）撤銷契約", "（D）無效契約"], answer: 1 },
            { id: 90, question: "保險金額超過保險標的價值之契約，係由當事人一方之詐欺而訂立者，他方可以如何主張？", options: ["（A）得終止契約", "（B）得撤銷契約", "（C）得解除契約", "（D）契約無效"], answer: 2 },
            { id: 91, question: "保險金額超過保險標的價值之契約。如無詐欺情事者，其契約僅於保險標的價值之限度內為有效，例外情形為何？", options: ["（A）定額保險", "（B）不足額保險", "（C）定值保險", "（D）不定值保險"], answer: 2 },
            { id: 92, question: "無詐欺情事之超額保險契約，經當事人一方將超過價值之事實通知他方後，下列何項應按照保險標的之價值比例減少", options: ["（A）保險金額", "（B）保險費", "（C）保險金額及保險費", "（D）以上皆非"], answer: 2 },
            { id: 93, question: "保險人對於下列何者之故意行為所致的損害須負賠償責任", options: ["（A）要保人", "（B）被保險人", "（C）要保人及被保險人", "（D）保險經紀人"], answer: 3 },
            { id: 94, question: "保險人對戰爭所致的損害，下列何者敘述正確", options: ["（A）應負賠償責任", "（B）不負賠償責任", "（C）除契約有相反之訂定外，應負賠償責任", "（D）以上皆非"], answer: 2 },
            { id: 95, question: "保險契約之解釋有疑義時，依法應做如何解釋", options: ["（A）作有利保險人之解釋為原則", "（B）作有利被保險人之解釋為原則", "（C）參考民法之規定", "（D）提交公平會處理"], answer: 1 },
            { id: 96, question: "保險法對強制規定應如何處理", options: ["（A）皆不得以契約變更之", "（B）皆得以契約變更之", "（C）不得以契約變更之。但有利於被保險人者，不在此限", "（D）視情形而定是否得變更之"], answer: 2 },
            { id: 97, question: "保險業經營各種保險之保險單條款規定如何", options: ["（A）限使用本國文字", "（B）應使用國際上通用之文字", "（C）應使用中文，但因業務需要，得使用外文，並附中文譯本或節譯本", "（D）視情況而定"], answer: 2 },
            { id: 98, question: "以下何者屬當事人承認履行特種義務之條款", options: ["（A）特約條款", "（B）特別條款", "（C）特定條款", "（D）特別約款"], answer: 0 },
            { id: 99, question: "依保險法規定下列有關特約條款之敘述，何者錯誤？", options: ["（A）與保險契約有關之一切事項，不限於將來事項，得以特約條款定之", "（B）保險契約當事人之一方違背特約條款時，他方得解除契約；其危險發生後亦同", "（C）關於未來事項之特約條款，於未屆履行期前危險已發生，或其履行為不可能，或在訂約地為不合法而未履行者，保險契約不因之而失效", "（D）與保險契約有關之一切事項，僅限於將來事項，始得以特約條款定之"], answer: 3 },
            { id: 100, question: "保險契約當事人之一方違背特約條款時：", options: ["（A）他方得於事故發生後一個月内解除契約", "（B）他方得於知悉後一個月內解除契約", "（C）他方得於知悉後一個月内為撤銷契約之意思表示", "（D）他方得於知悉後 15 日內為拒賠之意思表示"], answer: 1 },
            { id: 101, question: "保險公司刊登、播放廣告及進行業務招攬或營業促銷活動時，下列敘述何者正確？①不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事②應確保其廣告內容之真實③對金融消費者所負擔之義務不得低於前述廣告之內容④對金融消費者所負擔之義務不得低於營業促銷活動時對金融消費者所提示之資料或說明", options: ["（A）①②③④", "（B）①②", "（C）①②③", "（D）①②④"], answer: 0 },
            { id: 102, question: "保險人對於由不可預料或不可抗力之事故所致之損害，負賠償責任，例外情形為何？", options: ["（A）由保險契約內容推論", "（B）保險契約內有明文限制者", "（C）順應情勢變更原則", "（D）符合公平正義原則"], answer: 1 },
            { id: 103, question: "保險人對於因履行什麽義務所致之損害，應負賠償責任", options: ["（A）契約上", "（B）倫理上", "（C）道德上", "（D）以上皆是"], answer: 2 },
            { id: 104, question: "保險人對於下列何者所致損害，應負賠償責任", options: ["（A）要保人之受僱人", "（B）被保險人之受僱人", "（C）要保人或被保險人所有之物或動物", "（D）以上皆是"], answer: 3 },
            { id: 105, question: "變更財產保險契約或恢復停止效力之財產保險契約時，保險人於接到通知後十日內不為拒絕者，其結果如何？", options: ["（A）不受影響", "（B）視為拒絕", "（C）視為承諾", "（D）以上皆非"], answer: 2 },
            { id: 106, question: "保險法之強制規定，不得以契約變更，但下列何種情形可以變更？", options: ["（A）有利保險人", "（B）有利被保險人", "（C）有利契約雙方當事人", "（D）有利於利害關係人"], answer: 1 },
            { id: 107, question: "下列何種情形屬危險增加而要保人不需通知保險人？①損害之發生不影響保險人之負擔者②危險增加，不由於要保人之行為所致者③為防護保險人之利益者④為履行道德上之義務", options: ["（A）①②④", "（B）①③④", "（C）①②③", "（D）①②③④"], answer: 1 },
            { id: 108, question: "要保人或被保險人不履行那些限期內通知義務者，對保險人因此所受損失，應負賠償責任", options: ["（A）保險事故消滅及危險減少", "（B）保險事故發生及危險減少", "（C）保險事故消滅及危險增加", "（D）保險事故發生及危險增加"], answer: 3 },
            { id: 109, question: "下列何種情形要保人有通知義務", options: ["（A）危險減少", "（B）危險增加", "（C）損害係為履行道德義務", "（D）依通常情況對方應知"], answer: 1 },
            { id: 110, question: "關於未來事項之特約條款，在何種情形下仍不因之使保險契約失效？①於未屆履行期前危險已發生②其履行為不可能③在訂約地為不合法而未履行", options: ["（A）①②", "（B）②③", "（C）①②③", "（D）①③"], answer: 2 },
            { id: 111, question: "保險法規定，關於海上保險，適用下列那項規定？", options: ["（A）民法海上保險章", "（B）英國海上保險法", "（C）國際海牙規則", "（D）海商法海上保險章"], answer: 3 },
            { id: 112, question: "關於貨物之保險，原則上自交運之時以迄於其目的地收貨之時為其期間。但例外情形為何？", options: ["（A）除民法另有規定外", "（B）除契約另有訂定外", "（C）除公路法另有規定外", "（D）除海商法另有規定外"], answer: 1 },
            { id: 113, question: "下列何者，其保險契約載明保險標的一定價值", options: ["（A）定額保險契約", "（B）定值保險契約", "（C）不定值保險契約", "（D）不定額保險契約"], answer: 1 },
            { id: 114, question: "契約上載明保險標的之價值，須至危險發生後估計而定之保險契約為何種保險", options: ["（A）定值保險", "（B）不定值保險", "（C）定額保險", "（D）以上皆非"], answer: 1 },
            { id: 115, question: "下列何者為火災保險人在保險期內所負責任之最高額度", options: ["（A）保險價額", "（B）保險價值", "（C）保險金額", "（D）保險標的物之約定價值"], answer: 2 },
            { id: 116, question: "保險標的未經約定價值，火災保險保險標的發生損失時，以何者為計算賠償之標準？", options: ["（A）保險事故發生時之市價", "（B）訂約時之實際價值", "（C）保險事故發生時之重置價值", "（D）保險事故發生時實際價值，且最多以保險金額為限"], answer: 3 },
            { id: 117, question: "依金融消費者保護法規定，金融服務業與金融消費者訂立提供金融商品或服務之契約前，應為下列何者之行為？①應向金融消費者充分說明該金融商品、服務及契約之重要內容②應向金融消費者充分揭露其風險③應保證金融消費者獲利④應與其他金融商品作比較", options: ["（A）①②③④", "（B）①②④", "（C）①②", "（D）①②③"], answer: 2 },
            { id: 118, question: "要保人為他人利益訂立保險契約，保險人對於要保人所得為之抗辯，亦得以之對抗誰？", options: ["（A）被保險人", "（B）受益人", "（C）保險代理人", "（D）保險經紀人"], answer: 1 },
            { id: 119, question: "善意複保險，其保險金額之總額超過保險標的之價值者，於何時要保人得依超過部份，要求比例返還保險費？", options: ["（A）危險發生前", "（B）危險發生後", "（C）危險發生前或後", "（D）以上皆非"], answer: 0 },
            { id: 120, question: "保險契約因惡意複保險而無效者，保險人在何時期內，仍取得保險費", options: ["（A）知情", "（B）不知情", "（C）不論知情或不知情", "（D）以上皆非"], answer: 1 },
            { id: 121, question: "保險人破產時，保險契約及保險費如何處理？", options: ["（A）於破產宣告之日繼續有效，保費不須退還", "（B）於破產宣告之日終止保險契約，終止後之保險費，已交付者，保費應返還", "（C）於破產宣告之日終止，但不須返還保費", "（D）以上皆非"], answer: 1 },
            { id: 122, question: "要保人破產時，保險契約終止後之保險費已交付者，應如何處理？", options: ["（A）不須返還", "（B）應返還", "（C）可返還亦可不返還", "（D）以上皆非"], answer: 1 },
            { id: 123, question: "以下那一項非保險公證人之工作範圍：", options: ["（A）保險標的物之查勘、鑑定", "（B）保險標的物之估價", "（C）賠款之理算、洽商", "（D）保險標的之修復"], answer: 3 },
            { id: 124, question: "保險標的物非因承保事故而全部滅失，下列何者敘述正確", options: ["（A）保險契約終止，終止後之保險費已交付者應返還", "（B）保險契約解除，全部之保險費已交付者應返還", "（C）保險契約無效，全部之保險費應返還", "（D）保險契約無效，終止後之保險費已交付者應返還"], answer: 0 },
            { id: 125, question: "下列何者屬被保險人為避免或減輕損害之必要行為所生之費用", options: ["（A）救助費用", "（B）損害防阻費用", "（C）救災費用", "（D）以上皆非"], answer: 1 },
            { id: 126, question: "保險法規定保險人對於被保險人為避免或減輕損害之必要行為所生之費用負償還之責用意為何", options: ["（A）鼓勵被保險人減少損害", "（B）儘可能多想辦法增加保險給付", "（C）提高大家對保險的興趣", "（D）以上皆是"], answer: 0 },
            { id: 127, question: "保險契約若無規定，則依保險法之規定，遇有保險人應負保險責任之事故發生，被保險人應於何時限內為通知？", options: ["（A）知悉後 10 日", "（B）發生後 72 小時", "（C）知悉後 5 日", "（D）發生後 48 小時"], answer: 2 },
            { id: 128, question: "危險達於應增加保險費或終止契約之程度者，依法如何處理", options: ["（A）由於要保人或被保險人之行為所致者，應於知悉後通知", "（B）由於要保人或被保險人之行為所致者，應先通知", "（C）不由於要保人或被保險人之行為所致者，應先通知", "（D）不由於要保人或被保險人之行為所致者，應於知悉後 5 日內通知"], answer: 1 },
            { id: 129, question: "老張把自己的住宅改成牛肉麵店，造成危險增加達到應增加保險費的程度，對保險人應如何處理", options: ["（A）應事先通知保險人", "（B）開張後十日內通知保險人", "（C）不通知保險人", "（D）發生危險時再補通知保險人"], answer: 0 },
            { id: 130, question: "由保險契約所生之權利，依法自何時起，經過二年不行使而消滅？", options: ["（A）自應賠付之日起", "（B）自得為訴訟時起", "（C）自得為請求之日起", "（D）並未規定"], answer: 2 },
            { id: 131, question: "責任保險之被保險人應於何時內對保險人為請求？", options: ["（A）事故發生時起二年", "（B）被保險人知悉之日起二年", "（C）被保險人受第三人請求之日起二年", "（D）以保險人受第三人通知之日起二年"], answer: 2 },
            { id: 132, question: "因救護保險標的物，致保險標的物發生損失者，下列何者正確", options: ["（A）由被保險人自行負擔", "（B）視同所保危險所生之損失", "（C）要另行加保才能賠償", "（D）須由保險人另行同意才能賠償"], answer: 1 },
            { id: 133, question: "下列何者屬火災保險人須賠償給被保險人損失？①保險標的物之毀損滅失②因救護保險標的物所致保險標的物之損失③避免或減輕損害之必要行為所生之費用", options: ["（A）①②", "（B）②③", "（C）①②③", "（D）①③"], answer: 2 },
            { id: 134, question: "火災保險之損失清單交出後多少時間後損失尚未完全估定者，被保險人得請求先行交付其所應得之最低賠償金額：", options: ["（A）半個月", "（B）一個月", "（C）二個月", "（D）三個月"], answer: 2 },
            { id: 135, question: "火災保險之被保險人為證明及估計損失所支出之必要費用，依法如何處理", options: ["（A）除契約另有訂定外，由保險人負擔", "（B）一律由保險人負擔", "（C）一律由被保險人負擔", "（D）臨時協議決定"], answer: 0 },
            { id: 136, question: "火災保險標的物受部份之損失者，保險人終止契約時，應於多久前通知要保人：", options: ["（A）5 日", "（B）10 日", "（C）15 日", "（D）20 日"], answer: 2 },
            { id: 137, question: "危險增加，由於要保人或被保險人之行為所致者，要保人不同意保險人另定保險費而終止契約時，保險人如有損失應如何處理？", options: ["（A）不得請求賠償", "（B）得請求賠償", "（C）應視情況而定再決定是否得請求賠償", "（D）以上皆非"], answer: 1 },
            { id: 138, question: "保險人知危險增加後，於何種情形下，喪失契約終止及損害賠償權利？ ①仍繼續收受保險費②危險發生後給付賠償金額③除前二項情形外，其他維持契約之表示者④要保人對於另定保險費不同意", options: ["（A）①②③④", "（B）①②④", "（C）①②③", "（D）①③④"], answer: 2 },
            { id: 139, question: "要保人對於危險之說明，有為隱匿或遺漏不為說明或，不實之說明者，足以變更或減少保險人對於危險之估計者，保險人得解除契約自何時起算一個月不行使而消滅？", options: ["（A）自要保人知情之日", "（B）自被保險人知情之日", "（C）自保險人知情之日", "（D）自受益人知情之日"], answer: 2 },
            { id: 140, question: "火災保險標的全部滅失或毀損，達於不能修復，或其修復之費用，超過保險標的恢復原狀所需者，保險法稱謂何種損失：", options: ["（A）共同海損", "（B）部份損失", "（C）全部損失", "（D）推定全損"], answer: 3 },
            { id: 141, question: "火災保險標的物不能以市價估計者，應如何定其價值？", options: ["（A）得由保險公證人決定", "（B）得由保險代理人決定", "（C）得由保險經紀人決定", "（D）得由當事人約定"], answer: 3 },
            { id: 142, question: "要保人或被保險人，對於保險標的物未盡約定保護責任所致的損失", options: ["（A）保險人不負賠償責任", "（B）保險人仍負賠償責任", "（C）因而增加的損失不負賠償責任", "（D）視情況而定"], answer: 0 },
            { id: 143, question: "危險事故發生後，經鑑定係因要保人或被保險人未盡合理方法保護標的物，其結果依法為何", options: ["（A）保險人不負全部賠償責任", "（B）保險人仍負全部賠償責任", "（C）因而增加之損失，保險人不負賠償責任", "（D）視情況而定"], answer: 2 },

  { id: 12, answer: "C", question: "下列何者非屬財產毀損所致直接損失", options: ["本身價值滅失或減少", "修理費用", "營業中斷損失", "復原成本。"] },
  { id: 13, answer: "D", question: "下列何者屬工廠因火災致營業中斷之損失", options: ["靜態危險", "純損危險", "從屬損失", "以上皆是。"] },
  { id: 14, answer: "A", question: "造成損失發生之意外事件係指", options: ["危險事故", "危險因素", "危險程度", "以上皆非。"] },
  { id: 15, answer: "A", question: "下列何者屬有形財物本身影響損失發生之危險因素", options: ["實質危險因素", "道德性危險因素", "怠忽性危險因素", "以上皆是。"] },
  { id: 16, answer: "B", question: "危險因素（Hazard）可分為", options: ["財產的、人身的、責任的", "實質的、道德的、怠忽的", "實質的、社會的、經濟的", "靜態的、動態的。"] },
  { id: 17, answer: "A", question: "惡意縱火詐領保險金，屬於", options: ["道德性危險因素", "實質危險因素", "怠忽性危險因素", "以上皆是。"] },
  { id: 18, answer: "C", question: "被保險人因有保險保障而對損失之發生漠不關心，以致增加無謂損失之情形，屬於", options: ["惡意行為", "道德性危險因素", "怠忽性危險因素", "詐欺行為。"] },
  { id: 19, answer: "A", question: "下列何者屬實質危險因素", options: ["有形財物會影響損失發生之條件", "故意促使危險事故發生", "因疏忽或不注意而使危險事故發生", "以上皆是。"] },
  { id: 20, answer: "B", question: "採行下列何種危險管理措施，可以完全將損失發生之頻率降為零", options: ["損失預防", "避免危險", "損失抑制", "保險轉嫁。"] },
  { id: 21, answer: "D", question: "因為外出有可能會發生意外，所以待在家中的行為屬", options: ["損失預防", "損失移轉", "損失抑制", "避免危險。"] },
  { id: 22, answer: "C", question: "損失頻率低、損失幅度小之危險，主要採", options: ["避免", "預防與抑制", "損失自留", "保險。"] },
  { id: 23, answer: "D", question: "損失頻率低、損失幅度大之危險，主要採", options: ["避免", "預防與抑制", "損失自留", "保險。"] },
  { id: 24, answer: "D", question: "危險管理對企業之效益為", options: ["間接改善企業利潤", "直接增進企業績效", "決定企業經營成敗", "以上皆是。"] },
  { id: 25, answer: "D", question: "危險管理對社會之效益為", options: ["降低社會成本", "確保及增加社會之經濟效益", "促進社會經濟之進步與成長", "以上皆是。"] },
  { id: 26, answer: "D", question: "危險管理對家庭之效益為", options: ["巨災發生，仍維持一定生活水準", "可使負擔生計者，無後顧之憂，努力於創業", "可節省保費支出", "以上皆是。"] },
  { id: 27, answer: "A", question: "下列何種危險管理措施具有降低損失頻率之功能", options: ["損失預防", "損失抑制", "損失自留", "以上皆非。"] },
  { id: 28, answer: "D", question: "下列何者屬於損失抑制措施", options: ["消防救火", "災後清理或出售殘餘物", "傷者急救送醫及復健", "以上皆是。"] },
  { id: 29, answer: "C", question: "針對損失幅度不大，且預期損失成本較能準確估計之損失，最宜採行何種危險管理措施", options: ["保險轉嫁", "避免危險", "損失自留", "損失預防。"] },
  { id: 30, answer: "B", question: "採行危險管理措施時，保險轉嫁與損失自留可以搭配運用，其最典型之方式，係於保險契約訂定", options: ["特約條款", "自負額", "除外條款", "以上皆非。"] },
  { id: 31, answer: "D", question: "危險管理採行損失自留，其條件為：", options: ["危險之損失幅度不大，可以藉本身財務承擔能力予以吸收", "預期損失成本可以較準確估計", "危險轉嫁或其他危險管理措施不可行或成本不經濟", "以上皆是。"] },
  { id: 32, answer: "C", question: "下列何種危險適合損失自留，如實施保險轉嫁反不經濟", options: ["損失頻率高，幅度大", "損失頻率高，幅度小", "損失頻率低，幅度小", "損失頻率低，幅度大。"] },
  { id: 33, answer: "D", question: "下列何者屬危險自己承擔的原因", options: ["危險測定自願承擔", "由於對危險沒有採取防護性措施", "由於自己的錯誤或疏忽而造成損失由自己承擔", "以上皆是。"] },
  { id: 34, answer: "D", question: "工程合約中的免責協定是何種危險管理方法", options: ["損失預防", "避免", "損失抑制", "非保險轉嫁。"] },
  { id: 35, answer: "B", question: "加強員工訓練以降低職業災害之發生是何種危險管理方法", options: ["避免危險", "損失預防", "自行承擔", "損失轉嫁。"] },
  { id: 36, answer: "C", question: "保險人業務經營之穩定與保險費率之合理，須賴下列何者之充份發揮運作", options: ["危險管理", "控制理賠", "大數法則", "再保險。"] },
  { id: 37, answer: "C", question: "對於發生頻率低而損失幅度大的危險，下列那種危險管理組合最好", options: ["損失預防＋損失抑制", "損失預防＋自行承擔", "損失自留＋保險", "損失自留＋損失抑制。"] },
  { id: 38, answer: "A", question: "經營保險事業之各種組織稱為", options: ["保險人", "要保人", "被保險人", "保險經紀人。"] },
  { id: 39, answer: "B", question: "以其財物、生命或身體為保險標的，在危險事故發生時，遭受損失，享有賠償請求權之人稱為", options: ["要保人", "被保險人", "受益人", "保險代理人。"] },
  { id: 40, answer: "C", question: "被保險人或要保人約定享有賠償請求權之人稱為", options: ["要保人", "被保險人", "受益人", "保險代理人。"] },
  { id: 41, answer: "A", question: "某一現象在若干次的重複中，會有規則出現，而抽樣數愈大，該出現愈規則稱為", options: ["大數法則", "損害填補原則", "最大誠信原則", "以上皆非。"] },
  { id: 42, answer: "B", question: "保險係透過下列何種方式，將預期的賠款成本，轉由被保險大眾分攤", options: ["自負額", "繳交保險費", "代位求償", "再保險。"] },
  { id: 43, answer: "C", question: "下列何者非屬於保險的功能", options: ["損失補償", "促進損失預防", "社會救濟", "減少焦慮。"] },
  { id: 44, answer: "D", question: "保險具有促使被保險人預防損失之功能，如能妥善採行，具有下列何種效益", options: ["減少保險賠款", "降低保險費率", "降低社會成本", "以上皆是。"] },
  { id: 45, answer: "D", question: "下列何種危險屬於不可保危險", options: ["被保險人故意行為", "股價漲跌", "投機性危險", "以上皆是。"] },
  { id: 46, answer: "B", question: "下列何者非屬可保危險在技術上應具備之條件", options: ["危險單位數量眾多且性質相似", "損失非出於偶然", "危險事故所致損失須能界定", "保險費成本必須經濟合理。"] },
  { id: 47, answer: "C", question: "受市場因素或經濟情況波動所致之損失不可保，係因", options: ["凡過去損失經驗不佳，保險人不願承保", "有道德性危險", "損失程度無法明確界定，損失無法公平合理分攤", "損失可以預期，不合保險原則。"] },
  { id: 48, answer: "D", question: "下列何種保險非屬財產保險業所得經營", options: ["傷害保險", "責任保險", "保証保險", "年金保險。"] },
  { id: 49, answer: "C", question: "政策保險係以實施特定之國家政策為目的之保險，下列何者屬非政策性保險", options: ["社會保險", "輸出保險", "商業火險", "農業保險。"] },
  { id: 50, answer: "C", question: "要保人投保時，基於", options: ["損害補償原則", "主力近因原則", "最大誠信原則", "保險利益原則"] },
  { id: 51, answer: "C", question: "當事人於締結保險契約之時，要保人應將有關保險標的之重要事實告知保險人，且需遠超一般契約之誠意，所以學者稱保險契約為", options: ["對價契約", "要物契約", "最大誠信契約", "非要式契約。"] },
  { id: 52, answer: "C", question: "下列何者屬表達最大誠信原則之方式", options: ["通知義務", "施救義務", "告知義務", "設立猶豫期間。"] },
  { id: 53, answer: "B", question: "要保人故意不為真實之告知，致保險契約被解除時，其保險費應如何處理：", options: ["必須返還", "無須返還", "可返還一半", "視個案而定。"] },
  { id: 54, answer: "B", question: "訂立保險契約時，要保人應據實說明範圍以何為限：", options: ["保險人的口頭詢問", "保險人的書面詢問", "以上皆是", "以上皆非。"] },
  { id: 55, answer: "A", question: "要保人違反據實說明之義務，保險人知有解除之原因後，得行使解除權之期限為何：", options: ["一個月", "二個月", "三個月", "四個月。"] },
  { id: 56, answer: "B", question: "要保人違反據實說明之義務，保險人在訂立契約後多久期限內可以行使解除權：", options: ["一年", "二年", "三年", "半年。"] },
  { id: 57, answer: "A", question: "保險契約訂立時，保險標的之危險已發生或已消滅，原則上其契約效力為何：", options: ["無效", "得終止", "得解除", "維持原狀。"] },
  { id: 58, answer: "C", question: "被保險人在保險契約所約定之保險事故發生後，就其遭受的損害能獲得充分補償原則為", options: ["最大誠信原則", "保險利益原則", "損害補償原則", "近因原則。"] },
  { id: 59, answer: "D", question: "下列何種保險符合損害補償原則", options: ["人壽保險", "定值保險", "重置成本財產保險", "實際現金價值財產保險。"] },
  { id: 60, answer: "A", question: "財產保險契約雙方當事人於訂立契約時，事先約定保險價額而載明於契約稱為", options: ["定值保險契約", "超額保險契約", "不定值保險契約", "原保險契約。"] },
  { id: 61, answer: "D", question: "下列何者係指損失發生時，保險人支付於被保險人之補償金額", options: ["保險金額", "保險價額", "保險利益", "保險賠款。"] },
  { id: 62, answer: "A", question: "要保人如違反誠信，致保險人無法對危險做正確之估計，保險人有何權利", options: ["解除保險契約", "免除賠償責任", "與被保險人比例分攤損失", "增加保險費。"] },
  { id: 63, answer: "C", question: "對他人遭受的財產損失或身體傷害，依法應負賠償責任之危險為", options: ["財產危險", "人身危險", "責任危險", "動態危險。"] },
  { id: 64, answer: "A", question: "下列何者屬足額保險", options: ["保險金額等於保險價額", "保險金額小於保險價額", "保險金額大於保險價額", "以上皆非。"] },
  { id: 65, answer: "C", question: "下列何種保險屬保險金額等於保險價額", options: ["定值保險", "超額保險", "足額保險", "以上皆非。"] },
  { id: 66, answer: "A", question: "要保人或被保險人對於保險標的無保險利益者，其保險契約效力為何？", options: ["契約失效", "保險人得解除契約", "保險人得撤銷契約", "保險人得終止契約。"] },
  { id: 67, answer: "D", question: "要保人意圖不當得利而複保險者，保險契約效力為何？", options: ["失效", "解除", "終止", "無效。"] },
  { id: 68, answer: "C", question: "財產保險之要保人或被保險人於何時必須具有保險利益", options: ["要保時", "保險契約成立時", "損失發生時", "請求賠償時。"] },
  { id: 69, answer: "A", question: "惡意複保險契約法律效力為何", options: ["無效", "解除", "終止", "以上皆非。"] },
  { id: 70, answer: "D", question: "善意的超額保險，其契約效力為何？", options: ["保險金額全部有效", "保險價額超過保險金額部份有效", "保險契約全部無效", "保險價額以內有效。"] },
  { id: 71, answer: "A", question: "下列何者屬保險金額", options: ["保險人在保險期間內所負之最高賠償責任", "保險標的之實際現金價值", "保險標的之可保價值", "以上皆是。"] },
  { id: 72, answer: "A", question: "保險單中，保險人之最大賠償責任限額係指下列何者", options: ["保險金額", "補償損失", "發票金額", "保險價額。"] },
  { id: 73, answer: "C", question: "訂約時保險標的之價值未事先約定，而於契約中載明須至損失發生時，按保險事故發生時之實際價值計算賠償金額之契約稱為：", options: ["定值保險契約", "變額保險契約", "不定值保險契約", "定額保險契約。"] },
  { id: 74, answer: "B", question: "在不定值保險契約中，被保險人遇有不足額保險時，須按不足額之比例分攤損失，主要係因", options: ["被保險人無等額之保險利益", "被保險人未以足額之保險金額為基礎，繳交應繳之保險費", "保險人須懲罰被保險人惡意為不足額之保險", "以上皆非。"] },
  { id: 75, answer: "B", question: "下列何者屬保險標的之重置成本", options: ["原始取得成本", "在估計價值之當時的重新購置成本", "零售價格", "以上皆是。"] },
  { id: 76, answer: "B", question: "善意之超額保險，其保險金額超過可保價值部份屬於無效，故如有損失，應比照下列何種方式為理賠", options: ["不足額保險", "足額保險", "解除保險契約", "以上皆非。"] },
  { id: 77, answer: "C", question: "保險人行使代位求償權之金額，以下列何者為限", options: ["侵權行為人法定賠償金額", "保險契約之保險金額", "保險人賠償金額", "以上皆非。"] },
  { id: 78, answer: "C", question: "保險人於何時可行使代位求償權", options: ["被保險人索賠時", "知悉肇事第三人對保險事故負有法律賠償責任時", "對被保險人給付賠償金額後", "以上皆非。"] },
  { id: 79, answer: "D", question: "保險契約設定自負額，使得保險費率下降，原因為何？", options: ["小額賠案之理賠費用減少", "小額之賠款支出減少", "被保險人之損失頻率與損失幅度降低", "以上皆是。"] },
  { id: 80, answer: "A", question: "定值保險契約保險標的物之價值係於下列何種情形下訂定完成", options: ["當事人雙方事先約定", "損失發生時再予估計", "依據市價核算", "以上皆非。"] },
  { id: 81, answer: "D", question: "下列何者係屬保險契約中設定自負額之目的", options: ["減少小額賠款及其理賠手續", "促使被保險人加強損失預防與控制", "促使危險性質改善，減少被保險人保險費負擔", "以上皆是。"] },
  { id: 82, answer: "A", question: "對以重置成本為基礎之保險契約而言，下列敘述何者為不正確", options: ["不會構成不足額保險", "可保價值係以重置成本計算", "計算可保價值，不須扣除折舊", "以上皆是。"] },
  { id: 83, answer: "B", question: "下列何種保險契約最符合補償契約之精神", options: ["定值保險契約", "不定值保險契約", "重置成本保險契約", "以上皆非。"] },
  { id: 84, answer: "C", question: "保險人於決定損失是否為保險事故所致時，須確認導致損失之事故為", options: ["因果關係上之直接原因", "時間上最接近之原因", "主力近因", "以上皆是。"] },
  { id: 85, answer: "C", question: "某保單訂有扣減式自負額 2,000 元，當損失為 4,500 元時，保險人應負責賠償", options: ["6,500 元", "4,500 元", "2,500 元", "2,000 元。"] },
  { id: 86, answer: "C", question: "代位求償是下列何項保險原則延伸出來之子原則", options: ["最大誠信原則", "保險利益原則", "損害補償原則", "主力近因原則。"] },
  { id: 87, answer: "D", question: "某甲以同一汽車向乙保險公司投保車體損失險，又向丙公司投保汽車第三人責任險，此情形為", options: ["複保險", "超額保險", "再保險", "以上皆非。"] },
  { id: 88, answer: "A", question: "下列何者屬實際現金價值", options: ["重置成本減折舊", "重置成本減費用", "重置成本減合理利潤", "重置成本減銷貨成本。"] },
  { id: 89, answer: "B", question: "下列何者為保險人作成後交要保人收執且為保險契約成立之證明書據", options: ["要保書", "保險單", "提單", "待通知保單（T.B.D）。"] },
  { id: 90, answer: "D", question: "某甲房屋價值 400 萬元，向 A 保險公司投保火險 200 萬元，某日甲房屋遭鄰屋乙起火波及，損失 300 萬元，A 保險公司於賠償甲房屋後，可向鄰屋乙求償", options: ["400 萬元", "300 萬元", "200 萬元", "150 萬元。"] },
  { id: 91, answer: "C", question: "下列何者屬保險契約中規範當事人雙方權利義務，且為普遍適用的條款", options: ["特約條款", "不喪失價值條款", "基本條款", "防止損害擴大條款。"] },
  { id: 92, answer: "C", question: "下列何者屬法律規定請求權存在之期限，逾此期限則請求權罹於時效而消滅", options: ["除斥期間", "不爭條款", "消滅時效", "特約條款。"] },
  { id: 93, answer: "C", question: "要保人只能依保險公司所定之條款同意訂立與否，並無討價還價空間之契約稱為", options: ["單務契約", "有償契約", "附合契約", "射倖契約。"] },
  { id: 94, answer: "A", question: "下列何者屬當事人於保險契約基本條款外，承諾履行特種義務之條款", options: ["特約條款", "基本條款", "法定條款", "不爭條款。"] },
  { id: 95, answer: "C", question: "要保人雖交付保費，但保險人是否給付保險金則繫於事故發生與否者之契約為何？", options: ["單務契約", "有償契約", "射倖契約", "附合契約。"] },
  { id: 96, answer: "D", question: "下列何者屬要保書的作用", options: ["要保人的意思表示", "重要事項的告知", "保險人核保的依據", "以上皆是。"] },
  { id: 97, answer: "D", question: "下列何者為保險契約成立之要件", options: ["要約／承諾", "契約當事人具有行為能力", "契約當事人雙方之對價", "以上皆是。"] },
  { id: 98, answer: "D", question: "下列何者非為保險契約生效之要件", options: ["對價", "契約之目的須為合法", "契約當事人具有行為能力", "被保險人遵守最大誠信原則。"] },
  { id: 99, answer: "D", question: "保險契約除外不保事項一般列示不承保之內容為何？", options: ["標的", "危險事故", "損失", "以上皆是。"] },
  { id: 100, answer: "B", question: "海上貨物保險契約將包裝不良所致之損失予以除外不保，其目的係為排除下列何種危險", options: ["道德性危險", "怠忽性危險", "故意行為危險", "其他保險所承保之危險。"] },
  { id: 101, answer: "D", question: "保險契約之明細表通常不列示", options: ["被保險人名稱", "保險金額", "保險費", "除外不保事項。"] },
  { id: 102, answer: "B", question: "下列何者非屬有關保險單載明不保事項的目的", options: ["排除不可保危險", "減輕保險人的賠償責任", "便於保險公司控制危險", "避免兩種保險單保障的重複。"] },
  { id: 103, answer: "A", question: "為避免同一類危險在兩種保險項下重複承保，一般以何種方式處理", options: ["依其性質選擇由一種保險承保，而另一保險則予以除外不保", "降低保險費率以示公平", "損失發生時，由兩種保險平均分攤損失", "以上皆非。"] },
  { id: 104, answer: "B", question: "保險契約一般將經常性或可以預期之損失予以除外不保，其目的為何？", options: ["防止道德性危險", "排除一般性或非意外事故所致之損失，使保險費率合理化", "篩選品質優良之業務", "避免承保範圍重複。"] },
  { id: 105, answer: "B", question: "保險契約中，要保人之對價為何？", options: ["遵守誠信，據實告知", "繳付保險費", "善盡損失發生後與索賠時之各項義務", "以上皆是。"] },
  { id: 106, answer: "B", question: "被保險人違反特約條款之法律效力為何？", options: ["如損失之發生與特約條款之違反有因果關係，保險人才得據以解除保險契約", "無論損失之發生與特約條款之違反，有無因果關系，保險人皆得據以解除保險契約", "保險人得終止保險契約", "被保險人須補繳因而增加之保險費。"] },
  { id: 107, answer: "C", question: "下列何種法律行為得使契約效力自始消滅？", options: ["失效", "終止", "解除", "停效。"] },
  { id: 108, answer: "C", question: "要保人依據保險契約有據實告知之義務，而該項義務應於何時履行", options: ["保險契約存續期間", "損失發生時", "訂立保險契約時", "申請理賠時。"] },
  { id: 109, answer: "C", question: "於基本條款外，何者屬保險公司與被保險人個別約定的條款", options: ["明示條款", "默示條款", "特約條款", "航程變更條款。"] },
  { id: 110, answer: "D", question: "下列有關特約條款的敘述何者為正確", options: ["為當事人於保險契約的基本條款外，承認履行特種義務的條款", "與保險契約有關的一切事項，不問過去現在或將來，均得以特約條款定之", "保險契約當事人一方違反時，他方得解除契約", "以上皆是。"] },
  { id: 111, answer: "B", question: "下列何者屬暫保單的功能", options: ["減少簽發正式保單的繁瑣", "正式保單簽發前證明保險人的責任", "簡化被保險人投保的手續", "以上皆非。"] },
  { id: 112, answer: "D", question: "下列何者為出具暫保單時機及目的", options: ["保險契約部份條件尚未確定", "續保時，部份保險條件尚未重新洽妥時", "正式保單仍在繕製，而被保險人急需保險證明文件時", "以上皆是。"] },
  { id: 113, answer: "B", question: "保險契約之批單構成契約之一部份，通常其效力", options: ["等於原訂契約之規定", "優於原訂契約之規定", "次於原訂契約之規定", "以上皆非。"] },
  { id: 114, answer: "A", question: "下列何者非屬批單的用途？", options: ["證明保險的存在", "變更保險單的內容", "擴大承保範圍", "加保附加險。"] },
  { id: 115, answer: "C", question: "為適應實際需要，保險契約訂立時或訂立後，經當事人雙方同意，用以補充或變更原保險契約內容之條款稱為", options: ["保險單", "要保書", "批單", "暫保單。"] },
  { id: 116, answer: "C", question: "下列何者於保險事故發生時有賠償損失之義務者為", options: ["保險代理人", "保險經紀人", "保險人", "保險公證人。"] },
  { id: 117, answer: "D", question: "下列何者屬保險契約中保險人之權利", options: ["交付保險費", "請求賠償", "負擔賠償", "請求交付保險費。"] },
  { id: 118, answer: "B", question: "下列何者於保險事故發生時，遭受損害，享有賠償請求權之人", options: ["要保人", "被保險人", "保險人", "受益人。"] },
  { id: 119, answer: "A", question: "下列何者屬保險契約中負有交付保險費義務之人", options: ["要保人", "被保險人", "保險人", "受益人。"] },
  { id: 120, answer: "C", question: "下列何者為財產保險契約中所指被保險人", options: ["保險公證人", "受益人", "被保險財產之所有人", "保險人。"] },
  { id: 121, answer: "B", question: "下列何者為要保人對保險人負擔保險責任所給付之對價", options: ["保險金額", "保險費", "保險價額", "保險賠款。"] },
  { id: 122, answer: "B", question: "下列何者於財產保險契約中，決定保險金額之根據為", options: ["保險費", "保險價額", "要保人", "被保險人。"] },
  { id: 123, answer: "B", question: "下列何者與保險契約發生直接關係，而為保險契約之當事人", options: ["要保人及被保險人", "要保人與保險人", "受益人及被保險人", "被保險人及保險代理人。"] },
  { id: 124, answer: "D", question: "下列何項為保險契約中不得以批單予以更改", options: ["保險標的物之增減", "保險事故之更改", "保險期間之變更", "承認惡意之複保險為有效。"] },
  { id: 125, answer: "A", question: "下列何者為保險契約之關係人", options: ["被保險人", "保險代理人", "要保人", "保險經紀人。"] },
  { id: 126, answer: "C", question: "以下所述何者為正確", options: ["保險人在承保之危險事故發生時依其承保之責任有請求權", "保險人有負擔保險費之責任", "保險人在保險契約成立時，有保險費之請求權", "保險人係保險契約之關係人。"] },
  { id: 127, answer: "C", question: "要求保險契約之當事人須具有行為能力，係因無行為能力之人具有下列何項瑕庛", options: ["無力支付保險費", "容易發生保險事故", "意思表示依法無效", "以上皆是。"] },
  { id: 128, answer: "B", question: "被保險人基於本身原因，提前終止保險契約，其保險費應如何處理", options: ["按日數比例返還被保險人", "按短期費率計收有效期間保險費，餘額返還被保險人", "已繳之保險費不予退還", "以上皆非。"] },
  { id: 129, answer: "A", question: "被保險人因故提前終止保險契約，其依短期保險費率計收之保險費較以日數比例計收之保險費為高，係因保險人須", options: ["加速攤銷各項承保費用", "懲罰被保險人提前解約", "支應增加之賠款成本", "以上皆非。"] },
  { id: 130, answer: "A", question: "以下何者為保險標的內容", options: ["保險利益所寄存之客體", "保險契約之當事人", "保險承保之處所", "以上皆是。"] },
  { id: 131, answer: "B", question: "下列何者為因財產之毀損而花費之修理復原費用", options: ["間接損失", "直接損失", "從屬損失", "以上皆非。"] },
  { id: 132, answer: "D", question: "下列何者屬保險標的之內容", options: ["財產", "依法賠償責任", "人之身體或生命", "以上皆是。"] },
  { id: 133, answer: "B", question: "凡列舉式保險契約，保險人對因列舉之危險事故所致之損失處理態度為何？", options: ["無條件負賠償責任", "在因果關係上，非由除外不保事故引起者，始須負賠償責任", "無論直接或間接原因，均須由列舉之危險事故引起者，始須負賠償責任", "以上皆非。"] },
  { id: 134, answer: "A", question: "下列何者屬俗稱之全險保險單", options: ["概括式保險契約", "總括保額式保險契約", "列舉式保險契約", "以上皆非。"] },
  { id: 135, answer: "D", question: "下列何種保險係採賠償責任限額方式承保", options: ["火災保險", "海上貨物保險", "汽車綜合損失保險", "責任保險。"] },
  { id: 136, answer: "D", question: "現金保險所承保事故不包括下列何者？", options: ["火災及爆炸", "強盜", "搶奪", "監守自盜。"] },
  { id: 137, answer: "B", question: "針對全險保險單，保險人處理態度為何？", options: ["一切事故所致之損失負賠償責任", "一切事故所致之損失負賠償責任，但經載明除外不保之事項所致者不在此限", "因疏忽或過失所致之損失負賠償責任", "以上皆非。"] },
  { id: 138, answer: "B", question: "於財產保險契約，以一個總保險金額，承保各處之貨物、財產，或承保同一地點之若干財產，此種保險稱為", options: ["不定值保單", "總括保險單", "定值保單", "個別保險單。"] },
  { id: 139, answer: "D", question: "下列何種保險之保險標的無可保價值", options: ["海上貨物保險", "火災保險", "工程保險", "責任保險。"] },
  { id: 140, answer: "A", question: "下列何者非為採定值保險的理由", options: ["投保時保險金額有爭議", "保險標的市價不能確定", "保險標的發生損失時，不易估計", "保險標的發生損失後，不易重置。"] },
  { id: 141, answer: "B", question: "我國產物保險商品採核准制者，主管機關應於收齊申請文件翌日起多久內核復", options: ["30 日", "40 日", "45 日", "90 日。"] },
  { id: 142, answer: "A", question: "責任保險中，不依責任性質分項訂定賠償限額，而以單一限額代替之承保方式為何", options: ["合併單一總限額", "總括保額式", "概括式", "以上皆非。"] },
  { id: 143, answer: "C", question: "下列何者為採定值保險方式承保之財產保險", options: ["火災保險", "汽車保險", "海上貨物保險", "責任保險。"] },
  { id: 144, answer: "C", question: "保險商品於保險業逕行銷售後十五個工作日內檢附資料送交主管機關備查。此一制度為", options: ["核准制", "核備制", "備查制", "以上皆非。"] },
  { id: 145, answer: "B", question: "下列何者屬保費中用以支付損失的部份", options: ["附加保費", "純保費", "簽單保費", "滿期保費。"] },
  { id: 146, answer: "D", question: "下列何項並非實施產險費率自由化之先決條件", options: ["健全的保險市場", "完備的監理制度", "正確的統計資料", "足夠的行銷人員。"] },
  { id: 147, answer: "B", question: "我國產險市場費率自由化採循序漸進方式實施，共分為幾個階段", options: ["四個階段", "三個階段", "兩個階段", "未予明定。"] },
  { id: 148, answer: "B", question: "下列何者為簽單保費中實際已兌現部份", options: ["未滿期保費", "滿滿期保費", "附加保費", "純保費。"] },
  { id: 149, answer: "C", question: "就監理實務而言，我國任意汽車保險之費率目前已採取下列何種費率制度", options: ["強制費率", "規章費率", "自由費率", "以上皆非。"] },
  { id: 150, answer: "A", question: "危險經過分類以後按照類別適用之費率計算保費之方法稱", options: ["分類法", "個別法", "增減法", "追溯法。"] },
  { id: 151, answer: "B", question: "下列何者係為符合公平原則，且有預防損失鼓勵作用之費率方法？", options: ["分類法", "增減法", "個別法", "追溯法。"] },
  { id: 152, answer: "D", question: "下列何者為財產保險商品審查應注意事項編撰內容", options: ["審查會備忘錄", "審査委員審理意見", "相關審査原則", "以上皆是。"] },
  { id: 153, answer: "C", question: "下列何者為我國未來將採取財產保險商品審查制", options: ["核准制", "核備制", "準則制", "備查制方向邁進。"] },
  { id: 154, answer: "B", question: "保險費率決定，按被保險危險之個別情況單獨計算之方法稱", options: ["分類法", "個別法", "增減法", "追溯法。"] },
  { id: 155, answer: "C", question: "費率之決定係依個別業務之情況單獨計算，亦即每筆業務由核保人員根據過去之費率及經驗向被保險人提出費率，由雙方決定費率，此種費率計算方法為", options: ["分類法", "增減法", "個別法", "追溯法。"] },
  { id: 156, answer: "C", question: "保險業務員有重大喪失債信情事尚未了結或了結後尚未逾", options: ["一年", "二年", "三年", "四年"] },
  { id: 157, answer: "A", question: "業務員同時登錄為財產保險及人身保險業務員者", options: ["其分別登錄之所屬公司", "其登錄之財產保險公司", "其登錄之人身保險公司", "其先登錄之保險公司"] },
  { id: 158, answer: "D", question: "下列敘述何者正確", options: ["專屬代理人意指僅代理一家保險公司招攬業務", "普通代理人可同時接受數家保險公司委任代理", "保險代理人分為財產保險代理人及人身保險代理人", "以上皆是。"] },
  { id: 159, answer: "D", question: "業務員違反下列何項情事者，所屬公司應按其情節輕重，予以處分", options: ["妨害要保人或被保險人為告知者", "以登錄證供他人使用者", "未經所屬公司同意而招聘人員者", "以上皆是。"] },

        // ⚙️ 核心系統控制器 (已精簡、除錯，對接變數架構)
        // ==================================================================
        let currentActiveBank = []; 
        let currentModeName = "";
        let currentModeThemeColor = "";
        let currentIdx = 0;
        let score = 0;

        function goHome() { 
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('home-screen').style.display = 'flex';
        }

        function shuffle(array) { return [...array].sort(() => Math.random() - 0.5); }

        // 隨機抽題工具
        function getRandom(arr, num) {
            if (!arr || arr.length === 0) return [];
            const maxNum = Math.min(num, arr.length);
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, maxNum);
        }

        // 開始測驗控制器 (完美處理 75題 / 50題 抽題設定)
        function startTest(mode) {
            currentActiveBank = []; 
            
            if (mode === 'mixed') {
                // 各科精確随機抽出 15 題
                let q1 = getRandom(insurancePracticeBank, 15);
                let q2 = getRandom(insuranceLawBank, 15);
                let q3 = getRandom(ethicsBank, 15);
                let q4 = getRandom(theoryBank, 15);
                let q5 = getRandom(financeBank, 15);
                
                // 合併大打亂，共 75 題
                let combined = [...q1, ...q2, ...q3, ...q4, ...q5];
                currentActiveBank = getRandom(combined, combined.length);
                
                document.getElementById('quiz-mode-title').innerText = "🎲 隨機測驗 (共 75 題)";
                document.getElementById('quiz-mode-title').style.color = "#38bdf8";

            } else {
                // 獨立科目測驗：每次隨機抽 50 題
                let selectedBank = [];
                let titleText = "";
                let titleColor = "";
                
                if (mode === 'practice') { selectedBank = insurancePracticeBank; titleText = "📄 保險實務"; titleColor = "#818cf8"; }
                else if (mode === 'law') { selectedBank = insuranceLawBank; titleText = "⚖️ 保險法規"; titleColor = "#f472b6"; }
                else if (mode === 'ethics') { selectedBank = ethicsBank; titleText = "🛡️ 職業道德"; titleColor = "#fbbf24"; }
                else if (mode === 'theory') { selectedBank = theoryBank; titleText = "💡 保險理論"; titleColor = "#34d399"; }
                else if (mode === 'finance') { selectedBank = financeBank; titleText = "📈 金融市場常識"; titleColor = "#22d3ee"; }
                
                currentActiveBank = getRandom(selectedBank, 50);
                document.getElementById('quiz-mode-title').innerText = titleText + " (共 " + currentActiveBank.length + " 題)";
                document.getElementById('quiz-mode-title').style.color = titleColor;
            }

            if (currentActiveBank.length === 0) {
                alert("錯誤：無法載入題目，請確認題庫資料是否貼上！");
                return;
            }

            currentIdx = 0;
            score = 0;

            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('quiz-screen').style.display = 'flex';

            renderQuiz(); 
        }

        function renderQuiz() {
            if (currentIdx >= currentActiveBank.length) {
                document.getElementById('final-score').innerText = `最終得分：${score} / ${currentActiveBank.length}`;
                document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
                document.getElementById('result-screen').style.display = 'flex';
                return;
            }

            const qData = currentActiveBank[currentIdx];
            document.getElementById('q-progress').innerText = `${currentIdx + 1} / ${currentActiveBank.length}`;
            document.getElementById('q-score').innerText = score;
            document.getElementById('question').innerText = `${currentIdx + 1}. ${qData.question}`;
            
            const optArea = document.getElementById('options');
            optArea.innerHTML = '';
            
            // --- 自動適應並重組選項資料 ---
            let processedOptions = [];

            if (Array.isArray(qData.options)) {
                // 處理陣列格式 (保險實務等)
                qData.options.forEach((optText, index) => {
                    processedOptions.push({
                        label: "", // 陣列無特定 ABC 標籤
                        text: optText,
                        isCorrect: (index === qData.answer || optText === qData.answer)
                    });
                });
            } else {
                // 處理物件格式 (職業道德的 A, B, C, D)
                for (const [key, value] of Object.entries(qData.options)) {
                    processedOptions.push({
                        label: key, // 取得 "A", "B", "C", "D"
                        text: value,
                        // 使用 trim() 防止題庫答案裡不小心多了空白鍵 (如 "D ") 導致判定錯誤
                        isCorrect: (key.trim() === String(qData.answer).trim() || value === qData.answer)
                    });
                }
            }
            
            // ❌ 取消了 shuffle 打亂機制，讓選項永遠照原順序排列
            processedOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                
                // 如果有 A,B,C,D 標籤就顯示出來，如：「D. 可以向未經授權...」
                btn.innerText = opt.label ? `${opt.label}. ${opt.text}` : opt.text;
                
                btn.onclick = () => {
                    const btns = document.querySelectorAll('.opt-btn');
                    btns.forEach(b => b.disabled = true);
                    
                    if (opt.isCorrect) {
                        btn.classList.add('correct');
                        document.getElementById('feedback').innerHTML = "<span style='color:#4ade80'>✔ 判斷正確！</span>";
                        score++;
                    } else {
                        btn.classList.add('wrong');
                        // 找出正確的選項文字並顯示
                        const correctOpt = processedOptions.find(o => o.isCorrect);
                        const correctBtnText = correctOpt ? (correctOpt.label ? `${correctOpt.label}. ${correctOpt.text}` : correctOpt.text) : "未知錯誤";
                        
                        document.getElementById('feedback').innerHTML = `<span style='color:#f87171'>✘ 答錯了！正確答案應為：${correctBtnText}</span>`;
                        // 將正確答案用綠色標示出來
                        btns.forEach(b => { if(b.innerText === correctBtnText) b.classList.add('correct'); });
                    }
                    document.getElementById('next-btn').style.display = 'block';
                };
                optArea.appendChild(btn);
            });
            
            document.getElementById('feedback').innerText = '';
            document.getElementById('next-btn').style.display = 'none';
        }

        // ==========================================
        // ➡️ 下一題控制器
        // ==========================================
        function nextQuestion() {
            currentIdx++; 
            renderQuiz(); 
        }

        // ==========================================
        // 📖 複習區展示控制器 (同步支援顯示 ABCD)
        // ==========================================
        function showReview(mode) {
            let bank, title, titleColor;
            if (mode === 'practice') { bank = insurancePracticeBank; title = "📖 保險實務 - 完整題庫清單"; titleColor = "#818cf8"; }
            else if (mode === 'law') { bank = insuranceLawBank; title = "📖 保險法規 - 完整題庫清單"; titleColor = "#f472b6"; }
            else if (mode === 'ethics') { bank = ethicsBank; title = "📖 職業道德 - 完整題庫清單"; titleColor = "#fbbf24"; }
            else if (mode === 'theory') { bank = theoryBank; title = "📖 保險理論 - 完整題庫清單"; titleColor = "#34d399"; }
            else if (mode === 'finance') { bank = financeBank; title = "📖 金融市場常識 - 完整題庫清單"; titleColor = "#22d3ee"; }
            
            const titleEl = document.getElementById('review-title');
            titleEl.innerText = title;
            titleEl.style.color = titleColor;

            const container = document.getElementById('review-container');
            container.innerHTML = '';

            bank.forEach((item, i) => {
                let ansText = "";
                if (Array.isArray(item.options)) {
                    ansText = typeof item.answer === 'number' ? item.options[item.answer] : item.answer;
                } else {
                    // 自動抓取正確的 A,B,C,D 與文字
                    let ansKey = String(item.answer).trim();
                    ansText = `${ansKey}. ${item.options[ansKey]}`;
                }

                const card = document.createElement('div');
                card.className = "review-card";
                card.style.borderLeftColor = titleColor;
                card.innerHTML = `<div class="review-q">${i+1}. ${item.question}</div><div class="review-a">正確解答：${ansText}</div>`;
                container.appendChild(card);
            });

            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('review-screen').style.display = 'flex';
        }
        // 支援 Enter 快捷鍵自動跳轉下一題
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('next-btn').style.display === 'block') {
                nextQuestion();
            }
        });
    </script>
</body>
</html>
