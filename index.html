<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小寶貝專屬題庫練習系統</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .screen {
            width: 100%;
            max-width: 750px;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            align-items: center;
            max-height: 95vh;
            overflow-y: auto;
        }
        .active-screen { display: flex; }

        h1 { font-size: 26px; color: #38bdf8; margin-top: 0; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #94a3b8; margin-bottom: 20px; font-size: 14px; text-align: center; }

        /* ---------------- 首頁專區排版設計 ---------------- */
        .section-header {
            width: 100%;
            color: #fbbf24;
            font-size: 14px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
            border-bottom: 2px solid #334155;
            padding-bottom: 5px;
            letter-spacing: 1px;
        }

        .subject-card {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .subject-title {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .start-action { color: #ffffff; }
        .start-action:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        .review-action { background: #334155; color: #cbd5e1; border: 1px solid #475569; }
        .review-action:hover { background: #475569; color: #fff; transform: translateY(-2px); }

        /* 各科專屬主題色 */
        .theme-mixed { background: #38bdf8; color: #0f172a; font-size: 16px; padding: 14px; }
        .theme-practice { background: #6366f1; }
        .theme-law { background: #ec4899; }
        .theme-ethics { background: #f59e0b; }
        .theme-theory { background: #10b981; }
        .theme-finance { background: #06b6d4; }

        .nav-btn {
            background: #334155;
            color: #cbd5e1;
            border: 1px solid #475569;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            align-self: flex-start;
            margin-bottom: 15px;
        }

        /* ---------------- 測驗區樣式 ---------------- */
        .quiz-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 15px;
        }
        .question-text { font-size: 18px; font-weight: bold; margin-bottom: 20px; width: 100%; line-height: 1.5; }
        
        .options-grid { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            padding: 12px 15px;
            background: #0f172a;
            border: 2px solid #334155;
            color: #f8fafc;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1.4;
        }
        .opt-btn:hover:not(:disabled) { border-color: #38bdf8; background: #1e293b; }
        .correct { background: #22c55e !important; border-color: #22c55e !important; color: white !important; }
        .wrong { background: #ef4444 !important; border-color: #ef4444 !important; color: white !important; }

        .feedback-area { height: 50px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; margin-top: 10px; text-align: center; }
        .next-btn { background: #fbbf24; color: #0f172a; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; display: none; margin-top: 5px; }

        /* ---------------- 複習清單樣式 ---------------- */
        .review-list { width: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .review-card { background: #0f172a; border-left: 4px solid #334155; padding: 12px; border-radius: 8px; line-height: 1.5; }
        .review-q { font-size: 15px; font-weight: bold; margin-bottom: 6px; color: #f8fafc; }
        .review-a { color: #4ade80; font-weight: bold; font-size: 14px; }

        @media(max-width: 600px) {
            .btn-row { grid-template-columns: 1fr; gap: 8px; }
        }
    </style>
</head>
<body>

    <div id="home-screen" class="screen active-screen">
        <h1>❤️小寶專用系統❤️</h1>
        <div class="subtitle">讓小寶隨便就考到</div>
        
        <div class="section-header" style="margin-top: 0;">🚀 全方位綜合訓練</div>
        <button class="action-btn theme-mixed" style="width: 100%; font-weight: 900;" onclick="startTest('mixed')"> 🎲 隨機測驗 (各科抽 15 題，共 75 題)</button>

        <div class="section-header">📂 獨立科目測驗與複習 (每次隨機抽測 50 題)</div>

        <div class="subject-card">
            <div class="subject-title" style="color: #818cf8;">📄 專業科目：保險實務</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-practice" onclick="startTest('practice')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('practice')">📖 完整題庫</button>
            </div>
        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #f472b6;">⚖️ 專業科目：保險法規</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-law" onclick="startTest('law')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('law')">📖 完整題庫</button>
            </div>
        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #fbbf24;">🛡️ 專業科目：職業道德</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-ethics" onclick="startTest('ethics')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('ethics')">📖 完整題庫</button>
            </div>
        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #34d399;">💡 專業科目：保險理論</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-theory" onclick="startTest('theory')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('theory')">📖 完整題庫</button>
            </div>
        </div>

        <div class="subject-card">
            <div class="subject-title" style="color: #22d3ee;">📈 專業科目：金融市場常識</div>
            <div class="btn-row">
                <button class="action-btn start-action theme-finance" onclick="startTest('finance')">✏️ 開始測驗</button>
                <button class="action-btn review-action" onclick="showReview('finance')">📖 完整題庫</button>
            </div>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <button class="nav-btn" onclick="goHome()">🏠 返回首頁</button>
        <div id="quiz-mode-title" style="font-weight: bold; margin-bottom: 10px; font-size: 16px;"></div>
        <div class="quiz-header">
            <div>進度：<span id="q-progress">0/0</span></div>
            <div>得分：<span id="q-score">0</span></div>
        </div>
        <div id="question" class="question-text">載入中...</div>
        <div id="options" class="options-grid"></div>
        <div id="feedback" class="feedback-area"></div>
        <button id="next-btn" class="next-btn" onclick="nextQuestion()">下一題 ➡️</button>
    </div>

    <div id="result-screen" class="screen">
        <h1>🎉 測驗結束</h1>
        <div id="final-score" style="font-size: 22px; color: #fbbf24; font-weight: bold; margin: 20px 0;"></div>
        <button class="action-btn theme-mixed" style="width: 100%; max-width: 300px; padding: 12px; border-radius: 8px;" onclick="goHome()">🏠 回到首頁</button>
    </div>

    <div id="review-screen" class="screen">
        <button class="nav-btn" onclick="goHome()">🏠 返回首頁</button>
        <h2 id="review-title" style="margin-top: 0; margin-bottom: 15px; font-size: 20px;">複習區</h2>
        <div id="review-container" class="review-list"></div>
    </div>

    <script>
        // ==========================================
        // 📌 題庫資料庫設定 (請將您的五個題庫陣列貼到此處)
        // ==========================================
        
        // 1. 保險實務題庫
        const insurancePracticeBank=[
{id:1,question:"行動裝置保險條款中明訂要保人／被保險人的資格。下列何者可以是行動裝置保險所規範的要保人／被保險人？1．一般自然人；2．一般法人；3．未成年人；受監護宣告成年人",options:{"A":"1、2","B":"2、3","C":"1、3","D":"1、2、3"},answer:"A"},
{id:2,question:"業務員在招攬行動裝置保險時需注意那些事項？1．被保險人是否已經完全瞭解商品所承保的範圍；2．保單條款相關的規定；3．簽名是否為被保險人本人親簽",options:{"A":"1、2","B":"1、3","C":"2、3","D":"1、2、3"},answer:"D"},
{id:3,question:"要保人投保行動裝置保險契約時，應記載於要保書上之事項為何？",options:{"A":"行動裝置商品名稱","B":"行動裝置空機建議售價","C":"要保人／被保險人資料","D":"以上皆是"},answer:"D"},
{id:4,question:"下列何者可作為行動裝置保險之保險標的？",options:{"A":"已購買三個月以上的行動裝置","B":"折價出清之福利品／良品","C":"全新行動裝置商品","D":"經原廠維修過後的行動裝置"},answer:"C"},
{id:5,question:"行動裝置保險的保險標的為下列何者？",options:{"A":"行動裝置本體","B":"另行購買之行動裝置配件","C":"行動裝置內所儲存之資料、照片等","D":"行動裝置內所安裝之APP軟體"},answer:"A"},
{id:6,question:"行動裝置保險之保險標的是以下列何者為識別依據？",options:{"A":"品牌","B":"型號","C":"IMEI碼或S／N序號","D":"投保日期"},answer:"C"},
{id:7,question:"行動裝置保險要保書上，下列何者屬於必須包含之内容？",options:{"A":"要／被保人之基本資料","B":"行動裝置識別碼","C":"以上皆是","D":"以上皆非"},answer:"C"},
{id:8,question:"行動裝置空機建議售價之高低，會影響行動裝置保險的何種內容？",options:{"A":"保險費","B":"承保範圍","C":"保險期間","D":"理賠次數上限"},answer:"A"},
{id:9,question:"行動裝置保險所承保的損失包含下列何者？1．意外摔落之損壞；2．無法正常使用之故障；3．不明原因之遺失",options:{"A":"1、2","B":"1、3","C":"2、3","D":"1、2、3"},answer:"A"},
{id:10,question:"下列何者屬於行動裝置保險條款所規範的不保事項？",options:{"A":"被保險人故意行為","B":"從事犯罪或教唆犯罪或逃避合法逮捕之行為","C":"屬於原廠保固範圍內之故障","D":"以上皆是"},answer:"D"},
{id:11,question:"下列何者與行動裝置保險之保費計算有關？",options:{"A":"被保險人年齡","B":"行動裝置空機建議售價","C":"行動裝置之生產地點","D":"電信資費金額"},answer:"B"},
{id:12,question:"下列何者為行動裝置保險契約適用之原則？",options:{"A":"最大誠信原則","B":"保險利益原則","C":"損害補償原則","D":"以上皆是"},answer:"D"},
{id:13,question:"下列何者不屬於行動裝置保險之承保範圍？",options:{"A":"行動裝置意外損壞","B":"屬原廠保固責任內之瑕疵故障","C":"行動裝置因意外摔落而螢幕破裂","D":"行動裝置因打翻飲料而受潮"},answer:"B"},
{id:14,question:"下列何者可做為行動裝置保險的保險標的？",options:{"A":"家用音響","B":"藝術品","C":"於指定通路購買之全新行動裝置","D":"以上皆非"},answer:"C"},
{id:15,question:"下列何者不屬於行動裝置保險之承保範圍？",options:{"A":"受潮","B":"機體斷裂","C":"軟體導致之當機","D":"螢幕摔破"},answer:"C"},
{id:16,question:"下列何者屬於行動裝置保險之承保範圍？",options:{"A":"泡水","B":"壓毀","C":"機體斷裂","D":"以上皆是"},answer:"D"},
{id:17,question:"下列何種移動式電子裝置屬於行動裝置保險之保險標的？",options:{"A":"手機","B":"平板","C":"筆電","D":"以上皆是"},answer:"D"},
{id:18,question:"行動裝置保險之保險標的是指？",options:{"A":"意外事故","B":"行動裝置","C":"保險費","D":"以上皆是"},answer:"B"},
{id:19,question:"下列何者屬於行動裝置保險之保險標的？",options:{"A":"保護殼","B":"行動裝置所下載之APP","C":"行動裝置之本體","D":"以上皆非"},answer:"C"},
{id:20,question:"行動裝置保險之保障範圍及條款是經過哪個單位審核後，才能在市場上銷售？",options:{"A":"國家通訊傳播委員會（NCC）","B":"金融監督管理委員會保險局","C":"行政院消費者保護處","D":"經濟部商業司"},answer:"B"},
{id:21,question:"下列何者為行動裝置保險之保險標的？",options:{"A":"冷氣機","B":"筆記型電腦","C":"微波爐","D":"電視"},answer:"B"},
{id:22,question:"下列何者為行動裝置保險的承保範圍？",options:{"A":"電腦病毒所導致之當機","B":"電池之單獨損毀","C":"行動裝置自然耗損","D":"行動裝置本體斷裂"},answer:"D"},
{id:23,question:"要保人若要投保行動裝置保險，請問投保的時間點為何？",options:{"A":"購買行動裝置後七天內","B":"購買行動裝置後十五天內","C":"購買行動裝置後三十天內","D":"購買行動裝置的當下"},answer:"D"},
{id:24,question:"下列何者為行動裝置保險的承保範圍？",options:{"A":"軟體問題所導致之當機","B":"配件單獨損毀","C":"行動裝置本體受潮","D":"外殼刮傷未影響功能"},answer:"C"},
{id:25,question:"欲加購行動裝置保險的用戶小陶，購買之行動裝置若無IMEI碼，可由下列何種資料作為產品識別碼？",options:{"A":"商品貨號","B":"S／N序號","C":"商品料號","D":"發票號碼"},answer:"B"},
{id:26,question:"行動裝置保險之保費高低是依據下列何項做變動？",options:{"A":"空機建議售價","B":"綁定資費後售價","C":"促銷特惠價","D":"以上皆非"},answer:"A"},
{id:27,question:"在相同保障範圍之行動裝置保險，若空機建議售價分別為三萬元與兩萬元的行動裝置，何者保費較高？",options:{"A":"兩萬元","B":"三萬元","C":"兩者相同","D":"無法比較"},answer:"B"},
{id:28,question:"行動裝置保險契約一般而言是以什麽為保險費計算的基礎？",options:{"A":"行動裝置空機建議售價","B":"被保險人年齡","C":"被保險人性別","D":"電信資費金額"},answer:"A"},
{id:29,question:"行動裝置保險之被保險人包含？",options:{"A":"經被保險人許可使用保險標的之人","B":"保險契約所載明之被保險人","C":"以上皆是","D":"以上皆非"},answer:"C"},
{id:30,question:"下列何種身分購買新手機，具有可購買行動裝置保險之資格？",options:{"A":"新申裝","B":"續約","C":"攜碼","D":"以上皆是"},answer:"D"},
{id:31,question:"被保險人於每次理賠所需自行負擔之金額，稱之為？",options:{"A":"自負額","B":"保險費","C":"電信資費","D":"加值服務費用"},answer:"A"},
{id:32,question:"下列何者非屬行動裝置保險標的物中所稱之「行動裝置」？",options:{"A":"手機","B":"平板","C":"筆電","D":"桌上型電腦"},answer:"D"},
{id:33,question:"於保險期間內之理賠次數達累計最高賠償次數時，保險契約效力將會？",options:{"A":"30天後終止","B":"立即終止","C":"自始無效，退還保費","D":"以上皆非"},answer:"B"},
{id:34,question:"行動裝置保險契約之內容若發生疑義時，應以有利於誰的解釋為原則？",options:{"A":"保險公司","B":"電信公司","C":"被保險人","D":"依法院判決而定"},answer:"C"},
{id:35,question:"採分期繳付保險費之行動裝置保險契約，其每期保險費是透過何種方式收取？",options:{"A":"專員到府收費","B":"經電信帳單代收","C":"信用卡扣款","D":"約定金融帳戶扣款"},answer:"B"},
{id:36,question:"下列何者可成為行動裝置保險之保險標的？",options:{"A":"合作廠商所銷售之全新行動裝置","B":"家用電視","C":"家用冰箱","D":"行動裝置之配件"},answer:"A"},
{id:37,question:"被保險人因下列何種情況發生時，應主動通知保險公司？",options:{"A":"綁約門號有過戶之情形","B":"連絡電話異動","C":"被保險人想終止保險契約","D":"以上皆是"},answer:"D"},
{id:38,question:"下列何者並非行動裝置保險之理賠方式？",options:{"A":"現金給付","B":"原機維修","C":"置換保險標的","D":"以上皆是"},answer:"A"},
{id:39,question:"下列何者為行動裝置保險的承保範圍？",options:{"A":"電腦病毒所導致之當機","B":"耳機孔、卡槽之單獨故障","C":"行動裝置本體斷裂","D":"外殼刮傷未影響功能"},answer:"C"},
{id:40,question:"下列何者不屬於行動裝置保險之保險標的？",options:{"A":"行動裝置之配件","B":"行動裝置之軟體","C":"行動裝置之外盒","D":"以上皆是"},answer:"D"},
{id:41,question:"下列何者為行動裝置保險所規範的承保範圍？",options:{"A":"保險標的之磨損、腐蝕、氧化、鏽垢、變質及自然耗損","B":"電池單獨損壞","C":"將受損之保險標的送至非指定維修中心修復","D":"以上皆非"},answer:"D"},
{id:42,question:"行動裝置保險對以下何種情況不予賠償？",options:{"A":"軟體中毒","B":"整批產品有瑕疵，全部自市場回收之費用","C":"被保險人故意行為導致","D":"以上皆是"},answer:"D"},
{id:43,question:"下列何者為行動裝置保險所規範的承保範圍？",options:{"A":"行動裝置之配件損毀","B":"因韌體未更新導致之當機","C":"不當改裝行動裝置而致之損壞","D":"以上皆非"},answer:"D"},

{id:40,question:"關於業務員從事保險招攬行為，下列敘述何者錯誤？",options:{"A":"所屬公司對其登錄之業務員應嚴加管理，並就其業務員招攬行為所生之損害依法應負連帶責任","B":"業務員轉送要保文件及保險單不屬於保險招攬行為","C":"業務員招攬涉及人身保險之商品者，應親晤要保人及被保險人","D":"業務員應於所招攬之要保書上親自簽名並記載其登錄字號"},answer:"B"},
{id:41,question:"保險業務員有下列何種情形，除有犯罪嫌疑，應依法偵辦外，其行為時之所屬公司，並應按其情節輕重，予以一年以下停止招攬行為或撤銷業務員之登錄處分？①唆使要保人或被保險人對保險人為不告知或不實之告知；或明知要保人或被保險人不告知或為不實之告知而故意隱匿②以錯價、放佣或其他不當折減保險費之方法招攬③未經授權代收保險費或經授權代收保險費而挪用、侵占所收保險費④經所屬公司同意而招聘人員",options:{"A":"①③④","B":"①②③④","C":"①②③","D":"①②④"},answer:"C"},
{id:42,question:"有關保險業務員從事保險招攬所用之文宣、廣告、簡介、商品說明書及建議書等文書，下列敘述何者屬錯誤？",options:{"A":"應標明所屬公司之名稱","B":"所屬公司為代理人、經紀人者並應標明往來保險業名稱","C":"保險代理人、經紀人公司所屬業務員所使用之文宣、廣告、簡介、商品說明書及建議書等文書，應經其往來保險業提供或同意方可使用","D":"廣告文宣之内容可與保險業報經主管機關審查通過之保單條款、費率及要保書文件不符。"},answer:"D"},
{id:43,question:"已領得保險代理人或經紀人執業證照之已登錄保險業務員，下列處理何者正確？",options:{"A":"註銷登錄","B":"維持登錄","C":"撤銷或維持登錄均可","D":"經允許可維持登錄"},answer:"A"},
{id:44,question:"保險業務員有下列何種情形，除有犯罪嫌疑，應依法移送偵辦外，其行為時之所屬公司，並應按其情節輕重，予以一年以下停止招攬行為或撤銷業務員之登錄處分？①影響要保人或被保險人權益之事項為不實之說明或不為說明②妨害要保人或被保險人為告知③對要保人、被保險人或第三人以誇大不實之宣傳、廣告或其他不當之方法為招攬④以威脅、利誘、隱匿、欺騙等不當之方法或不實之說明慫恿要保人終止有效契約而投保新契約致使要保人受損害",options:{"A":"①③④","B":"①②④","C":"①②③","D":"①②③④"},answer:"D"},
{id:45,question:"下列何者敘述是錯的？",options:{"A":"業務員從事產物保險招攬行為，必須得到所屬公司授權","B":"前項授權行為應以書面為之，並載明於其登錄證上","C":"同時登錄為財產保險及人身保險業務員者，其分別登錄之所屬公司不必依法負連帶責任","D":"業務員招攬行為，所生之損害，所屬公司就其授權範圍應負連帶責任"},answer:"C"},
{id:46,question:"保險業務員管理規則定義之經營同類保險業務所指為何？",options:{"A":"指所經營之業務同為經紀人業務或同為代理人業務","B":"指所經營之業務同為業務員通路或同為銀行保險通路","C":"指所經營之業務同為政策保險或同為社會保險","D":"指所經營之業務同為財產保險或同為人身保險"},answer:"D"},
{id:47,question:"保險業務員登錄後，應專為下列何者從事保險招攬",options:{"A":"自己","B":"他人","C":"所屬公司","D":"保險公會"},answer:"C"},
{id:48,question:"保險業務員招攬行為所生之損害，其所屬公司依法應負何責任？",options:{"A":"不負責任","B":"連帶責任","C":"抽象過失責任","D":"具體過失責任"},answer:"B"},
{id:49,question:"保險業務員經所屬公司授權從事保險招攬之行為，其授權方式，應如何行使",options:{"A":"口頭即可","B":"不拘形式","C":"書面為之即可","D":"書面為之，並載明於登錄證上"},answer:"D"},
{id:50,question:"下列何者屬於業務員招攬保險不實告知",options:{"A":"以誇大不實之方式就不同保險契約內容，或與銀行存款及其他金融商品作不當之比較","B":"未經保險契約當事人同意或授權而為填寫、簽章有關保險契約文件","C":"參加資格測驗，或參加特別測驗時，發生重大違規、舞弊","D":"以上皆非"},answer:"A"},
{id:51,question:"保險業在何種情形下，因遭受損失得請求安定基金予以低利貸款或墊支？",options:{"A":"承受經營不善同業之契約","B":"與經營不善同業進行合併","C":"以上皆是","D":"以上皆非"},answer:"C"},
{id:52,question:"財政主管機關視各種保險之發展狀況，依下列何種資料分別規定其銷售前應採行之程序、審核及內容有錯誤、不實或違反規定之處置等事項之準則",options:{"A":"各種保險單條款","B":"保險費","C":"保險單條款、保險費以外之其他相關資料","D":"以上皆是"},answer:"D"},
{id:53,question:"為健全保險業務之經營，保險業應聘用精算人員並指派其中一人擔任什麽角色，負責保險費率之釐訂，各種準備金之核算簽證及辦辦理其他經主管機關指定之事項",options:{"A":"簽證理算人員","B":"簽證會計人員","C":"簽證精算人員","D":"簽證綜理人員"},answer:"C"},
{id:54,question:"保險業因財務或業務狀況顯著惡化，不能支付其債務，或無法履行契約責任或有損及被保險人權益之虞時，主管機關最後得依情節之輕重，分別為那些處分？①監管②接管③勒令停業清理或命令解散④斷水斷電",options:{"A":"②③","B":"①②③④","C":"①②③","D":"①②"},answer:"C"},
{id:55,question:"保險業保險代理人公司保險經紀人公司辦理電話行銷業務應注意事項之訂定目的？①規範保險業、保險代理人公司及保險經紀人公司以電話行銷方式招攬保險之行為②保障消費大眾權益③維護保險業、保險代理人公司及保險經紀人公司之專業形象④協助保險業、保險代理人公司及保險經紀人公司招攬保險",options:{"A":"①③④","B":"①②④","C":"①②③","D":"①②③④"},answer:"C"},
{id:56,question:"依保險業保險代理人公司保險經紀人公司辦理電話行銷業務應注意事項之規定，於電話線上成立保險契約，財產保險業所銷售之商品組合每張保單年繳保費不得高於",options:{"A":"新臺幣三萬元","B":"新臺幣六萬元","C":"新臺幣十萬元","D":"新臺幣五萬元"},answer:"D"},
{id:57,question:"保險業保險代理人公司保險經紀人公司辦理電話行銷業務應注意事項規定以電話行銷時，傷害保險之保險金額，不得超過新臺幣多少",options:{"A":"300萬元","B":"400萬元","C":"500萬元","D":"600萬元"},answer:"D"},
{id:58,question:"保險業辦理電話行銷人員進行電話行銷過程應經要保人同意全程錄音並備份存檔，保存期限不得低於",options:{"A":"保險契約期滿或通知要保人不同意承保後五年","B":"保險契約成立後五年","C":"保險契約期滿後三年","D":"保險契約成立後三年"},answer:"A"},
{id:59,question:"保險業對於因電話行銷過程溝通不良所造成之爭議，應作有利於何者之解釋及處理",options:{"A":"保險公司","B":"要保人","C":"電話行銷人員","D":"以上皆非"},answer:"B"},
{id:60,question:"保險業之電話行銷人員進行電話行銷時，除應先確認要保人之身分外，並應完整告知要保人下列何種資料？①電話行銷人員自己之姓名②電話行銷人員所屬公司名稱、服務電話③電話行銷人員之登錄字號④保險契約重要內容",options:{"A":"①②③④","B":"①②④","C":"①②③","D":"①③④"},answer:"A"},
{id:61,question:"下列何者非屬保險業保險代理人公司保險經紀人公司辦理電話行銷所規範適用對象",options:{"A":"保險公證人公司","B":"保險公司","C":"保險代理人公司","D":"保險經紀人公司"},answer:"A"},
{id:62,question:"要保人與保險業、保險代理人公司或保險經紀人公司間因電話行銷爭議或涉訟時，下列何者不正確？",options:{"A":"要保人得要求提供錄音備份","B":"保險業不得拒絕提供錄音備份","C":"保險業得因提供錄音備份而酌收工本費","D":"保險業雖提供錄音備份，但不得收費"},answer:"D"},
{id:63,question:"要保人對下列何者無保險利益？",options:{"A":"財產上之現有利益","B":"單純期待","C":"因財產上之現有利益而生之期待利益","D":"以上皆非"},answer:"B"},
{id:64,question:"契約經撤銷後其法律效力為何",options:{"A":"溯及自訂立契約時不生效力","B":"自撤銷之後不生效力","C":"經公證人公證之後不生效力","D":"以上皆非"},answer:"A"},
{id:65,question:"契約經終止後其法律效力為何",options:{"A":"溯及自訂約時不生效力","B":"自終止以後不生效力","C":"經公證人公證之後不生效力","D":"以上皆非"},answer:"B"},
{id:66,question:"要保人或被保險人，對於保險標的物無保險利益者，保險契約效力為何",options:{"A":"失其效力","B":"得解除","C":"得撤銷","D":"得終止"},answer:"A"},
{id:67,question:"合夥人或共有人聯合為被保險人時，其中一人或數人讓與保險利益於他人者，保險契約效力為何",options:{"A":"不因之而失效","B":"得解除","C":"得終止","D":"無效"},answer:"A"},
{id:68,question:"保險業務員從事保險招攬所用之文宣、廣告、簡介、商品說明書及建議書等文書之內容，應經何種程序始可使用？",options:{"A":"經主管機關核准者即可使用","B":"經財政部核准者即可使用","C":"應經所屬公司核可同意後始可使用","D":"無需經所屬公司核可同意即可使用"},answer:"C"},
{id:69,question:"第三人利益契約，認定受益人有疑義時，依法推定為何",options:{"A":"要保人為自己之利益而訂立","B":"要保人為被保險人之利益而訂立","C":"要保人為其繼承人之利益而訂立","D":"以上皆是"},answer:"A"},
{id:70,question:"凡基於有效契約而生之利益下列何者敘述正確",options:{"A":"不得為保險利益","B":"亦得為保險利益","C":"與保險利益無關","D":"以上皆非"},answer:"B"},
{id:71,question:"要保人為他人之利益訂立保險契約是否有所限制？",options:{"A":"應經委任","B":"得不經委任","C":"應經公證","D":"以上皆非"},answer:"B"},
{id:72,question:"保險契約由代理人訂立者，有何限制？",options:{"A":"不須載明代訂之意旨","B":"應載明代訂之意旨","C":"沒有任何限制","D":"不可代為訂立"},answer:"B"},
{id:73,question:"保險契約由合夥人或共有人中之一人或數人訂立，而其利益及於全體合夥人或共有人，依法應如何行使始屬有效？",options:{"A":"自然及於全體合夥人或共有人","B":"如無相反意見，即視為及於全體合夥人或共有人","C":"應載明為全體合夥人或共有人訂立之意旨","D":"不需載明為全體合夥人或共有人訂立之意旨"},answer:"C"},
{id:74,question:"依保險法規定，自負額部份，要保人是否可另向他保險人訂立保險契約？",options:{"A":"可以","B":"不得","C":"保險法未規定","D":"依保險契約規定"},answer:"B"},
{id:75,question:"契約上載明保險標的一定價值之保險契約屬下列何種契約",options:{"A":"定值保險契約","B":"不定值保險契約","C":"任意性保險契約","D":"強制性保險契約"},answer:"A"},
{id:76,question:"下列何者屬於『依訂約時情形顯失公平致使該部份之約定無效』之情形？",options:{"A":"免除或減輕要保人依保險法應負之義務者","B":"免除或減輕被保險人依保險法應負之義務者","C":"免除或減輕受益人依保險法應負之義務者","D":"免除或減輕保險人依保險法應負之義務者"},answer:"D"},
{id:77,question:"下列那些人依保險法規定，於訂約時有重大不利益者，顯失公平致使該保險契約部分之約定無效？①要保人②受益人③被保險人④代理人",options:{"A":"①②③④","B":"①②④","C":"①②③","D":"①③④"},answer:"C"},
{id:78,question:"因惡意的複保險致保險契約無效時，保險人於不知情之時期內權利為何",options:{"A":"仍取得保險費","B":"仍不能取得保險費","C":"已收的保險費要返還","D":"視契約的規定而定"},answer:"A"},
{id:79,question:"下列何者屬複保險之要素",options:{"A":"同一保險利益","B":"同一保險事故","C":"數保險人","D":"以上皆是"},answer:"D"},
{id:80,question:"除另有約定外，複保險要保人應將下列何種資料通知各保險人：",options:{"A":"他保險人之名稱","B":"他保險人之保險金額","C":"以上皆是","D":"以上皆非"},answer:"C"},
{id:81,question:"責任保險保險單約定「被保險人對於第三人就其責任所為之承認、和解或賠償，未經保險人參與時，保險人不受拘束。」此一約定之效力如何",options:{"A":"無效","B":"效力未定","C":"得撤銷","D":"有效"},answer:"D"},
{id:82,question:"訂約時，僅要保人知危險發生者，而保險人不受契約之拘束時應如何處理",options:{"A":"保險人不得請求償還費用，亦不得請求已收受之保險費","B":"保險人得請求償還費用，亦無須返還已收受之保險費","C":"保險人不得請求償還費用，但得請求已收受之保險費","D":"保險人得請求償還費用，不得請求已收受之保險費"},answer:"B"},
{id:83,question:"要保人不實之說明，足以變更或減少保險人對於危險之估計者，致保險契約被解除時，保險費如何處理",options:{"A":"應返還","B":"無須返還","C":"可返還一半","D":"視個案而定"},answer:"B"},
{id:84,question:"關於財產保險業與人身保險業得經營業務之範圍，下列敘述何者錯誤",options:{"A":"人身保險業不得兼營財產保險","B":"財產保險業經營財產保險","C":"財產保險業經主管機關核准，得經營傷害保險","D":"財產保險業經主管機關核准，得經營年金保險"},answer:"D"},
{id:85,question:"要保人違反保險法據實說明義務之法律效力為何",options:{"A":"保險人須於知有解除之原因後一個月內解除契約","B":"保險人於危險發生後亦得解除契約","C":"以上皆是","D":"以上皆非"},answer:"C"},
{id:86,question:"要保人違反據實說明之義務，保險人知有解除之原因後，行使解除權之期限為多久",options:{"A":"一個月","B":"二個月","C":"三個月","D":"四個月"},answer:"A"},
{id:87,question:"保險契約訂立時，保險標的之危險已發生或已消滅，原則上其契約效力如何",options:{"A":"無效","B":"得終止","C":"得解除","D":"維持原狀"},answer:"A"},
{id:88,question:"訂約時僅要保人知危險已發生者，下列何者不受契約之約束",options:{"A":"保險人","B":"被保險人","C":"受益人","D":"保險經紀人"},answer:"A"},
{id:89,question:"要保人有為隱匿或遺漏不為說明，或為不實說明，足以變更或減少保險人對於危險之估計者，保險人得如何行使權利",options:{"A":"終止契約","B":"解除契約","C":"撤銷契約","D":"無效契約"},answer:"B"},
{id:90,question:"保險金額超過保險標的價值之契約，係由當事人一方之詐欺而訂立者，他方可以如何主張？",options:{"A":"得終止契約","B":"得撤銷契約","C":"得解除契約","D":"契約無效"},answer:"B"},
{id:91,question:"保險金額超過保險標的價值之契約。如無詐欺情事者，其契約僅於保險標的價值之限度內為有效，例外情形為何？",options:{"A":"定額保險","B":"不足額保險","C":"定值保險","D":"不定值保險"},answer:"C"},
{id:92,question:"無詐欺情事之超額保險契約，經當事人一方將超過價值之事實通知他方後，下列何項應按照保險標的之價值比例減少",options:{"A":"保險金額","B":"保險費","C":"保險金額及保險費","D":"以上皆非"},answer:"C"},
{id:93,question:"保險人對於下列何者之故意行為所致的損害須負賠償責任",options:{"A":"要保人","B":"被保險人","C":"要保人及被保險人","D":"保險經紀人"},answer:"D"},
{id:94,question:"保險人對戰爭所致的損害，下列何者敘述正確",options:{"A":"應負賠償責任","B":"不負賠償責任","C":"除契約有相反之訂定外，應負賠償責任","D":"以上皆非"},answer:"C"},
{id:95,question:"保險契約之解釋有疑義時，依法應做如何解釋",options:{"A":"作有利保險人之解釋為原則","B":"作有利被保險人之解釋為原則","C":"參考民法之規定","D":"提交公平會處理"},answer:"B"},
{id:96,question:"保險法對強制規定應如何處理",options:{"A":"皆不得以契約變更之","B":"皆得以契約變更之","C":"不得以契約變更之。但有利於被保險人者，不在此限","D":"視情形而定是否得變更之"},answer:"C"},
{id:97,question:"保險業經營各種保險之保險單條款規定如何",options:{"A":"限使用本國文字","B":"應使用國際上通用之文字","C":"應使用中文，但因業務需要，得使用外文，並附中文譯本或節譯本","D":"視情況而定"},answer:"C"},
{id:98,question:"以下何者屬當事人承認履行特種義務之條款",options:{"A":"特約條款","B":"特別條款","C":"特定條款","D":"特別約款"},answer:"A"},
{id:99,question:"依保險法規定下列有關特約條款之敘述，何者錯誤？",options:{"A":"與保險契約有關之一切事項，不限於將來事項，得以特約條款定之","B":"保險契約當事人之一方違背特約條款時，他方得解除契約；其危險發生後亦同","C":"關於未來事項之特約條款，於未屆履行期前危險已發生，或其履行為不可能，或在訂約地為不合法而未履行者，保險契約不因之而失效","D":"與保險契約有關之一切事項，僅限於將來事項，始得以特約條款定之"},answer:"D"},
{id:100,question:"保險契約當事人之一方違背特約條款時：",options:{"A":"他方得於事故發生後一個月內解除契約","B":"他方得於知悉後一個月內解除契約","C":"他方得於知悉後一個月內為撤銷契約之意思表示","D":"他方得於知悉後15日內為拒賠之意思表示"},answer:"B"},
{id:101,question:"保險公司刊登、播放廣告及進行業務招攬或營業促銷活動時，下列敘述何者正確？①不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事②應確保其廣告內容之真實③對金融消費者所負擔之義務不得低於前述廣告之內容④對金融消費者所負擔之義務不得低於營業促銷活動時對金融消費者所提示之資料或說明",options:{"A":"①②③④","B":"①②","C":"①②③","D":"①②④"},answer:"A"},
{id:102,question:"保險人對於由不可預料或不可抗力之事故所致之損害，負賠償責任，例外情形為何？",options:{"A":"由保險契約內容推論","B":"保險契約內有明文限制者","C":"順應情勢變更原則","D":"符合公平正義原則"},answer:"B"},
{id:103,question:"保險人對於因履行什麽義務所致之損害，應負賠償責任",options:{"A":"契約上","B":"倫理上","C":"道德上","D":"以上皆是"},answer:"C"},
{id:104,question:"保險人對於下列何者所致損害，應負賠償責任",options:{"A":"要保人之受僱人","B":"被保險人之受僱人","C":"要保人或被保險人所有之物或動物","D":"以上皆是"},answer:"D"},
{id:105,question:"變更財產保險契約或恢復停止效力之財產保險契約時，保險人於接到通知後十日內不為拒絕者，其結果如何？",options:{"A":"不受影響","B":"視為拒絕","C":"視為承諾","D":"以上皆非"},answer:"C"},
{id:106,question:"保險法之強制規定，不得以契約變更，但下列何種情形可以變更？",options:{"A":"有利保險人","B":"有利被保險人","C":"有利契約雙方當事人","D":"有利於利害關係人"},answer:"B"},
{id:107,question:"下列何種情形屬危險增加而要保人不需通知保險人？①損害之發生不影響保險人之負擔者②危險增加，不由於要保人之行為所致者③為防護保險人之利益者④為履行道德上之義務",options:{"A":"①②④","B":"①③④","C":"①②③","D":"①②③④"},answer:"B"},
{id:108,question:"要保人或被保險人不履行那些限期內通知義務者，對保險人因此所受損失，應負賠償責任",options:{"A":"保險事故消滅及危險減少","B":"保險事故發生及危險減少","C":"保險事故消滅及危險增加","D":"保險事故發生及危險增加"},answer:"D"},
{id:109,question:"下列何種情形要保人有通知義務",options:{"A":"危險減少","B":"危險增加","C":"損害係為履行道德義務","D":"依通常情況對方應知"},answer:"B"},
{id:110,question:"關於未來事項之特約條款，在何種情形下仍不因之使保險契約失效？①於未屆履行期前危險已發生②其履行為不可能③在訂約地為不合法而未履行",options:{"A":"①②","B":"②③","C":"①②③","D":"①③"},answer:"C"},
{id:111,question:"保險法規定，關於海上保險，適用下列那項規定？",options:{"A":"民法海上保險章","B":"英國海上保險法","C":"國際海牙規則","D":"海商法海上保險章"},answer:"D"},
{id:112,question:"關於貨物之保險，原則上自交運之時以迄於其目的地收貨之時為其期間。但例外情形為何？",options:{"A":"除民法另有規定外","B":"除契約另有訂定外","C":"除公路法另有規定外","D":"除海商法另有規定外"},answer:"B"},
{id:113,question:"下列何者，其保險契約載明保險標的一定價值",options:{"A":"定額保險契約","B":"定值保險契約","C":"不定值保險契約","D":"不定額保險契約"},answer:"B"},
{id:114,question:"契約上載明保險標之之價值，須至危險發生後估計而定之保險契約為何種保險",options:{"A":"定值保險","B":"不定值保險","C":"定額保險","D":"以上皆非"},answer:"B"},
{id:115,question:"下列何者為火災保險人在保險期內所負責任之最高額度",options:{"A":"保險價額","B":"保險價值","C":"保險金額","D":"保險標的物之約定價值"},answer:"C"},
{id:116,question:"保險標的未經約定價值，火災保險保險標的發生損失時，以何者為計算賠償之標準？",options:{"A":"保險事故發生時之市價","B":"訂約時之實際價值","C":"保險事故發生時之重置價值","D":"保險事故發生時實際價值，且最多以保險金額為限。"},answer:"D"},
{id:117,question:"依金融消費者保護法規定，金融服務業與金融消費者訂立提供金融商品或服務之契約前，應為下列何者之行為？①應向金融消費者充分說明該金融商品、服務及契約之重要內容②應向金融消費者充分揭露其風險③應保證金融消費者獲利④應與其他金融商品作比較",options:{"A":"①②③④","B":"①②④","C":"①②","D":"開①②③"},answer:"C"},
{id:118,question:"要保人為他人利益訂立保險契約，保險人對於要保人所得為之抗辯，亦得以之對抗誰？",options:{"A":"被保險人","B":"受益人","C":"保險代理人","D":"保險經紀人"},answer:"B"},
{id:119,question:"善意複保險，其保險金額之總額超過保險標的之價值者，於何時要保人得依超過部份，要求比例返還保險費？",options:{"A":"危險發生前","B":"危險發生後","C":"危險發生前或後","D":"以上皆非"},answer:"A"},
{id:120,question:"保險契約因惡意複保險而無效者，保險人在何時期內，仍取得保險費",options:{"A":"知情","B":"不知情","C":"不論知情或不知情","D":"以上皆非"},answer:"B"},
{id:121,question:"保險人破產時，保險契約及保險費如何處理？",options:{"A":"於破產宣告之日繼續有效，保費不須退還","B":"於破產宣告之日終止保險契約，終止後之保險費，已交付者，保費應返還","C":"於破產宣告之日終止，但不須返還保費","D":"以上皆非"},answer:"B"},
{id:122,question:"要保人破產時，保險契約終止後之保險費已交付者，應如何處理？",options:{"A":"不須返還","B":"應返還","C":"可返還亦可不返還","D":"以上皆非"},answer:"B"},
{id:123,question:"以下那一項非保險公證人之工作範圍：",options:{"A":"保險標的物之查勘、鑑定","B":"保險標的物之估價","C":"賠款之理算、洽商","D":"保險標的之修復"},answer:"D"},
{id:124,question:"保險標的物非因承保事故而全部滅失，下列何者敘述正確",options:{"A":"保險契約終止，終止後之保險費已交付者應返還","B":"保險契約解除，全部之保險費已交付者應返還","C":"保險契約無效，全部之保險費應返還","D":"保險契約無效，終止後之保險費已交付者應返還"},answer:"A"},
{id:125,question:"下下列何者屬聯保險人為避免或減輕損害之必要行為所生之費用",options:{"A":"救助費用","B":"損害防阻費用","C":"救災費用","D":"以上皆非"},answer:"B"},
{id:126,question:"保險法規定保險人對於被保險人為避免或減輕損害之必要行為所生之費用負償還之責用意為何",options:{"A":"鼓勵被保險人減少損害","B":"儘可能多想辦法增加保險給付","C":"提高大家對保險的興趣","D":"以上皆是"},answer:"A"},
{id:127,question:"保險契約若無規定，則依保險法之規定，遇有保險人應負保險責任之事故發生，被保險人應於何時限內為通知？",options:{"A":"知悉後10日","B":"發生後72小時","C":"知悉後5日","D":"發生後48小時"},answer:"C"},
{id:128,question:"危險達於應增加保險費或終止契約之程度者，依法如何處理",options:{"A":"由於要保人或被保險人之行為所致者，應於知悉後通知","B":"由於要保人或被保險人之行為所致者，應先通知","C":"不由於要保人或被保險人之行為所致者，應先通知","D":"不由於要保人或被保險人之行為所致者，應於知悉後5日內通知"},answer:"B"},
{id:129,question:"老張把自己的住宅改成牛肉麵店，造成危險增加達到應增加保險費的程度，對保險人應如何處理",options:{"A":"應事先通知保險人","B":"開張後十日內通知保險人","C":"不通知保險人","D":"發生危險時再補通知保險人"},answer:"A"},
{id:130,question:"由保險契約所生之權利，依法自何時起，經過二年不行使而消滅？",options:{"A":"自應賠付之日起","B":"自得為訴訟時起","C":"自得為請求之日起","D":"並未規定"},answer:"C"},
{id:131,question:"責任保險之被保險人應於何時內對保險人為請求？",options:{"A":"事故發生時起二年","B":"被保險人知悉之日起二年","C":"被保險人受第三人請求之日起二年","D":"以保險人受第三人通知之日起二年"},answer:"C"},
{id:132,question:"因救護保險標的物，致保險標的物發生損失者，下列何者正確",options:{"A":"由被保險人自行負擔","B":"視同所保危險所生之損失","C":"要另行加保才能賠償","D":"須由保險人另行同意才能賠償"},answer:"B"},
{id:133,question:"下列何者屬火災保險人須賠償給被保險人損失？①保險標的物之毀損滅失②因救護保險標的物所致保險標的物之損失③避免或減輕損害之必要行為所生之費用",options:{"A":"①②","B":"②③","C":"①②③","D":"①③"},answer:"C"},
{id:134,question:"火災保險之損失清單交出後多少時間後損失尚未完全估定者，被保險人得請求先行交付其所應得之最低賠償金額：",options:{"A":"半個月","B":"一個月","C":"二個月","D":"三個月"},answer:"C"},
{id:135,question:"火災保險之被保險人為證明及估計損失所支出之必要費用，依法如何處理",options:{"A":"除契約另有訂定外，由保險人負擔","B":"一律由保險人負擔","C":"一律由被保險人負擔","D":"臨時協議決定"},answer:"A"},
{id:136,question:"火災保險標的物受部份之損失者，保險人終止契約時，應於多久前通知要保人：",options:{"A":"5日","B":"10日","C":"15日","D":"20日"},answer:"C"},
{id:137,question:"危險增加，由於要保人或被保險人之行為所致者，要保人不同意保險人另定保險費而終止契約時，保險人如有損失應如何處理？",options:{"A":"不得請求賠償","B":"得請求賠償","C":"應視情況而定再決定是否得請求賠償","D":"以上皆非"},answer:"B"},
{id:138,question:"保險人知危險增加後，於何種情形下，喪失契約終止及損害賠償權利？①仍繼續收受保險費②危險發生後給付賠償金額③除前二項情形外，其他維持契約之表示者④要保人對於另定保險費不同意",options:{"A":"①②③④","B":"①②④","C":"①②③","D":"①③④"},answer:"C"},
{id:139,question:"要保人對於危險之說明，有為隱匿或遺漏不為說明或，不實之說明者，足以變更或減少保險人對於危險之估計者，保險人得解除契約自何時起算一個月不行使而消滅？",options:{"A":"自要保人知情之日","B":"自被保險人知情之日","C":"自保險人知情之日","D":"自受益人知情之日"},answer:"C"},
{id:140,question:"火災保險標的全部滅失或毀損，達於不能修復，或其修復之費用，超過保險標的恢復原狀所需者，保險法稱謂何種損失：",options:{"A":"共同海損","B":"部份損失","C":"全部損失","D":"推定全損"},answer:"C"},
{id:141,question:"火災保險標的物不能以市價估計者，應如何定其價值？",options:{"A":"得由保險公證人決定","B":"得由保險代理人決定","C":"得由保險經紀人決定","D":"得由當事人約定"},answer:"D"},
{id:142,question:"要保人或被保險人，對於保險標的物未盡約定保護責任所致的損失",options:{"A":"保險人不負賠償責任","B":"保險人仍負賠償責任","C":"因而增加的損失不負賠償責任","D":"視情況而定"},answer:"A"},
{id:143,question:"危險事故發生後，經鑑定係因要保人或被保險人未盡合理方法保護標的物，其結果依法為何",options:{"A":"保險人不負全部賠償責任","B":"保險人仍負全部賠償責任","C":"因而增加之損失，保險人不負賠償責任","D":"視情況而定"},answer:"C"},
{id:144,question:"保險人行使代位求償權時，其得請求之數額依法以不逾何者為限",options:{"A":"賠償金額","B":"實際損失金額","C":"保險金額","D":"並未規定"},answer:"A"},
{id:145,question:"保險人行使代位求償權之基本條件是被保險人對於何者應有損失賠償請求權",options:{"A":"保險人","B":"第三人","C":"受益人","D":"要保人"},answer:"B"},
{id:146,question:"侵權行為之行為人係被保險人之家屬時，保險人有否代位求償權",options:{"A":"有代位求償權","B":"無代位求償權","C":"經被保險人同意，有代位求償權","D":"只有在行為人係故意時，保險人始有代位求償權"},answer:"D"},
{id:147,question:"保險人對被保險人之受僱人有否代位求償權",options:{"A":"有代位求償權","B":"無代位求償權","C":"該受僱人若為故意行為，則有代位求償權","D":"該受僱人若為過失行為，則有代位求償權"},answer:"C"},
{id:148,question:"保險代理人是保險契約的：",options:{"A":"當事人","B":"要保人","C":"要保人之代理人","D":"保險人之代理人"},answer:"D"},
{id:149,question:"責任保險人在何種情況下可以直接對第三人為賠償金額之給付：",options:{"A":"應第三人要求","B":"經被保險人通知","C":"應受益人要求","D":"應第三人之家屬要求"},answer:"B"},
{id:150,question:"在何種情形下，第三人可以直接向保險人請求賠償",options:{"A":"被保險人之責任已經確定","B":"在保險金額範圍內","C":"依該第三人應得之比例","D":"以上全要符合"},answer:"D"},
{id:151,question:"以受僱人之不誠實行為為保險事故之保證保險契約，應記載下列哪些事項？①保險法第55條規定記載事項②被保險人之姓名及住所③受僱人之姓名、職稱④其他得以認定為受僱人之方式",options:{"A":"①②③④","B":"①②","C":"①②③","D":"①③④"},answer:"A"},
{id:152,question:"以債務人之不履行債務為保險事故之保證保險契約，應記載下列哪些事項？①保險法第55條規定記載事項②開被保險人之姓名及住所③債務人之姓名④其他得以認定為債務人之方式",options:{"A":"①②③④","B":"①②","C":"①②③","D":"①③④"},answer:"A"},
{id:153,question:"下列何者屬保險人不得行使代位求償權的險種",options:{"A":"傷害保險","B":"海上保險","C":"火災保險","D":"保證保險"},answer:"A"},
{id:154,question:"下列何者適用個人資料保護法？①公務機關②非公務機關③公務機關以外之自然人④公務機關以外之法人或其他團體",options:{"A":"①②③④","B":"①②","C":"開①②③","D":"①③④"},answer:"A"},
{id:155,question:"下列何者屬傷害保險人不負給付保險金額之行為？①被保險人故意自殺②被保險人遭受意外傷害所致死亡③被保險人犯罪行為④被保險人遭受意外傷害所致失能",options:{"A":"①②③④","B":"①③④","C":"①②③","D":"①③"},answer:"D"},
{id:156,question:"於再保險中，原保險契約之被保險人權利為何",options:{"A":"對於再保險人無賠償請求權。但原保險契約及再保險契約另有約定者不在此限","B":"對於再保險人無賠償請求權，但原保險人破產時不在此限","C":"對於再保險人有直接賠償請求權","D":"可透過再保險經紀人行使賠償請求權"},answer:"A"},
{id:157,question:"健康保險之要保人破產時契約效力為何",options:{"A":"契約無效","B":"契約終止","C":"契約訂有受益人者，仍為受益人之利益而存在","D":"以上皆非"},answer:"A"},
{id:158,question:"健康保險之保險人破產時，受益人對於保險人得請求之保險金額之債權，以其保單價值準備金按下列哪一項比例計算之",options:{"A":"保險金額","B":"訂約時之保險費率","C":"保險費","D":"損失率"},answer:"B"},
{id:159,question:"健康保險契約，若被保險人不與要保人為同一人時，除應載明保險法第55條規定事項外，尚應記載哪些事項？①被保險人姓名②被保險人年齡③被保險人住所④被保險人與要保人之關係",options:{"A":"①②③④","B":"①②④","C":"①②③","D":"①③④"},answer:"A"},
{id:160,question:"下列何者為強制汽車責任保險法的立法目的？①為使汽車交通事故所致傷害之受害人，能迅速獲得基本保障②為使汽車交通事故所致死亡之受害人，能迅速獲得基本保障③為使汽車交通事故所致財產損失能獲得保障④維護道路交通安全",options:{"A":"①②③④","B":"①②④","C":"①②③","D":"①③④"},answer:"B"},
{id:161,question:"下列何種車輛依法應投保強制汽車責任保險？①強制汽車責任保險法所稱汽車②強制汽車責任保險法所稱機車③特定之非依軌道行駛，具有運輸功能之路上動力車輛④醫療用電動代步車",options:{"A":"①②③④","B":"①②④","C":"①②③","D":"①③④"},answer:"C"},
{id:162,question:"強制汽車責任保險法規定之請求權人包括那些人？①因汽車交通事故遭致傷害之受害人本人②因汽車交通事故死亡者，為受害人之父母③因汽車交通事故死亡者，為受害人之子女④因汽車交通事故死亡者，為受害人之配偶",options:{"A":"①②③④","B":"①②④","C":"①②③","D":"①③④"},answer:"A"},
{id:163,question:"汽車交通事故的受害人之遺屬申請強制汽車責任保險給付或補償，應如何處理？",options:{"A":"父母優先","B":"子女優先","C":"配偶優先","D":"以前揭三者平均分配保險給付或補償"},answer:"D"},
{id:164,question:"洗錢防制法所稱洗錢，係指①意圖掩飾或隱匿特定犯罪所得來源而移轉或變更特定犯罪所得②使他人逃避刑事追訴，而移轉或變更特定犯罪所得③掩飾或隱匿特定犯罪所得之本質④收受、持有或使用他人之特定犯罪所得",options:{"A":"①②③④","B":"①②④","C":"①②③","D":"①③④"},answer:"A"},
{id:165,question:"洗錢防制法所稱特定犯罪，包括最輕本刑為多久以上有期徒刑以上之刑之罪？",options:{"A":"一年","B":"三年","C":"六月","D":"局七年"},answer:"C"},
{id:166,question:"洗錢防制法所稱因犯罪所得財物或財產上利益所指為何？①因特定犯罪而取得之財物②因特定犯罪而變得之財物③因特定犯罪而取得之財產上利益④因特定犯罪而取得之財產上利益及其孳息",options:{"A":"①②④","B":"①②③④","C":"①②③","D":"①③④"},answer:"B"},
{id:167,question:"金融機構對於達一定金額以上之通貨交易應向何單位申報：",options:{"A":"財政部","B":"稅捐處","C":"法務部調查局","D":"法院"},answer:"C"},
{id:168,question:"為防制洗錢，政府依互惠原則，得與外國那些單位簽訂防制洗錢之條約或協定？①外國政府②外國機構③國際組織",options:{"A":"①②","B":"②③","C":"①②③","D":"①③"},answer:"C"},
{id:169,question:"金融機構對於達一定金額以上之通貨交易應申報，該一定金額所指為多少：",options:{"A":"新臺幣五十萬元","B":"新臺幣一百萬元","C":"新臺幣一百私十萬元","D":"新臺幣二百萬元"},answer:"A"},
{id:170,question:"依金融機構防制洗錢辦法規定，通貨交易所指為何？①單筆現金收入②單筆現金付出③換鈔交易④在會計處理上，凡以現金收支傳票記帳者皆屬之",options:{"A":"①③④","B":"①②④","C":"①②③","D":"①②③④"},answer:"D"},
{id:171,question:"金融機構對疑似洗錢或資恐交易之申報，於專責主管核定後多久以内向調査局申報：",options:{"A":"三個營業日","B":"五個營業日","C":"七個營業日","D":"核定後之申報期限不得逾二個營業日"},answer:"D"},
{id:172,question:"汽車交通事故僅涉及自己汽車而無他人傷亡者，對於駕駛被保險汽車之人，強制汽車責任險之保險人是否應負給付賠償責任？",options:{"A":"應予賠付","B":"不應予賠付","C":"視責任而定","D":"以上皆非"},answer:"B"},
{id:173,question:"依個人資料保護法規定，指以任何方式取得個人資料即謂",options:{"A":"處理","B":"蒐集","C":"利用","D":"傳輸"},answer:"B"},
{id:174,question:"下列何種情形請求權人得依強制汽車責任保險法規定向特別補償基金請求補償？",options:{"A":"事故汽車無法查究，或事故汽車為未保險汽車","B":"事故汽車係未經被保險人同意使用管理之被保險汽車","C":"事故汽車全部或部分為無須訂立本保險契約之汽車","D":"以上皆是"},answer:"D"},
{id:175,question:"保險人辦理強制汽車責任保險之保險費，其預期損失與實際損失有差額時應如何處理？",options:{"A":"可收回作收益處理","B":"繳存為安定基金","C":"繳交特別補償基金運用","D":"應提存為特別準備金，除因調整保險費率、調高保險金額、彌補純保險費虧損或依所定辦法處理外，不得收回、移轉或供其他用途"},answer:"D"},
{id:176,question:"依個人資料保護法規定，指將蒐集之個人資料為處理以外之使用即謂",options:{"A":"蒐集","B":"傳輸","C":"利用","D":"儲存"},answer:"C"},
{id:177,question:"個人資料之蒐集、處理或利用，不得逾越什麽目的之必要範圍：",options:{"A":"共同目的","B":"特定目的","C":"一般目的","D":"任意目的"},answer:"B"},
{id:178,question:"汽車交通事故發生時，被保險人或加害人應如何處理？①救助受害人②立即報警處理，可立即電話向承保公司報案，並於五日內以書面通知保險公司③被保險人、加害人及請求權人應與保險公司合作，提供人証、物証等有關資料及文件",options:{"A":"①②③","B":"①②","C":"②③","D":"①③"},answer:"A"},
{id:179,question:"公務機關或非公務機關依個人資料保護法規定向當事人蒐集個人資料時，應明確告知當事人下列何事項？①蒐集之目的②個人資料之類別③個人資料利用之期間、地區、對象及方式④公務機關或非公務機關名稱",options:{"A":"①②③④","B":"①②④","C":"①②③","D":"①③④"},answer:"A"},
{id:180,question:"機車所有人未投保強制汽車責任保險，若經公路監理機關或警察機關攔檢稽查舉發者，由公路主管機關處以罰鍰，處罰新臺幣多少元？",options:{"A":"1,500元以上3,000元以下","B":"2,000元以上3,000元以下","C":"1,000元以上3,000元以下","D":"3,000元以上6,000元以下"},answer:"A"},
{id:181,question:"依個人資料保護法規定，當事人就其個人資料得行使權利，以下何者為其不得預先拋棄或以特約限制之？①查詢或請求閱覽②請求製給複製本③請求補充或更正④請求停止蒐集、處理或利用",options:{"A":"①②③④","B":"①②④","C":"①②③","D":"①③④"},answer:"A"},
{id:182,question:"個人資料蒐集之特定目的消失或期限屆滿時，應主動或依當事人之請求，刪除、停止處理或利用該個人資料。但在下列何種情形下則不在此限？①因執行職務所必須②因執行業務所必須③經當事人書面同意④未來另有行銷用途",options:{"A":"①②③④","B":"①②④","C":"①②③","D":"①③"},answer:"C"},
{id:183,question:"被保險汽車發生交通事故時，被保險人或加害人應立即報請當地警、憲機關處理，並應於幾日內以書面通知保險人？",options:{"A":"三日","B":"五日","C":"七日","D":"十日"},answer:"B"},
{id:184,question:"公務機關或非公務機關違反個人資料保護法規定，致個人資料被竊取、洩漏、竄改或其他侵害者，應查明後以何種方式通知當事人",options:{"A":"強制方式","B":"任意方式","C":"適當方式","D":"硬性方式"},answer:"C"},
{id:185,question:"下列那種情形是強制汽車責任保險法規定，其使用人或管理人為本保險之投保義務人？①汽車牌照已繳還、繳銷或註銷而仍使用者②汽車所有人不明③因可歸責於汽車使用人或管理人之事由，致汽車所有人無法管理或使用汽車",options:{"A":"①②","B":"②③","C":"①②③","D":"①③"},answer:"C"},
{id:186,question:"依個人資料保護法規定，損害賠償請求權，自損害發生時起，逾幾年不行使而消滅：",options:{"A":"三年","B":"五年","C":"二年","D":"七年"},answer:"C"},
{id:187,question:"損害賠償除依個人資料保護法已有規定外，非公務機關適用何法之規定：",options:{"A":"民法","B":"國家賠償法","C":"民事訴訟法","D":"強制執行法"},answer:"A"}
